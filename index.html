<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151412">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Soan Kofe POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<style>
/* Layout: sidebar hitam + konten krem; kasir = grid produk + panel pesanan; motif lingkaran konsentris dari brand */
:root{
  --bg:#F6EFE6; --surface:#FFFFFF; --surface-2:#FAF5EC; --ink:#151412; --muted:#6B645B; --line:#E6DDD0; --line-2:#CFC4B3;
  --amber:#F2A31B; --amber-soft:#FCEBC8; --on-amber:#151412;
  --ok:#2C7A4B; --ok-soft:#DCEFE2; --warn:#A85F08; --warn-soft:#FBE6CC; --bad:#B3361F; --bad-soft:#F8DCD5;
  --side:#151412; --side-fg:#F6EFE6; --side-muted:#9A9186; --side-line:#2A2724;
  --paper:#FFFDF8; --paper-ink:#151412;
  --font-display:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1C1A17; --surface-2:#242119; --ink:#F6EFE6; --muted:#A39A8E; --line:#33302A; --line-2:#4A453C;
  --amber:#F5AE2E; --amber-soft:#3B2D12; --ok:#6CCB92; --ok-soft:#1B3325; --warn:#F0A94E; --warn-soft:#3A2A12; --bad:#F08A76; --bad-soft:#3B1E18;
  --side:#0B0A09; --side-line:#24211E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1C1A17; --surface-2:#242119; --ink:#F6EFE6; --muted:#A39A8E; --line:#33302A; --line-2:#4A453C;
  --amber:#F5AE2E; --amber-soft:#3B2D12; --ok:#6CCB92; --ok-soft:#1B3325; --warn:#F0A94E; --warn-soft:#3A2A12; --bad:#F08A76; --bad-soft:#3B1E18;
  --side:#0B0A09; --side-line:#24211E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 13.5px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.lbl{font:600 10.5px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ico{width:20px;height:20px;flex:none}
.mark{width:36px;height:36px;flex:none;color:var(--ink);--mark-gap:var(--surface)}
.mark-sm{width:30px;height:30px}.mark-lg{width:72px;height:72px}
.wm{display:inline-flex;flex-direction:column;line-height:1}
.wm b{font:800 26px/1 var(--font-display);letter-spacing:-.02em}
.wm i{font:500 9px/1 var(--font-display);letter-spacing:.7em;font-style:normal;margin-top:5px;padding-left:2px}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 13px var(--font-body);cursor:pointer;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line-2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:0 14px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer}
.icon-btn.sm{width:30px;height:30px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* form */
.in,.sel,.ta{width:100%;min-height:42px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 13.5px var(--font-body)}
.ta{padding:10px 14px;min-height:80px;resize:vertical}
.in:focus,.sel:focus,.ta:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--amber-soft)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--amber)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px/1.4 var(--font-body);background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
a.btn{text-decoration:none}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.amber{background:var(--amber-soft);color:var(--ink);border-color:transparent}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--amber);color:var(--on-amber);font:700 11px var(--font-body)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:17px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;align-self:start;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:22px;padding:22px 14px;overflow-y:auto}
.side .mark{color:var(--side-fg);--mark-gap:var(--side)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--side-muted);font:600 13px var(--font-body);cursor:pointer;text-align:left}
.nav-i:hover{color:var(--side-fg)}
.nav-i.on{background:var(--amber);color:var(--on-amber)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.nav-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
a.nav-i,a.tab{text-decoration:none}
.nav-gh.act{color:var(--side-fg)}
.nav-chev{margin-left:auto;width:16px;height:16px;transition:transform .15s;flex:none}.nav-chev.open{transform:rotate(90deg)}
.nav-sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 20px;padding-left:10px;border-left:1px solid var(--side-line)}
.nav-sub .nav-i{min-height:38px;font-size:12.5px}
.sheet{display:flex;flex-direction:column}
.sheet-g{display:flex;align-items:center;gap:10px;padding:12px 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sheet-i{width:100%;border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;text-decoration:none}
.sheet-i.on b{color:var(--amber)}
.pg{display:flex;flex-direction:column;gap:12px;max-width:760px}
.pg-h{margin:0;font-size:22px}.pg-p{margin:0;line-height:1.6}.pg-img{max-width:100%;border-radius:14px;display:block}
.pg-btn{align-self:flex-start;text-decoration:none}.pg-hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.shift-card{border:1px solid var(--side-line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--side-muted)}
.shift-card b{color:var(--side-fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:var(--muted)}
.user-chip{display:flex;align-items:center;gap:10px;padding:0 6px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font:700 14px var(--font-display);flex:none}
.user-chip .who{min-width:0;flex:1;line-height:1.25}
.user-chip .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .who span{font-size:11px;color:var(--side-muted)}
.user-chip .icon-btn{border-color:var(--side-line);color:var(--side-fg)}
.main-wrap{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,28px);background:var(--bg);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:24px;line-height:1.1}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.top .only-m.mark{display:none}
.content{padding-inline:clamp(16px,3vw,28px);padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;border-radius:14px;background:transparent;color:var(--side-muted);font:600 10px var(--font-body);cursor:pointer}
.tab.on{color:var(--on-amber);background:var(--amber)}
.only-m{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.toolbar-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar-r .search{width:240px;max-width:100%}
.toolbar-r .sel{width:auto;min-width:130px}
.chips{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font:600 12.5px var(--font-body);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:flex;border:1.5px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.seg button{flex:1;min-height:34px;border:0;border-radius:999px;background:transparent;font:600 12px var(--font-body);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* kasir */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.pos-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min,158px),1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;min-height:128px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer;transition:border-color .12s,transform .08s}
.tile:hover{border-color:var(--ink)}
.tile:active{transform:scale(.98)}
.tile .mark{width:30px;height:30px;color:var(--ink)}
.tile .tn{font:600 15px/1.2 var(--font-display);margin-top:4px;flex:1}
.tile .tp{font:700 13px var(--font-body);font-variant-numeric:tabular-nums}
.tile .ts{font-size:11px;color:var(--muted)}
.tile .ts.low{color:var(--warn);font-weight:700}
.tile.out{opacity:.45;cursor:not-allowed}
.tile-qty{position:absolute;top:12px;right:12px}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:84px;max-height:calc(100vh - 104px)}
.cart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cart-head h2{font-size:20px}
.cart-head-btns{display:flex;gap:8px;align-items:center}
.cust-btn{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 14px;border:1.5px dashed var(--line-2);border-radius:14px;background:transparent;cursor:pointer;font:600 12.5px var(--font-body);text-align:left}
.cart-items{flex:1;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci-name{font:600 14px/1.25 var(--font-display)}
.ci-sub{font-size:11.5px;color:var(--muted)}
.ci-sub em{font-style:normal;color:var(--ink)}
.ci-tot{font:700 13px var(--font-body);text-align:right;font-variant-numeric:tabular-nums}
.ci-ctl{display:flex;align-items:center;gap:6px}
.qbtn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;font:700 16px/1 var(--font-body);display:grid;place-items:center}
.ci .q{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ci-act{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cart-sum{display:flex;flex-direction:column;gap:6px;font-size:13px}
.sumr{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sumr.tot{font:700 22px var(--font-display);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.link{border:0;background:none;padding:0;color:var(--ink);font:600 12.5px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.cart-foot{display:grid;grid-template-columns:auto 1fr;gap:10px}
.cart-fab{display:none}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px}
.empty .mark{width:54px;height:54px;opacity:.9}
.center-card{max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.center-card .btn{align-self:stretch}

/* tabel */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font:600 10.5px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface-2)}
.r{text-align:right;font-variant-numeric:tabular-nums}
td .sub{font-size:11.5px;color:var(--muted)}
td b{font-weight:600}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sumbar b{color:var(--ink)}

/* kpi + laporan */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font:700 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .lbl{color:var(--line-2)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 10px var(--font-body)}
.chart .bar{fill:var(--amber)}
.chart .bar.hl{fill:var(--ink)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.hb-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-row .vl{font-variant-numeric:tabular-nums;font-weight:700}
.hb-track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.hb-fill{height:100%;background:var(--amber);border-radius:99px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.stack span{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.c-cash{background:var(--amber)}.c-qris{background:var(--ink)}.c-debit{background:var(--muted)}.c-transfer{background:var(--line-2)}
.delta{font:700 11px var(--font-body)}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}

/* cetak */
#print-area{display:none}
code{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);padding:1px 6px;border-radius:6px}
@media print{
  html,body{background:#fff!important;color:#000!important}
  #app,#modal-root,#toast{display:none!important}
  #print-area{display:block!important;font:9.4px/1.3 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:0;padding:0;color:#000}
}
@page{margin:0}

/* resep & bahan */
.rc{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px dashed var(--line-2);border-radius:18px;background:var(--surface-2)}
.rc-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 34px;gap:8px;align-items:center}
.rc-row .rc-c{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.rc-q{position:relative}
.rc-q .in{padding-right:38px;text-align:right}
.rc-u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);pointer-events:none}
.rc-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.rc-sum div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-sum b{font:700 17px var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hint{font-size:11.5px;color:var(--muted)}
.cover{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* modal + toast */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,9,8,.58);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;border-radius:26px 26px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.modal-h h3{font-size:20px}
.modal-b{padding:4px 20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font:600 13px var(--font-body);opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.big-total{font:700 38px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pm button{min-height:44px;border-radius:14px;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;font:600 12.5px var(--font-body)}
.pm button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.change-box{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}

.qr-note{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.receipt{background:var(--paper);color:var(--paper-ink);font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:20px 18px;border-radius:14px;border:1px dashed var(--line-2)}

.receipt hr{border:0;border-top:1px dashed #b9afa0;margin:10px 0}
.rl{display:flex;justify-content:space-between;gap:10px}

.void-stamp{border:2px solid var(--bad);color:var(--bad);display:inline-block;padding:2px 12px;border-radius:6px;font-weight:700;transform:rotate(-4deg);margin:6px 0}
textarea.code{font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:200px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .l{min-width:0}
.list-row .l b{display:block;font-weight:600}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar i.warn{background:var(--warn)}.pbar i.bad{background:var(--bad)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--amber-soft);font-size:12.5px;flex-wrap:wrap}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}

.u-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

};
const ico=(n,c='')=>'<svg class="ico '+c+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';

/* ========== bahan baku & resep ========== */
const hasRecipe=p=>Array.isArray(p.recipe)&&p.recipe.length>0;
const modeOf=p=>p.mode==='recipe'&&hasRecipe(p)?'recipe':(p.mode==='stock'||(!p.mode&&p.track))?'stock':'none';
const recipeCost=(rec,list)=>Math.round(rec.reduce((a,r)=>{const g=list.find(x=>x.id===r.iid);return a+(g?g.cost*r.qty:0)},0));
const UNITS=['gr','ml','pcs'];
const SEED_ING=[
 ['i-espresso','Biji Espresso Blend','g',4200,1000,150,'Soan Roastery'],
];
const DEMO_RECIPES={
 'KP-001':[['i-espresso',18],['i-cup',1]],
};
function demoIngredients(list,log,products,now){
  SEED_ING.forEach(a=>{list.push({id:a[0],name:a[1],unit:a[2],stock:a[3],min:a[4],cost:a[5],supplier:a[6],active:true});log.push({id:uid(),ts:addDays(now,-14),iid:a[0],type:'restock',qty:a[3],note:'Stok awal',unitCost:a[5],userId:'u-owner'})});
  products.forEach(p=>{const r=DEMO_RECIPES[p.sku];if(!r)return;p.recipe=r.map(x=>({iid:x[0],qty:x[1]}));p.mode='recipe';p.track=false;p.cost=recipeCost(p.recipe,list)});
}
function migrate(d){
  let ch=false;
  if(!Array.isArray(d.ingredients)){d.ingredients=[];ch=true}
  if(!Array.isArray(d.ingLog)){d.ingLog=[];ch=true}
  if(d.settings.blockOut===undefined){d.settings.blockOut=true;ch=true}
  if((d.v||1)<2){
    if(d.demo&&!d.ingredients.length)demoIngredients(d.ingredients,d.ingLog,d.products,Date.now());
    d.products.forEach(p=>{if(!p.mode)p.mode=hasRecipe(p)?'recipe':p.track?'stock':'none'});
    d.v=2;ch=true;
  }
  return ch;
}

/* ========== seed data ========== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function roundUp(n,s){return Math.ceil(n/s)*s}
function computeTotals(items,disc,st){
  const subtotal=items.reduce((a,i)=>a+i.price*i.qty,0);
  const dv=disc&&disc.value?disc.value:0;
  const discount=disc&&disc.type==='pct'?Math.round(subtotal*Math.min(100,dv)/100):Math.min(subtotal,dv);
  const base=subtotal-discount;
  const service=st.serviceEnabled?Math.round(base*st.serviceRate/100):0;
  const tax=st.taxEnabled?Math.round((base+service)*st.taxRate/100):0;
  return{subtotal,discount,service,tax,total:base+service+tax};
}
function seed(){
  const R=mulberry(20261004),now=Date.now();
  const st={storeName:'Soan Kofe',tagline:'Instagram : @soankofe',address:'Jl.Taman Lebak Bulus IV Blok X, No.12A, Komplek Lebak Lestari Indah Residence',taxEnabled:true,taxRate:11,serviceEnabled:false,serviceRate:5,footer:'Pass: koncokoncosoan, #monggosoan.',prefix:'SK',pointsPer:10000,blockOut:true};
  const users=[{id:'u-owner',name:'Owner',role:'owner',pin:'1234'},{id:'u-barista',name:'Muhammad Azwar',role:'cashier',pin:'0000'}];
  const categories=[{id:'c-coffee',name:'Classic'},{id:'c-non',name:'Non-Coffee'}];
  const P=(sku,name,cat,price,cost,track,stock,min)=>({id:'p-'+sku.toLowerCase(),sku,name,cat,price,cost,track,stock,min,active:true,mode:track?'stock':'none'});
  const products=[
    P('KP-001','Espresso','c-coffee',18000,5500,false,0,0)
  ];
  const customers=[['Rina Kusuma','0812-1100-2201'],['Budi Santoso','0813-2200-3302']]
    .map((c,i)=>({id:'cu-'+i,name:c[0],phone:c[1],points:0,notes:'',created:addDays(now,-40-i*3)}));
  const ingredients=[],ingLog=[];demoIngredients(ingredients,ingLog,products,now);
  const kopiNon=products.filter(p=>p.cat==='c-coffee'||p.cat==='c-kopi'||p.cat==='c-non'),mak=products.filter(p=>p.cat==='c-mak'),retail=products.filter(p=>p.cat==='c-biji'||p.cat==='c-drip');
  const pick=a=>{if(!a.length)a=kopiNon.length?kopiNon:products;return a[Math.floor(R()*a.length)]};
  const hw=[3,5,4,3,2,4,5,3,3,4,5,5,3,2];
  const pickHour=()=>{const t=hw.reduce((a,b)=>a+b,0);let r=R()*t;for(let i=0;i<hw.length;i++){r-=hw[i];if(r<=0)return 8+i}return 9};
  const sales=[],shifts=[],stockLog=[];let seq=0;
  for(let d=13;d>=0;d--){
    const day=addDays(sod(now),-d),dow=new Date(day).getDay();
    const shiftId='s-'+d,openCash=500000;
    const sh={id:shiftId,userId:d%2?'u-barista':'u-owner',openTs:d===0?Math.min(day+7*36e5,now-60000):day+7*36e5,openCash,closeTs:null,closeCash:null,expectedCash:null,diff:null,note:'',moves:[]};
    if(d%3===1)sh.moves.push({ts:day+11*36e5,type:'out',amount:50000,note:'Beli es batu'});
    let count=16+((dow===0||dow===6)?10:0)+Math.floor(R()*8);
    const list=[];
    for(let k=0;k<count;k++){
      const ts=day+pickHour()*36e5+Math.floor(R()*59)*6e4+Math.floor(R()*59)*1e3;
      if(d===0&&ts>now-120000)continue;
      list.push(ts);
    }
    list.sort((a,b)=>a-b);
    list.forEach(ts=>{
      const n=1+Math.floor(R()*3),items=[];
      for(let i=0;i<n;i++){const r=R();const p=pick(r<.72?kopiNon:r<.92?mak:retail);const ex=items.find(x=>x.pid===p.id);const q=R()<.25?2:1;if(ex)ex.qty+=q;else items.push({pid:p.id,name:p.name,price:p.price,cost:p.cost,qty:q,note:''})}
      const disc=R()<.08?{type:'pct',value:10}:{type:'rp',value:0};
      const T=computeTotals(items,disc,st);
      const m=R(),method=m<.35?'cash':m<.8?'qris':m<.92?'debit':'transfer';
      const cust=R()<.22?pick(customers):null;
      const tr=R(),type=tr<.55?'dine':tr<.9?'take':'delivery';
      let paid=T.total,change=0;
      if(method==='cash'){paid=roundUp(T.total,R()<.5?10000:50000);change=paid-T.total}
      seq++;
      const dt=new Date(ts);
      const s=Object.assign({id:'s'+seq,no:st.prefix+'-'+String(dt.getFullYear()).slice(2)+pad(dt.getMonth()+1)+pad(dt.getDate())+'-'+String(seq).padStart(4,'0'),ts,userId:sh.userId,customerId:cust?cust.id:null,type,table:type==='dine'?String(1+Math.floor(R()*12)):'',items,discType:disc.type,discValue:disc.value,taxRate:st.taxRate,serviceRate:0,method,ref:'',paid,change,status:'paid',shiftId,points:0},T);
      if(cust){s.points=Math.floor(T.total/st.pointsPer);cust.points+=s.points}
      sales.push(s);
    });
    if(d>0){
      const cash=sales.filter(s=>s.shiftId===shiftId&&s.method==='cash').reduce((a,s)=>a+s.total,0);
      const out=sh.moves.reduce((a,m)=>a+(m.type==='out'?m.amount:0),0);
      sh.closeTs=day+22*36e5;sh.expectedCash=openCash+cash-out;
      sh.closeCash=sh.expectedCash+(R()<.7?0:(Math.round(R()*6)-3)*1000);sh.diff=sh.closeCash-sh.expectedCash;
    }
    shifts.push(sh);
  }
  products.filter(p=>p.track).forEach(p=>stockLog.push({id:uid(),ts:addDays(now,-14),pid:p.id,type:'restock',qty:p.stock,note:'Stok awal',userId:'u-owner'}));
  return{v:2,settings:st,users,categories,products,customers,sales,held:[],stockLog,ingredients,ingLog,shifts,seq:{sale:seq},demo:true};
}

function snapshotNow(label){lsSet(SNAP_KEY,JSON.stringify(db));lsSet(SNAP_META,JSON.stringify({ts:Date.now(),label}))}
function save(){
  try{
    let m=null;try{m=JSON.parse(lsGet(SNAP_META)||'null')}catch(e){}
    const today=new Date().toDateString();

function buildNav(list){
  const seen=new Set(),pages=[];
  const walk=(arr,depth,hidden,noCash)=>{const out=[];(Array.isArray(arr)?arr:[]).forEach(m=>{
    if(!m||typeof m!=='object'||typeof m.id!=='string')return;
    const hid=hidden||m.tampil===false,nc=noCash||m.kasir===false,lbl=txtOk(m.label,30);
    if(VIEW_IDS.includes(m.id)){
      if(seen.has(m.id))return;seen.add(m.id);const n=NAV.find(x=>x.id===m.id);
      if(lbl){n.label=lbl;n.short=txtOk(m.short,12)||(lbl.length<=12?lbl:lbl.split(' ')[0])}
      if(n.id==='settings')n.roles=['owner'];else if(n.id==='pos')n.roles=['owner','cashier'];
      else n.roles=hid?[]:nc?['owner']:['owner','cashier'];
      if((n.id==='settings'||n.id==='pos')&&hid)return;
      out.push({kind:'view',id:n.id});return;
    }
    if(seen.has(m.id)||!lbl)return;
    if(m.jenis==='grup'&&/^g-[\w-]{1,40}$/.test(m.id)){seen.add(m.id);const kids=walk(m.anak,depth+1,hid,nc);if(depth>=3){out.push(...kids);return}if(!hid)out.push({kind:'group',id:m.id,label:lbl,children:kids,kasir:!nc});return}
    if(m.jenis==='halaman'&&/^pg-[\w-]{1,40}$/.test(m.id)){seen.add(m.id);
      const blok=(Array.isArray(m.blok)?m.blok:[]).slice(0,60).filter(b=>b&&typeof b==='object').map(b=>({t:String(b.t||''),isi:typeof b.isi==='string'?b.isi.slice(0,4000):'',url:typeof b.url==='string'?b.url.trim():''}));
      pages.push({id:m.id,label:lbl,short:lbl.length<=12?lbl:lbl.split(' ')[0],icon:'page',roles:hid?[]:nc?['owner']:['owner','cashier'],blok});
      if(!hid)out.push({kind:'page',id:m.id});return}
    if(m.jenis==='tautan'&&/^ln-[\w-]{1,40}$/.test(m.id)&&urlOk(m.url)){seen.add(m.id);if(!hid)out.push({kind:'link',id:m.id,label:lbl,url:m.url.trim(),kasir:!nc})}
  });return out};
  const tree=walk(list,1,false,false);
  ['pos','settings'].forEach(id=>{if(!JSON.stringify(tree).includes('"id":"'+id+'"'))tree.push({kind:'view',id})});
  VIEW_IDS.forEach(id=>{if(!seen.has(id))tree.push({kind:'view',id})});
  return {tree,pages};
}

function nextNo(ts){
  db.seq.sale++;const d=new Date(ts);

function logStock(pid,type,qty,note){db.stockLog.push({id:uid(),ts:Date.now(),pid,type,qty,note,userId:S.user.id})}
function completeSale(){
  const cart=S.pos.cart;if(!cart.length)return;
  const T=totals(),p=S.pay,st=db.settings;
  let paid=T.total,change=0;
  if(p.method==='cash'){paid=num(p.received);if(paid<T.total)return;change=paid-T.total}
  const ts=Date.now(),no=nextNo(ts);
  const sale=Object.assign({id:uid(),no,ts,userId:S.user.id,customerId:S.pos.customerId,type:S.pos.type,table:S.pos.type==='dine'?S.pos.table:'',items:cart.map(i=>{const pr=prodById(i.pid),rc=pr&&modeOf(pr)==='recipe'?pr.recipe.map(r=>({iid:r.iid,qty:r.qty})):[];return{pid:i.pid,name:i.name,price:i.price,cost:pr?unitCost(pr):i.cost,qty:i.qty,note:i.note,rec:rc}}),discType:S.pos.disc.type,discValue:S.pos.disc.value,taxRate:st.taxEnabled?st.taxRate:0,serviceRate:st.serviceEnabled?st.serviceRate:0,method:p.method,ref:p.ref||'',paid,change,status:'paid',shiftId:curShift().id,points:0},T);
  cart.forEach(i=>{const pr=prodById(i.pid);if(pr&&modeOf(pr)==='stock'){pr.stock-=i.qty;logStock(pr.id,'sale',-i.qty,no)}});
  const use={};sale.items.forEach(i=>i.rec.forEach(r=>{use[r.iid]=(use[r.iid]||0)+r.qty*i.qty}));
  Object.keys(use).forEach(id=>{const g=ingById(id);if(g){g.stock=Math.round((g.stock-use[id])*1000)/1000;logIng(id,'sale',-use[id],no)}});
  const cu=sale.customerId?custById(sale.customerId):null;
  if(cu){sale.points=Math.floor(T.total/st.pointsPer);cu.points+=sale.points}
  db.sales.push(sale);save();
  S.pos=Object.assign(freshPos(),{cat:S.pos.cat,q:S.pos.q});S.pay=null;
  render();showReceipt(sale,true);autoPrint(sale);
}

function receiptText(s){
  const st=db.settings,W=32,L=(a,b)=>{a=String(a);b=String(b);return a+' '.repeat(Math.max(1,W-a.length-b.length))+b};
  const out=[st.storeName,st.address,'Telp '+st.phone,'-'.repeat(W),L('No',s.no),L('Waktu',fmtDT(s.ts)),L('Jenis',TYPES[s.type]+(s.table?' M'+s.table:'')),'-'.repeat(W)];
  s.items.forEach(i=>out.push(L(i.qty+'x '+i.name,Math.round(i.price*i.qty).toLocaleString('id-ID'))));
  out.push('-'.repeat(W),L('Subtotal',s.subtotal.toLocaleString('id-ID')));
  if(s.discount)out.push(L('Diskon','-'+s.discount.toLocaleString('id-ID')));
  if(s.service)out.push(L('Layanan',s.service.toLocaleString('id-ID')));
  if(s.tax)out.push(L('PPN '+s.taxRate+'%',s.tax.toLocaleString('id-ID')));
  out.push(L('TOTAL',rp(s.total)),L('Bayar '+METHODS[s.method],rp(s.paid)));
  if(s.method==='cash')out.push(L('Kembali',rp(s.change)));
  out.push('-'.repeat(W),st.footer);
  return out.join('\n');
}

/* ========== transaksi ========== */
function rangeBounds(k){
  const t0=sod(Date.now());
  switch(k){
    case 'today':return[t0,addDays(t0,1)];
    case 'yesterday':return[addDays(t0,-1),t0];
    case '7d':return[addDays(t0,-6),addDays(t0,1)];
    case '14d':return[addDays(t0,-13),addDays(t0,1)];
    case 'month':{const x=new Date(t0);x.setDate(1);return[x.getTime(),addDays(t0,1)]}
    default:return[0,addDays(t0,1)];
  }
}
function filteredSales(){
  const f=S.sf,[a,b]=rangeBounds(f.range),q=f.q.trim().toLowerCase();
  return db.sales.filter(s=>{
    if(s.ts<a||s.ts>=b)return false;
    if(f.status!=='all'&&s.status!==f.status)return false;
    if(f.method!=='all'&&s.method!==f.method)return false;
    if(q){const cu=s.customerId?custById(s.customerId):null;if(!(s.no.toLowerCase().includes(q)||(cu&&cu.name.toLowerCase().includes(q))))return false}
    return true;
  }).sort((x,y)=>y.ts-x.ts);
}
function salesListHTML(){
  const list=filteredSales();
  if(!list.length)return empty('Belum ada transaksi','Ubah filter tanggal atau mulai berjualan di menu Kasir.');
  const paid=list.filter(s=>s.status==='paid'),sum=paid.reduce((a,s)=>a+s.total,0),shown=list.slice(0,150);
  const rows=shown.map(s=>{
    const cu=s.customerId?custById(s.customerId):null;
    return '<tr data-act="sale-open" data-id="'+s.id+'"><td><b>'+esc(s.no)+'</b><div class="sub">'+fmtDT(s.ts)+'</div></td><td>'+(cu?esc(cu.name):'<span class="muted">Umum</span>')+'<div class="sub">'+TYPES[s.type]+(s.table?' · Meja '+esc(s.table):'')+'</div></td><td><span class="pill">'+METHODS[s.method]+'</span></td><td class="r"><b>'+rp(s.total)+'</b></td><td>'+(s.status==='void'?'<span class="pill bad">Dibatalkan</span>':'<span class="pill ok">Lunas</span>')+'</td></tr>';
  }).join('');
  return '<div class="sumbar"><span><b>'+list.length+'</b> transaksi</span><span>Penjualan <b>'+rp(sum)+'</b></span>'+(list.length>shown.length?'<span>Menampilkan 150 terbaru</span>':'')+'</div><div class="tablewrap"><table><thead><tr><th>Struk</th><th>Pelanggan</th><th>Metode</th><th class="r">Total</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function voidAsk(id){

function voidGo(id){
  const s=db.sales.find(x=>x.id===id);if(!s||s.status==='void')return;
  s.status='void';s.voidReason=$('#vr').value;s.voidTs=Date.now();s.voidBy=S.user.id;
  s.items.forEach(i=>{const p=prodById(i.pid);if(p&&modeOf(p)==='stock'){p.stock+=i.qty;logStock(p.id,'void',i.qty,s.no)}});
  const back={};s.items.forEach(i=>(i.rec||[]).forEach(r=>{back[r.iid]=(back[r.iid]||0)+r.qty*i.qty}));
  Object.keys(back).forEach(id=>{const g=ingById(id);if(g){g.stock=Math.round((g.stock+back[id])*1000)/1000;logIng(id,'void',back[id],s.no)}});
  const cu=s.customerId?custById(s.customerId):null;if(cu)cu.points=Math.max(0,cu.points-(s.points||0));
  save();closeModal();render();toast('Transaksi dibatalkan');
}

/* ========== laporan ========== */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=4?4:f<=8?8:10)*p}
function shortRp(n){if(n>=1e6)return(n/1e6).toFixed(n%1e6===0?0:1).replace('.',',')+' jt';if(n>=1e3)return Math.round(n/1e3)+' rb';return String(Math.round(n))}
function barChart(data,o){
  o=o||{};const W=640,h=o.h||220,pl=46,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=h-pt-pb;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.v).concat([0]))),every=o.every||1;let g='';
  for(let i=0;i<=4;i++){const v=max/4*i,y=pt+ih-ih*(v/max);g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+shortRp(v)+'</text>'}
  const bw=iw/data.length,bar=Math.min(30,bw*.62);
  data.forEach((d,i)=>{
    const bh=ih*(d.v/max),x=pl+bw*i+(bw-bar)/2,y=pt+ih-bh;
    g+='<rect class="bar'+(o.hlLast&&i===data.length-1?' hl':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+(d.v>0?Math.max(bh,1.5):0).toFixed(1)+'" rx="'+Math.min(6,bar/2).toFixed(1)+'"><title>'+esc(d.label)+': '+rp(d.v)+'</title></rect>';
    if(i%every===0)g+='<text class="ax" x="'+(x+bar/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="'+esc(o.label||'Grafik penjualan')+'">'+g+'</svg>';
}
function hbars(rows,fmt){
  if(!rows.length)return '<p class="muted">Belum ada data pada periode ini.</p>';
  const max=Math.max.apply(null,rows.map(r=>r.v))||1;
  return '<div class="hbars">'+rows.map(r=>'<div class="hb-row"><span class="nm">'+esc(r.name)+'</span><span class="vl">'+(fmt?fmt(r):rp(r.v))+'</span><div class="hb-track"><div class="hb-fill" style="width:'+Math.max(2,Math.round(r.v/max*100))+'%"></div></div></div>').join('')+'</div>';
}
function agg(list){
  const rev=list.reduce((a,s)=>a+s.total,0);
  const gp=list.reduce((a,s)=>a+(s.subtotal-s.discount)-s.items.reduce((c,i)=>c+i.cost*i.qty,0),0);
  return{rev,n:list.length,avg:list.length?rev/list.length:0,gp};
}
const deltaHTML=(c,p)=>{if(!p)return '<span class="delta muted">—</span>';const d=(c-p)/p*100;return '<span class="delta '+(d>=0?'up':'down')+'">'+(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(0)+'% vs periode lalu</span>'};
function reportData(){
  const[a,b]=rangeBounds(S.rr),len=b-a,pa=a-len;
  const paid=db.sales.filter(s=>s.status==='paid');
  return{a,b,cur:paid.filter(s=>s.ts>=a&&s.ts<b),prev:paid.filter(s=>s.ts>=pa&&s.ts<a)};
}
function reportCards(m){
  const ids=UI.reports.filter(id=>m[id]);let out='',half=[];
  const flush=()=>{if(half.length)out+='<div class="grid-2">'+half.join('')+'</div>';half=[]};
  ids.forEach(id=>{if(id==='trend'){flush();out+=m[id]}else{half.push(m[id]);if(half.length===2)flush()}});
  flush();return out;
}

function shiftStats(sh){
  const ss=db.sales.filter(s=>s.shiftId===sh.id&&s.status==='paid');
  const cash=ss.filter(s=>s.method==='cash').reduce((a,s)=>a+s.total,0);
  const inn=sh.moves.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),out=sh.moves.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);
  return{ss,cash,total:ss.reduce((a,s)=>a+s.total,0),inn,out,expected:sh.openCash+cash+inn-out};
}

/* ========== menu & bahan baku: helper ========== */
const ING_T={restock:'Restock',opname:'Opname',waste:'Rusak / waste',sale:'Penjualan',void:'Pembatalan'};
const ingById=id=>db.ingredients.find(g=>g.id===id);
const ingState=g=>g.stock<=0?'bad':g.stock<=g.min?'warn':'ok';
function unitCost(p){return modeOf(p)==='recipe'?recipeCost(p.recipe,db.ingredients):(p.cost||0)}
function menuMargin(p){return p.price?Math.round((p.price-unitCost(p))/p.price*100):0}
function logIng(iid,type,qty,note,unitCostV){
  db.ingLog.push({id:uid(),ts:Date.now(),iid,type,qty,note:note||'',unitCost:unitCostV==null?null:unitCostV,userId:S.user?S.user.id:null});
  if(db.ingLog.length>2500)db.ingLog.splice(0,db.ingLog.length-2000);
}
function cartUsage(cart){
  const m={};
  cart.forEach(i=>{const p=prodById(i.pid);if(p&&modeOf(p)==='recipe')p.recipe.forEach(r=>{m[r.iid]=(m[r.iid]||0)+r.qty*i.qty})});
  return m;
}
/* sisa porsi yang masih bisa dijual; n=null berarti tidak dibatasi */
function avail(p,used,inCart){
  const md=modeOf(p);
  if(md==='stock')return{n:p.stock-(inCart||0),lim:null};
  if(md==='recipe'){
    let n=Infinity,lim=null;
    p.recipe.forEach(r=>{const g=ingById(r.iid);if(!g||!(r.qty>0))return;const k=Math.floor((g.stock-(used[r.iid]||0))/r.qty+1e-9);if(k<n){n=k;lim=g}});
    return{n:n===Infinity?null:Math.max(0,n),lim};
  }
  return{n:null,lim:null};
}
function canAdd(p){
  if(!db.settings.blockOut)return null;
  const a=avail(p,cartUsage(S.pos.cart),cartQty(p.id));
  if(a.n===null||a.n>=1)return null;
  return a.lim?'Bahan '+a.lim.name+' tidak cukup':'Stok '+p.name+' tidak cukup';
}
function itemRec(i){
  if(i.rec)return i.rec;
  const p=prodById(i.pid);
  return p&&modeOf(p)==='recipe'?p.recipe:[];
}
function usageInRange(a,b){
  const m={};
  db.sales.forEach(s=>{if(s.status!=='paid'||s.ts<a||s.ts>=b)return;s.items.forEach(i=>itemRec(i).forEach(r=>{m[r.iid]=(m[r.iid]||0)+r.qty*i.qty}))});
  return m;
}
function dailyUse(){const t0=sod(Date.now()),u=usageInRange(addDays(t0,-7),t0);Object.keys(u).forEach(k=>{u[k]/=7});return u}
function usedInMap(){const m={};db.products.forEach(p=>{if(modeOf(p)==='recipe')p.recipe.forEach(r=>{(m[r.iid]||(m[r.iid]=[])).push(p.name)})});return m}
function coverTxt(g,rate){const r=rate[g.id]||0;if(g.stock<=0)return 'habis';if(!r)return '—';const d=g.stock/r;return d<1?'< 1 hari':d>=30?'30+ hari':Math.floor(d)+' hari'}
const newAvgCost=(g,q,c)=>g.stock>0&&q>0?Math.round((g.stock*g.cost+q*c)/(g.stock+q)*100)/100:c;

/* ========== menu: daftar & form ========== */
function productRows(){
  const q=S.pq.trim().toLowerCase();
  return db.products.filter(p=>(S.pc==='all'||p.cat===S.pc)&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
}
function productListHTML(){
  const list=productRows();
  if(!list.length)return empty('Menu tidak ditemukan','Ubah kata kunci atau tambah menu baru.');
  const rows=list.map(p=>{
    const md=modeOf(p),a=avail(p,{},0),mg=menuMargin(p);
    const src=md==='recipe'?'<span class="pill amber">Resep · '+p.recipe.length+' bahan</span>':md==='stock'?'<span class="pill">Stok produk</span>':'<span class="pill">Manual</span>';
    const sub=a.lim?'<div class="sub">'+esc(a.lim.name)+'</div>':'';
    let av;
    if(a.n===null)av='<span class="muted">—</span>';
    else if(a.n<=0)av='<span class="pill bad">Habis</span>'+sub;
    else if(md==='stock'?a.n<=p.min:a.n<=5)av='<span class="pill warn">'+a.n+'</span>'+sub;
    else av='<span class="num">'+a.n+'</span>';
    return '<tr data-act="prod-edit" data-id="'+p.id+'"><td><b>'+esc(p.name)+'</b><div class="sub">'+esc(p.sku)+'</div></td><td>'+esc(catName(p.cat))+'</td><td>'+src+'</td><td class="r">'+rp(p.price)+'</td><td class="r">'+rp(unitCost(p))+'</td><td class="r"><span class="pill '+(mg<40?'warn':'ok')+'">'+mg+'%</span></td><td>'+av+'</td><td>'+(p.active?'<span class="pill ok">Aktif</span>':'<span class="pill">Nonaktif</span>')+'</td></tr>';
  }).join('');
  return '<div class="tablewrap"><table style="min-width:860px"><thead><tr><th>Menu</th><th>Kategori</th><th>Sumber HPP</th><th class="r">Harga</th><th class="r">HPP</th><th class="r">Margin</th><th>Tersedia</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function rcCostTxt(r){const g=ingById(r.iid),q=dec(r.qty);return g?(q>0?fq(q)+' '+g.unit+' × '+rpd(g.cost)+' = '+rp(q*g.cost):'Isi takaran per porsi'):'Pilih bahan dulu'}
function rcRowsHTML(){
  return S.rd.rows.map((r,i)=>{const g=ingById(r.iid);

  }).join('');

function rcLive(){
  const h=$('#rc-hpp');if(!h)return;
  let hpp=0,mk=Infinity;
  S.rd.rows.forEach(r=>{const g=ingById(r.iid),q=dec(r.qty);if(g&&q>0){hpp+=g.cost*q;mk=Math.min(mk,Math.floor(g.stock/q+1e-9))}});
  hpp=Math.round(hpp);
  const pe=$('#pf-price'),price=pe?dec(pe.value):0;
  h.textContent=rp(hpp);
  $('#rc-mg').textContent=price>0&&hpp>0?Math.round((price-hpp)/price*100)+'%':'—';
  $('#rc-mk').textContent=mk===Infinity?'—':Math.max(0,mk)+' porsi';
}
function applyMode(){
  const m=S.pfMode;
  $$('[data-act="pf-mode"]').forEach(b=>b.classList.toggle('on',b.dataset.v===m));
  $('#pf-recipe').hidden=m!=='recipe';
  $('#pf-stockbox').hidden=m!=='stock';
  $('#pf-manual').hidden=m==='recipe';
  if(m==='recipe')rcLive();
}

function prodSave(id){
  const name=$('#pf-name').value.trim(),price=num($('#pf-price').value),mode=S.pfMode;
  if(!name){toast('Nama menu wajib diisi');return}
  if(price<=0){toast('Harga jual harus lebih dari 0');return}
  let recipe=[];
  if(mode==='recipe'){
    const m={};
    S.rd.rows.forEach(r=>{const q=dec(r.qty);if(r.iid&&q>0&&ingById(r.iid))m[r.iid]=Math.round(((m[r.iid]||0)+q)*10000)/10000});
    recipe=Object.keys(m).map(k=>({iid:k,qty:m[k]}));
    if(!recipe.length){toast('Tambahkan minimal satu bahan beserta takarannya');return}
  }
  const o={name,cat:$('#pf-cat').value,price,min:Math.max(0,num($('#pf-min').value)),active:$('#pf-active').checked,mode,recipe,track:mode==='stock'};
  o.cost=mode==='recipe'?recipeCost(recipe,db.ingredients):Math.max(0,num($('#pf-cost').value));
  let sku=$('#pf-sku').value.trim();
  if(id){const p=prodById(id);if(!sku)sku=p.sku;Object.assign(p,o,{sku})}
  else{
    if(!sku)sku='SKU-'+String(db.products.length+1).padStart(3,'0');
    const stock=mode==='stock'?Math.max(0,num($('#pf-stock').value)):0;
    const p=Object.assign({id:'p-'+uid(),sku,stock},o);db.products.push(p);
    if(mode==='stock'&&stock)logStock(p.id,'restock',stock,'Stok awal');
  }
  save();closeModal();render();toast('Menu disimpan');
}

function stockAdj(id){

}
function stockSave(id){
  const p=prodById(id),t=$('#adj-type').value,q=num($('#adj-qty').value),note=$('#adj-note').value.trim();
  if(q<0||$('#adj-qty').value.trim()===''){toast('Isi jumlah dengan angka');return}
  let d=0;
  if(t==='restock')d=q;else if(t==='waste')d=-Math.min(q,p.stock);else d=q-p.stock;
  if(d===0){toast('Tidak ada perubahan stok');return}
  p.stock+=d;logStock(p.id,t,d,note);save();closeModal();render();toast('Stok diperbarui');
}

function ingSave(id){
  const name=$('#if-name').value.trim();
  if(!name){toast('Nama bahan wajib diisi');return}
  if(db.ingredients.some(g=>g.id!==id&&g.name.toLowerCase()===name.toLowerCase())){toast('Nama bahan sudah ada');return}
  const cost=dec($('#if-cost').value);
  if(cost<=0){toast('Isi HPP per satuan lebih dari 0');return}
  const o={name,unit:$('#if-unit').value,supplier:$('#if-sup').value.trim(),cost,min:Math.max(0,dec($('#if-min').value)),active:$('#if-active').checked};
  if(id)Object.assign(ingById(id),o);
  else{const stock=Math.max(0,dec($('#if-stock').value)),g=Object.assign({id:'i-'+uid(),stock},o);db.ingredients.push(g);if(stock)logIng(g.id,'restock',stock,'Stok awal',cost)}
  save();closeModal();render();toast('Bahan baku disimpan');
}
function ingRestock(id){
  const g=ingById(id);if(!g)return;
  modal({title:'Restock bahan',body:'<div><b style="font:700 17px var(--font-display)">'+esc(g.name)+'</b><div class="muted">Stok saat ini <b>'+fq(g.stock)+' '+g.unit+'</b> · HPP '+rpd(g.cost)+' / '+g.unit+'</div></div><div class="form"><div class="fld-row"><div class="fld"><label class="lbl" for="rs-qty">Jumlah masuk ('+g.unit+')</label><input class="in" id="rs-qty" data-in="rs-live" data-id="'+id+'" inputmode="decimal"></div><div class="fld"><label class="lbl" for="rs-cost">Harga beli per '+g.unit+' (Rp)</label><input class="in" id="rs-cost" data-in="rs-live" data-id="'+id+'" inputmode="decimal" value="'+esc(g.cost)+'"></div></div><div class="fld-row"><div class="fld"><label class="lbl" for="rs-sup">Supplier</label><input class="in" id="rs-sup" value="'+esc(g.supplier||'')+'"></div><div class="fld"><label class="lbl" for="rs-note">No. nota / catatan</label><input class="in" id="rs-note"></div></div><div class="change-box"><span class="lbl">Total belanja</span><b id="rs-total">Rp&nbsp;0</b></div><p class="hint" id="rs-avg">HPP dihitung rata-rata tertimbang dari stok lama dan pembelian baru.</p></div>',foot:'<button class="btn ghost" data-act="close">Batal</button><button class="btn primary" data-act="ing-restock-save" data-id="'+id+'">Simpan restock</button>'});
}
function ingRestockSave(id){
  const g=ingById(id),q=dec($('#rs-qty').value),c=dec($('#rs-cost').value);
  if(!g)return;
  if(q<=0){toast('Isi jumlah yang masuk');return}
  if(c<=0){toast('Isi harga beli per '+g.unit);return}
  const nc=newAvgCost(g,q,c);
  g.stock=Math.round((g.stock+q)*1000)/1000;g.cost=nc;
  const sup=$('#rs-sup').value.trim();if(sup)g.supplier=sup;
  logIng(id,'restock',q,$('#rs-note').value.trim(),c);
  save();closeModal();render();toast('Restock tersimpan. HPP rata-rata '+rpd(nc));
}
function ingAdj(id){
  const g=ingById(id);if(!g)return;
  modal({title:'Sesuaikan stok bahan',body:'<div><b style="font:700 17px var(--font-display)">'+esc(g.name)+'</b><div class="muted">Stok tercatat: <b>'+fq(g.stock)+' '+g.unit+'</b></div></div><div class="form"><div class="fld"><label class="lbl" for="ia-type">Jenis</label><select class="sel" id="ia-type"><option value="opname">Opname (isi hasil hitung fisik)</option><option value="waste">Rusak / waste (kurangi)</option></select></div><div class="fld"><label class="lbl" for="ia-qty">Jumlah ('+g.unit+')</label><input class="in" id="ia-qty" inputmode="decimal"></div><div class="fld"><label class="lbl" for="ia-note">Catatan</label><input class="in" id="ia-note" placeholder="Contoh: tumpah, kedaluwarsa"></div></div>',foot:'<button class="btn ghost" data-act="close">Batal</button><button class="btn primary" data-act="ing-adj-save" data-id="'+id+'">Simpan</button>'});

function ingAdjSave(id){
  const g=ingById(id),t=$('#ia-type').value,raw=$('#ia-qty').value;
  if(!g)return;
  if(raw.trim()===''||dec(raw)<0){toast('Isi jumlah dengan angka');return}
  const q=dec(raw);
  const d=t==='waste'?-Math.min(q,Math.max(0,g.stock)):q-g.stock;
  if(Math.abs(d)<1e-9){toast('Tidak ada perubahan stok');return}
  g.stock=Math.round((g.stock+d)*1000)/1000;logIng(id,t,d,$('#ia-note').value.trim());
  save();closeModal();render();toast('Stok bahan diperbarui');
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const asc=t=>String(t==null?'':t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[   ]/g,' ').replace(/[·•]/g,'-').replace(/[−–—]/g,'-').replace(/×/g,'x').replace(/…/g,'...').replace(/[^\x20-\x7e]/g,'?');
function wrapTxt(t,w){
  const out=[];let cur='';
  asc(t).split(' ').forEach(word=>{
    while(word.length>w){if(cur){out.push(cur);cur=''}out.push(word.slice(0,w));word=word.slice(w)}
    if(!cur)cur=word;else if((cur+' '+word).length<=w)cur+=' '+word;else{out.push(cur);cur=word}
  });
  if(cur||!out.length)out.push(cur);
  return out;
}
/* susunan struk: daftar baris {t,a:'l'|'c',b:tebal,sz:2=ganda} */
function receiptLayout(s,cols){
  const st=db.settings,u=userById(s.userId),cu=s.customerId?custById(s.customerId):null,out=[],SEP='-'.repeat(cols);
  const C=(t,o)=>out.push(Object.assign({t:asc(t),a:'c'},o||{}));
  const W=(t,o,ind)=>wrapTxt(t,cols-(ind||0)).forEach(x=>out.push(Object.assign({t:' '.repeat(ind||0)+x,a:'l'},o||{})));
  const LR=(a,b,o)=>{a=asc(a);b=asc(b);let t;const gap=cols-a.length-b.length;t=gap>=1?a+' '.repeat(gap)+b:a.slice(0,Math.max(0,cols-b.length-1))+' '+b;out.push(Object.assign({t:t,a:'l'},o||{}))};
  const n=v=>Math.round(v).toLocaleString('id-ID');
  const name=asc(st.storeName);
  if(name.length<=Math.floor(cols/2))C(name,{b:1,sz:2});else C(name,{b:1});
  if(st.tagline)C(st.tagline);
  wrapTxt(st.address,cols).forEach(x=>C(x));
  C('Telp '+st.phone);
  out.push({t:SEP,a:'l'});
  LR('No',s.no);LR('Tanggal',fmtDT(s.ts));LR('Kasir',u?u.name:'-');
  LR('Jenis',TYPES[s.type]+(s.table?' / Meja '+s.table:''));
  if(cu)LR('Pelanggan',cu.name);
  out.push({t:SEP,a:'l'});
  s.items.forEach(i=>{W(i.name);LR('  '+i.qty+' x '+n(i.price),n(i.price*i.qty));if(i.note)W('* '+i.note,null,2)});
  out.push({t:SEP,a:'l'});
  LR('Subtotal',n(s.subtotal));
  if(s.discount)LR('Diskon','-'+n(s.discount));
  if(s.service)LR('Layanan '+s.serviceRate+'%',n(s.service));
  if(s.tax)LR('PPN '+s.taxRate+'%',n(s.tax));
  LR('TOTAL','Rp '+n(s.total),{b:1});
  out.push({t:SEP,a:'l'});
  LR('Bayar ('+METHODS[s.method]+')','Rp '+n(s.paid));
  if(s.method==='cash')LR('Kembali','Rp '+n(s.change));
  if(s.points)LR('Poin didapat','+'+s.points);
  if(s.status==='void')C('*** DIBATALKAN ***',{b:1});
  out.push({t:SEP,a:'l'});
  wrapTxt(st.footer,cols).forEach(x=>C(x));
  return out;
}
const plainText=(lines,cols)=>lines.map(l=>{
  if(l.sz===2)return ' '.repeat(Math.max(0,Math.floor((cols-l.t.length*2)/2)))+l.t+' (besar)';
  return l.a==='c'?' '.repeat(Math.max(0,Math.floor((cols-l.t.length)/2)))+l.t:l.t;
}).join('\n');
function encodeEscpos(lines,cfg){
  const b=[0x1b,0x40];
  lines.forEach(l=>{
    b.push(0x1b,0x61,l.a==='c'?1:0,0x1b,0x45,l.b?1:0,0x1d,0x21,l.sz===2?0x11:0);
    for(let i=0;i<l.t.length;i++)b.push(l.t.charCodeAt(i));
    b.push(0x0a);
  });
  b.push(0x1b,0x61,0,0x1b,0x45,0,0x1d,0x21,0,0x1b,0x64,Math.max(0,Math.min(9,cfg.feed||0)));
  if(cfg.cut)b.push(0x1d,0x56,0x42,0x00);
  return Uint8Array.from(b);
}

function toB64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function rawbtSend(bytes){
  const a=document.createElement('a');
  a.href='rawbt:base64,'+toB64(bytes);
  document.body.appendChild(a);a.click();a.remove();
}
function sysPrint(lines,cfg){
  const cols=cfg.paper===80?48:32,el=$('#print-area');
  el.textContent=plainText(lines,cols).replace(/ \(besar\)/g,'');
  el.style.width=(cfg.paper===80?'72mm':'48mm');
  window.print();
}
async function bleConnect(pick){
  if(!hasBT())throw Object.assign(new Error('Halaman ini tidak mendukung Web Bluetooth. Buka versi mandiri di Chrome Android atau pakai mode RawBT.'),{name:'NoBT'});
  let dev=PR.dev;
  if(!dev&&!pick&&navigator.bluetooth.getDevices){
    try{const ds=await navigator.bluetooth.getDevices(),id=lsGet(PR_ID);dev=ds.find(d=>d.id===id)||null}catch(e){dev=null}
  }
  if(!dev){
    if(!pick)throw Object.assign(new Error('Printer belum terhubung. Ketuk ikon printer di bagian atas untuk memilih printer.'),{name:'NoDevice'});
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SERVICES});
  }
  if(PR.dev!==dev){PR.dev=dev;lsSet(PR_ID,dev.id||'');dev.addEventListener('gattserverdisconnected',()=>{PR.ch=null;if(S.view==='settings')render()})}
  const srv=dev.gatt.connected?dev.gatt:await dev.gatt.connect();
  const services=await srv.getPrimaryServices();
  for(const s of services){
    const cs=await s.getCharacteristics();
    for(const c of cs){if(c.properties.writeWithoutResponse||c.properties.write){PR.ch=c;PR.name=dev.name||'Printer';return}}
  }
  throw Object.assign(new Error('Printer tidak punya jalur tulis BLE. Printer ini kemungkinan Bluetooth klasik, pakai mode RawBT.'),{name:'NoChar'});
}
async function bleWrite(bytes){
  const ch=PR.ch;if(!ch)throw Object.assign(new Error('Printer belum terhubung.'),{name:'NoDevice'});
  const noResp=!!ch.properties.writeWithoutResponse;
  const send=p=>noResp?ch.writeValueWithoutResponse(p):ch.writeValue(p);
  let i=0,retried=false;
  while(i<bytes.length){
    const part=bytes.slice(i,i+PR.chunk);
    try{await send(part);i+=part.length;await sleep(20)}
    catch(e){if(!retried&&PR.chunk>20){retried=true;PR.chunk=20;await sleep(100)}else throw e}
  }
}
function printErr(e){
  const n=e&&e.name;
  if(n==='NotFoundError')return 'Pemilihan printer dibatalkan';
  if(n==='SecurityError'||n==='NotAllowedError')return 'Bluetooth diblokir di halaman ini. Buka versi mandiri lewat Chrome.';
  if(n==='NetworkError')return 'Koneksi ke printer terputus. Nyalakan printer lalu coba lagi.';
  return (e&&e.message)||'Gagal mencetak';
}
async function doPrint(s,manual){
  const cfg=printerCfg();
  if(cfg.mode==='off'){if(manual)toast('Aktifkan printer di Pengaturan');return false}
  const lines=receiptLayout(s,cfg.paper===80?48:32);
  try{
    if(cfg.mode==='system'){sysPrint(lines,cfg);return true}
    const one=encodeEscpos(lines,cfg);let bytes=one;
    if(cfg.copies>1){bytes=new Uint8Array(one.length*cfg.copies);for(let k=0;k<cfg.copies;k++)bytes.set(one,k*one.length)}
    if(cfg.mode==='rawbt'){rawbtSend(bytes);return true}
    if(!PR.ch)await bleConnect(false);
    await bleWrite(bytes);toast('Struk dicetak');return true;
  }catch(e){toast(printErr(e));return false}
}
function autoPrint(s){const c=printerCfg();if(c.mode!=='off'&&c.auto)doPrint(s,false)}
function printerBtn(){
  const c=printerCfg();if(c.mode==='off'||c.mode==='system')return '';
  const on=c.mode==='rawbt'||!!PR.ch;
  return '<button class="icon-btn" data-act="pr-top" aria-label="Printer struk" title="'+(c.mode==='ble'?(PR.ch?'Terhubung: '+esc(PR.name):'Hubungkan printer'):'Printer RawBT')+'" style="'+(on?'border-color:var(--ok);color:var(--ok)':'border-color:var(--amber)')+'">'+ico('receipt')+'</button>';
}

/* ========== sinkron antar perangkat (server lokal) ==========
   Sinkron hanya lewat Server Lokal Soan Kofe di jaringan WiFi kedai (folder server/).
   Setiap data (transaksi, shift, produk, bahan, pelanggan, pengguna, dst.) adalah satu catatan
   {k, j, del, u, dev}. Perangkat hanya mengirim data yang berubah dan hanya mengambil perubahan
   sejak sinkron terakhir, jadi tetap jalan saat koneksi ke server putus. */
const SYNC_KEY='soankofe.pos.sync',SYNC_BASE='soankofe.pos.syncbase';
const SYNC_COLLS=['users','categories','products','customers','sales','held','stockLog','ingredients','ingLog','shifts'];
const SG={info:null,cfg:null,base:{},api:null,mode:null,unsub:null,state:'off',err:'',lastOk:0,timer:null,rTimer:null,retry:null,started:false,files:null};
function syncCfgLoad(){try{SG.cfg=JSON.parse(lsGet(SYNC_KEY)||'null')}catch(e){SG.cfg=null}try{SG.base=JSON.parse(lsGet(SYNC_BASE)||'{}')||{}}catch(e){SG.base={}}}
function syncCfgSave(){lsSet(SYNC_KEY,JSON.stringify(SG.cfg))}
function syncBaseSave(){lsSet(SYNC_BASE,JSON.stringify(SG.base))}
const syncOn=()=>!!(SG.cfg&&SG.cfg.on&&SG.cfg.code);
function hashStr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(36)+(h1>>>0).toString(36)}

async function localDetect(){
  if(SG.mode)return SG.mode==='local';
  if(!/^https?:$/.test(location.protocol)){SG.mode='none';return false}
  try{const r=await fetch('api/info',{cache:'no-store'});const j=r.ok?await r.json():null;SG.mode=j&&j.name==='soan-server'?'local':'none'}catch(e){SG.mode=SG.cfg&&SG.cfg.mode==='local'?'local':'none'}
  return SG.mode==='local';
}
function localApi(code){
  const H={'x-store-code':code,'content-type':'application/json'};
  const chk=async r=>{if(r.status===403)throw Object.assign(new Error('Kode toko salah'),{code:'wrong-code'});if(!r.ok)throw new Error('Server menjawab '+r.status);return r.json()};
  return{
    async connect(){await chk(await fetch('api/items?since=0&limit=1',{headers:H,cache:'no-store'}))},
    async isEmpty(){return !(await chk(await fetch('api/items?since=0&limit=1',{headers:H,cache:'no-store'}))).length},
    async getAll(){return chk(await fetch('api/items?since=0',{headers:H,cache:'no-store'}))},
    listen(sinceMs,onDocs,onErr){
      let es=null,dead=false,t=null;
      const open=()=>{if(dead)return;es=new EventSource('api/stream?since='+(SG.cfg.last||sinceMs||0)+'&code='+encodeURIComponent(code));
        es.onmessage=e=>{let l;try{l=JSON.parse(e.data)}catch(x){return}onDocs(l)};
        es.onopen=()=>{syncPush()};
        es.onerror=()=>{es.close();onErr(Object.assign(new Error('Server lokal tidak terjangkau'),{code:'unavailable'}));clearTimeout(t);t=setTimeout(open,3000)}};
      open();return()=>{dead=true;clearTimeout(t);if(es)es.close()};
    },
    async write(ops){return chk(await fetch('api/items',{method:'POST',headers:H,body:JSON.stringify(ops.map(o=>({k:o.k,j:o.del?'':o.j,del:!!o.del,dev:SG.cfg.dev})))}))}
  };
}

async function syncMakeApi(code){if(!(await localDetect()))throw Object.assign(new Error('Sinkron hanya tersedia saat aplikasi dibuka dari server lokal kedai.'),{code:'no-server'});SG.api=localApi(code);await SG.api.connect();return SG.api}

/* ---- inti sinkron ---- */
function syncRecs(d){
  const m=new Map();
  SYNC_COLLS.forEach(c=>(d[c]||[]).forEach(x=>{if(!x||typeof x!=='object')return;if(x.id==null||x.id==='')x.id=uid();m.set(c+'~'+x.id,x)}));
  m.set('settings',d.settings);m.set('seq',d.seq||{sale:0});m.set('meta',{v:d.v||2,demo:!!d.demo});
  return m;
}
function syncApply(v){
  const k=v.k;if(!k)return;let x=null;
  if(!v.del){try{x=JSON.parse(v.j)}catch(e){return}}
  if(k==='settings'){if(x)db.settings=x}
  else if(k==='seq'){if(x){db.seq=db.seq||{sale:0};db.seq.sale=Math.max(+db.seq.sale||0,+x.sale||0);x=db.seq}}
  else if(k==='meta'){if(x){db.demo=!!x.demo;x={v:db.v||2,demo:!!db.demo}}}
  else{
    const i=k.indexOf('~'),c=k.slice(0,i),id=k.slice(i+1);if(!SYNC_COLLS.includes(c))return;
    const arr=db[c]||(db[c]=[]),idx=arr.findIndex(e=>e&&String(e.id)===id);
    if(v.del){if(idx>=0)arr.splice(idx,1)}
    else if(idx>=0)arr[idx]=x;
    else{const t=x.ts!=null?x.ts:x.openTs;let j=arr.length;if(t!=null)while(j>0&&arr[j-1]&&(arr[j-1].ts!=null?arr[j-1].ts:arr[j-1].openTs)>t)j--;arr.splice(j,0,x)}
  }
  if(v.del)delete SG.base[k];else SG.base[k]=hashStr(JSON.stringify(x));
}
function syncOnDocs(list){
  let ch=false,max=SG.cfg.last||0;
  list.forEach(v=>{if(v.u>max)max=v.u;if(v.dev===SG.cfg.dev)return;syncApply(v);ch=true});
  if(max>(SG.cfg.last||0)){SG.cfg.last=max;syncCfgSave()}
  SG.lastOk=Date.now();
  if(ch){lsSet(LS_KEY,JSON.stringify(db));syncBaseSave();syncAfterRemote()}
  syncState('live','');
}
function syncListen(){
  if(SG.unsub){SG.unsub();SG.unsub=null}
  SG.unsub=SG.api.listen(SG.cfg.last||0,syncOnDocs,e=>{const m=syncErrMsg(e);syncState(/terjangkau|internet/i.test(m)?'offline':'error',m)});
}
function syncState(s,err){SG.state=s;if(err!==undefined)SG.err=err;const p=$('#sync-pill');if(p)p.outerHTML=syncPill();const c=$('#sync-status');if(c)c.innerHTML=syncStatusText()}
const syncWhere=()=>'server lokal';
function syncPill(){
  if(!syncOn())return '';
  const off=SG.state==='offline',bad=SG.state==='error';
  return '<span id="sync-pill" class="pill '+(bad?'bad':off?'amber':'ok')+'" title="Sinkron antar perangkat">'+(bad?'Sinkron gagal':off?'Offline':SG.state==='live'?'Tersinkron':'Menyambung…')+'</span>';
}
function syncStatusText(){
  if(!syncOn())return 'Mati. Data hanya ada di perangkat ini.';
  const t=SG.lastOk?' · terakhir '+fmtTime(SG.lastOk):'';
  if(SG.state==='error')return '<b style="color:var(--bad)">Gagal:</b> '+esc(SG.err||'tidak diketahui');
  if(SG.state==='offline')return 'Terputus dari '+syncWhere()+'. Perubahan disimpan di perangkat ini dan dikirim otomatis saat tersambung lagi'+t+'.';
  if(SG.state==='live')return 'Aktif lewat '+syncWhere()+', kode toko <b>'+esc(SG.cfg.code)+'</b>'+t+'.';
  return 'Menyambung ke '+syncWhere()+'…';
}
function syncErrMsg(e){
  const c=(e&&e.code)||'',m=(e&&e.message)||String(e);
  if(c==='wrong-code')return 'Kode toko salah. Gunakan kode yang sama dengan perangkat lain.';
  if(c==='no-server')return m;
  if(/unavailable|failed to fetch|network|load failed|terjangkau/i.test(c+m))return 'Server lokal tidak terjangkau. Pastikan komputer server menyala dan perangkat tersambung ke WiFi kedai.';
  return m.slice(0,160);
}
function syncAfterRemote(){
  if(S.user){const u=userById(S.user.id);if(!u){logout();return}S.user=u}
  clearTimeout(SG.rTimer);
  const busy=()=>$('#modal-root').firstChild||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&document.activeElement.closest('#app'));
  const tryR=()=>{if(busy()){SG.rTimer=setTimeout(tryR,1500);return}render()};
  tryR();
}
function syncSchedule(){if(!syncOn()||!SG.api)return;clearTimeout(SG.timer);SG.timer=setTimeout(syncPush,400)}
function syncPush(){
  if(!syncOn()||!SG.api)return;
  const m=syncRecs(db),ops=[];
  for(const [k,x] of m){const j=JSON.stringify(x),h=hashStr(j);if(SG.base[k]!==h){ops.push({k,j,prev:SG.base[k]});SG.base[k]=h}}
  for(const k of Object.keys(SG.base))if(!m.has(k)){ops.push({k,del:true,prev:SG.base[k]});delete SG.base[k]}
  if(!ops.length)return;
  syncBaseSave();
  SG.api.write(ops).then(()=>{SG.lastOk=Date.now();if(SG.state!=='error')syncState('live')}).catch(e=>{
    ops.forEach(o=>{if(o.prev===undefined)delete SG.base[o.k];else SG.base[o.k]=o.prev+'!'});syncBaseSave();
    const msg=syncErrMsg(e);syncState(/terjangkau|internet/i.test(msg)?'offline':'error',msg);
    clearTimeout(SG.retry);SG.retry=setTimeout(syncPush,10000);
  });
}
async function syncStart(){
  if(!syncOn()||SG.started)return;
  if(!(await localDetect())){SG.cfg.on=false;syncCfgSave();syncState('off','');if(S.user)render();return}
  SG.started=true;
  syncState('connecting');
  try{await syncMakeApi(SG.cfg.code);syncListen();syncPush()}
  catch(e){SG.started=false;const msg=syncErrMsg(e);syncState(/terjangkau|internet/i.test(msg)?'offline':'error',msg);clearTimeout(SG.retry);SG.retry=setTimeout(syncStart,10000)}
}
function syncStop(){if(SG.unsub){SG.unsub();SG.unsub=null}clearTimeout(SG.retry);SG.started=false;SG.api=null;syncState('off','')}
addEventListener('online',()=>{if(syncOn()){if(!SG.started)syncStart();else syncPush()}});

ACT['sync-on']=()=>modal({title:'Aktifkan sinkron',body:'<p class="muted">Buat kode toko rahasia (minimal 8 karakter: huruf kecil, angka, tanda -, tanpa spasi). Masukkan kode yang <b>sama persis</b> di setiap perangkat. Kode ini berfungsi seperti kata sandi data toko.</p><div class="fld"><label class="lbl" for="sync-code">Kode toko</label><input class="in" id="sync-code" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="contoh: soankofe-lebakbulus-27"></div><p class="muted">Aktifkan lebih dulu di perangkat yang datanya paling lengkap (tablet kasir).</p>',foot:'<button class="btn ghost" data-act="close">Batal</button><button class="btn primary" data-act="sync-go">Lanjut</button>'});
ACT['sync-go']=async el=>{
  const code=($('#sync-code').value||'').trim().toLowerCase().replace(/\s+/g,'-');

      },false);

        toast('Mengunduh data toko…');

          const all=await SG.api.getAll();
          snapshotNow('Sebelum sinkron pertama');

          SG.base={};let max=0;
          all.forEach(v=>{if(v.u>max)max=v.u;if(!v.del)syncApply(v)});
          migrate(db);if(!db.users.length){db=JSON.parse(lsGet(SNAP_KEY));throw new Error('Data toko di server tidak lengkap')}
          SG.cfg.on=true;SG.cfg.last=max;syncCfgSave();syncBaseSave();lsSet(LS_KEY,JSON.stringify(db));
          SG.started=true;syncListen();resetPos();
          if(S.user){const u=userById(S.user.id);if(u)S.user=u;else{logout();toast('Data toko dimuat. Silakan masuk lagi.');return}}

    }
  }catch(e){closeModal();SG.cfg.on=false;syncCfgSave();toast(syncErrMsg(e))}
};

const FOLDER_LBL={laporan:'Laporan CSV',gambar:'Gambar',dokumen:'Dokumen'};
const fileCode=()=>syncOn()?SG.cfg.code:'';
const fileUrl=(f,dl)=>'files/'+encodeURIComponent(f.folder)+'/'+encodeURIComponent(f.name)+'?code='+encodeURIComponent(fileCode())+(dl?'&dl=1':'');
const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';
function filesCardHTML(){
  if(!syncOn())return '<div class="card"><div class="card-h"><h3>Berkas &amp; laporan</h3></div><p class="muted">Aktifkan sinkron dulu untuk menyimpan gambar, dokumen, dan laporan CSV di server kedai.</p></div>';

function filesListHTML(){
  if(SG.files===null){setTimeout(filesLoad,0);return '<p class="muted">Memuat daftar berkas…</p>'}
  if(SG.files===false)return '<p class="muted">Daftar berkas tidak bisa dimuat. Pastikan server lokal menyala.</p>';
  if(!SG.files.length)return '<p class="muted">Belum ada berkas. Laporan CSV muncul otomatis setelah ada transaksi.</p>';
  return ['laporan','gambar','dokumen'].map(fo=>{const l=SG.files.filter(f=>f.folder===fo);if(!l.length)return '';if(fo==='laporan')l.sort((x,y)=>y.name.localeCompare(x.name));
    return '<h4 style="margin:14px 0 4px">'+FOLDER_LBL[fo]+' ('+l.length+')</h4>'+l.slice(0,60).map(f=>'<div class="list-row"><div class="l"><b style="word-break:break-all">'+esc(f.name)+'</b><span class="muted">'+fmtSize(f.size)+' · '+fmtDT(f.mtime)+'</span></div><div style="display:flex;gap:6px;flex-shrink:0">'
      +(fo==='gambar'?'<a class="btn sm ghost" href="'+fileUrl(f)+'" target="_blank" rel="noopener">Lihat</a>':'')
      +'<a class="btn sm ghost" href="'+fileUrl(f,1)+'" download="'+esc(f.name)+'">Unduh</a><button class="btn sm ghost" data-act="file-del" data-f="'+esc(f.folder)+'" data-n="'+esc(f.name)+'" aria-label="Hapus">'+ico('x')+'</button></div></div>').join('')}).join('');
}
async function filesLoad(){
  try{const r=await fetch('api/files',{headers:{'x-store-code':fileCode()},cache:'no-store'});if(!r.ok)throw 0;SG.files=await r.json()}catch(e){SG.files=false}
  try{const r=await fetch('api/info',{cache:'no-store'});SG.info=r.ok?await r.json():null}catch(e){SG.info=null}
  const el=$('#file-list');if(el)el.innerHTML=filesListHTML();
  const bk=$('#bk-status');if(bk)bk.innerHTML=backupStatusHTML();
}
function backupStatusHTML(){
  const i=SG.info;if(!i)return '<p class="muted">Memuat status cadangan…</p>';
  const d=i.drive||{};
  const drv=d.on?'<span class="pill ok">Google Drive aktif</span> Disalin otomatis ke <b>'+esc(d.folder||'Google Drive')+'</b>'+(d.last?', terakhir '+fmtDT(d.last):'')+' ('+(d.files||0)+' berkas + data).'
    :d.err?'<span class="pill bad">Google Drive gagal</span> '+esc(d.err)
    :'<span class="pill amber">Google Drive belum terpasang</span> Pasang Google Drive for desktop di komputer server agar data dicadangkan otomatis.';
  return '<p class="muted">'+drv+'</p><p class="muted">Komputer server juga menyimpan cadangan harian 60 hari terakhir.</p>'+(d.on?'<button class="btn sm ghost" data-act="bk-drive">Cadangkan ke Google Drive sekarang</button>':'');
}
ACT['bk-zip']=()=>toast('Menyiapkan cadangan lengkap…');
ACT['bk-drive']=async()=>{toast('Mencadangkan ke Google Drive…');try{const r=await fetch('api/drive/now',{method:'POST',headers:{'x-store-code':fileCode()}});const j=await r.json();toast(j.ok?'Cadangan Google Drive selesai':'Gagal: '+(j.err||'tidak diketahui'))}catch(e){toast('Server tidak terjangkau')}filesLoad()};
ACT['files-refresh']=()=>{SG.files=null;const el=$('#file-list');if(el)el.innerHTML=filesListHTML()};
ACT['file-pick']=()=>{const i=$('#up-file');if(i)i.click()};
CH['file-up']=async el=>{
  const folder=$('#up-folder').value,list=[...el.files];if(!list.length)return;
  toast('Mengunggah '+list.length+' berkas…');let ok=0;
  for(const f of list){try{const r=await fetch('api/files?folder='+encodeURIComponent(folder)+'&name='+encodeURIComponent(f.name),{method:'POST',headers:{'x-store-code':fileCode()},body:f});if(r.ok)ok++}catch(e){}}
  el.value='';toast(ok===list.length?ok+' berkas terunggah':'Terunggah '+ok+' dari '+list.length+' berkas');filesLoad();
};
ACT['file-del']=el=>{const f=el.dataset.f,n=el.dataset.n;confirmBox('Hapus berkas','Hapus <b>'+esc(n)+'</b> dari server?','Hapus',async()=>{
  try{const r=await fetch('api/files?folder='+encodeURIComponent(f)+'&name='+encodeURIComponent(n),{method:'DELETE',headers:{'x-store-code':fileCode()}});if(!r.ok)throw 0;toast('Berkas dihapus')}catch(e){toast('Gagal menghapus berkas')}
  filesLoad();if(S.view!=='settings')return;
})};
const _resetDemo=ACT['reset-demo'];ACT['reset-demo']=()=>{if(syncOn()){toast('Matikan sinkron dulu sebelum reset ke data contoh, agar perangkat lain tidak ikut ter-reset');return}_resetDemo()};

/* ========== boot ========== */
(function init(){
  const t=lsGet(THEME_KEY);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
  probeStorage();
  if(!PREVIEW)syncCfgLoad();
  load();
  loadConfig();
  const sid=lsGet(SESSION_KEY),u=sid?userById(sid):null;if(u)S.user=u;
  if(PREVIEW){S.user=db.users.find(x=>x.role==='owner')||db.users[0];render();try{parent.postMessage({type:'soan-preview-ready'},location.origin)}catch(e){}return}
  render();
  localDetect().then(l=>{if(l&&S.user&&S.view==='settings')render()});
  syncStart();
})();
})();
</script>
<script>if('serviceWorker'in navigator&&!/[?&]preview=1/.test(location.search))addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
</html>
