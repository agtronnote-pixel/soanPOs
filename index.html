/* ========== sinkron antar perangkat (server lokal) ==========
   Sinkron hanya lewat Server Lokal Soan Kofe di jaringan WiFi kedai (folder server/).
   Setiap data (transaksi, shift, produk, bahan, pelanggan, pengguna, dst.) adalah satu catatan
   {k, j, del, u, dev}. Perangkat hanya mengirim data yang berubah dan hanya mengambil perubahan
   sejak sinkron terakhir, jadi tetap jalan saat koneksi ke server putus. */
const SYNC_KEY='soankofe.pos.sync',SYNC_BASE='soankofe.pos.syncbase';
const SYNC_COLLS=['users','categories','products','customers','sales','held','stockLog','ingredients','ingLog','shifts','cashLog','invoices'];
const SG={info:null,cfg:null,base:{},api:null,mode:null,unsub:null,state:'off',err:'',lastOk:0,timer:null,rTimer:null,retry:null,started:false,files:null};
function syncCfgLoad(){try{SG.cfg=JSON.parse(lsGet(SYNC_KEY)||'null')}catch(e){SG.cfg=null}try{SG.base=JSON.parse(lsGet(SYNC_BASE)||'{}')||{}}catch(e){SG.base={}}}
function syncCfgSave(){lsSet(SYNC_KEY,JSON.stringify(SG.cfg))}
function syncBaseSave(){lsSet(SYNC_BASE,JSON.stringify(SG.base))}
const syncOn=()=>!!(SG.cfg&&SG.cfg.on&&SG.cfg.code);
function hashStr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(36)+(h1>>>0).toString(36)}

async function localDetect(){
  if(SG.mode)return SG.mode==='local';
  if(!/^https?:$/.test(location.protocol)){SG.mode='none';return false}
  try{const r=await fetch('api/info',{cache:'no-store'});const j=r.ok?await r.json():null;SG.mode=j&&j.name==='soan-server'?'local':'none'}catch(e){SG.mode=SG.cfg&&SG.cfg.mode==='local'?'local':'none'}
  return SG.mode==='local';
}
function localApi(code){
  const H={'x-store-code':code,'content-type':'application/json'};
  const chk=async r=>{if(r.status===403)throw Object.assign(new Error('Kode toko salah'),{code:'wrong-code'});if(!r.ok)throw new Error('Server menjawab '+r.status);return r.json()};
  return{
    async connect(){await chk(await fetch('api/items?since=0&limit=1',{headers:H,cache:'no-store'}))},
    async isEmpty(){return !(await chk(await fetch('api/items?since=0&limit=1',{headers:H,cache:'no-store'}))).length},
    async getAll(){return chk(await fetch('api/items?since=0',{headers:H,cache:'no-store'}))},
    listen(sinceMs,onDocs,onErr){
      let es=null,dead=false,t=null;
      const open=()=>{if(dead)return;es=new EventSource('api/stream?since='+(SG.cfg.last||sinceMs||0)+'&code='+encodeURIComponent(code));
        es.onmessage=e=>{let l;try{l=JSON.parse(e.data)}catch(x){return}onDocs(l)};
        es.onopen=()=>{syncPush()};
        es.onerror=()=>{es.close();onErr(Object.assign(new Error('Server lokal tidak terjangkau'),{code:'unavailable'}));clearTimeout(t);t=setTimeout(open,3000)}};
      open();return()=>{dead=true;clearTimeout(t);if(es)es.close()};
    },
    async write(ops){return chk(await fetch('api/items',{method:'POST',headers:H,body:JSON.stringify(ops.map(o=>({k:o.k,j:o.del?'':o.j,del:!!o.del,dev:SG.cfg.dev})))}))}
  };
}

async function syncMakeApi(code){if(!(await localDetect()))throw Object.assign(new Error('Sinkron hanya tersedia saat aplikasi dibuka dari server lokal kedai.'),{code:'no-server'});SG.api=localApi(code);await SG.api.connect();return SG.api}

/* ---- inti sinkron ---- */
function syncRecs(d){
  const m=new Map();
  SYNC_COLLS.forEach(c=>(d[c]||[]).forEach(x=>{if(!x||typeof x!=='object')return;if(x.id==null||x.id==='')x.id=uid();m.set(c+'~'+x.id,x)}));
  m.set('settings',d.settings);m.set('seq',d.seq||{sale:0});m.set('meta',{v:d.v||2,demo:!!d.demo});
  return m;
}
function syncApply(v){
  const k=v.k;if(!k)return;let x=null;
  if(!v.del){try{x=JSON.parse(v.j)}catch(e){return}}
  if(k==='settings'){if(x)db.settings=x}
  else if(k==='seq'){if(x){db.seq=db.seq||{sale:0};db.seq.sale=Math.max(+db.seq.sale||0,+x.sale||0);x=db.seq}}
  else if(k==='meta'){if(x){db.demo=!!x.demo;x={v:db.v||2,demo:!!db.demo}}}
  else{
    const i=k.indexOf('~'),c=k.slice(0,i),id=k.slice(i+1);if(!SYNC_COLLS.includes(c))return;
    const arr=db[c]||(db[c]=[]),idx=arr.findIndex(e=>e&&String(e.id)===id);
    if(v.del){if(idx>=0)arr.splice(idx,1)}
    else if(idx>=0){
      if((c==='ingredients'||c==='products')&&arr[idx]&&(arr[idx].ctr||x.ctr)){const raw=x,mg=stkMerge(arr[idx],x);arr[idx]=mg;SG.base[k]=hashStr(JSON.stringify(raw));if(JSON.stringify(mg)!==JSON.stringify(raw))SG.needPush=true;return}
      arr[idx]=x}
    else{const t=x.ts!=null?x.ts:x.openTs;let j=arr.length;if(t!=null)while(j>0&&arr[j-1]&&(arr[j-1].ts!=null?arr[j-1].ts:arr[j-1].openTs)>t)j--;arr.splice(j,0,x)}
  }
  if(v.del)delete SG.base[k];else SG.base[k]=hashStr(JSON.stringify(x));
}
function syncOnDocs(list){
  let ch=false,max=SG.cfg.last||0;
  list.forEach(v=>{if(v.u>max)max=v.u;if(v.dev===SG.cfg.dev)return;syncApply(v);ch=true});
  if(max>(SG.cfg.last||0)){SG.cfg.last=max;syncCfgSave()}
  SG.lastOk=Date.now();
  if(ch){lsSet(LS_KEY,JSON.stringify(db));syncBaseSave();syncAfterRemote()}
  if(SG.needPush){SG.needPush=false;syncSchedule()}
  syncState('live','');
}
function syncListen(){
  if(SG.unsub){SG.unsub();SG.unsub=null}
  SG.unsub=SG.api.listen(SG.cfg.last||0,syncOnDocs,e=>{const m=syncErrMsg(e);syncState(/terjangkau|internet/i.test(m)?'offline':'error',m)});
}
function syncState(s,err){SG.state=s;if(err!==undefined)SG.err=err;const p=$('#sync-pill');if(p)p.outerHTML=syncPill();const c=$('#sync-status');if(c)c.innerHTML=syncStatusText()}
const syncWhere=()=>'server lokal';
function syncPill(){
  if(!syncOn())return '';
  const off=SG.state==='offline',bad=SG.state==='error';
  return '<span id="sync-pill" class="pill '+(bad?'bad':off?'amber':'ok')+'" title="Sinkron antar perangkat">'+(bad?'Sinkron gagal':off?'Offline':SG.state==='live'?'Tersinkron':'Menyambung…')+'</span>';
}
function syncStatusText(){
  if(!syncOn())return 'Mati. Data hanya ada di perangkat ini.';
  const t=SG.lastOk?' · terakhir '+fmtTime(SG.lastOk):'';
  if(SG.state==='error')return '<b style="color:var(--bad)">Gagal:</b> '+esc(SG.err||'tidak diketahui');
  if(SG.state==='offline')return 'Terputus dari '+syncWhere()+'. Perubahan disimpan di perangkat ini dan dikirim otomatis saat tersambung lagi'+t+'.';
  if(SG.state==='live')return 'Aktif lewat '+syncWhere()+', kode toko <b>'+esc(SG.cfg.code)+'</b>'+t+'.';
  return 'Menyambung ke '+syncWhere()+'…';
}
function syncErrMsg(e){
  const c=(e&&e.code)||'',m=(e&&e.message)||String(e);
  if(c==='wrong-code')return 'Kode toko salah. Gunakan kode yang sama dengan perangkat lain.';
  if(c==='no-server')return m;
  if(/unavailable|failed to fetch|network|load failed|terjangkau/i.test(c+m))return 'Server lokal tidak terjangkau. Pastikan komputer server menyala dan perangkat tersambung ke WiFi kedai.';
  return m.slice(0,160);
}
function syncAfterRemote(){
  if(!S.dev)cfgApply();
  if(S.user){const u=userById(S.user.id);if(!u){logout();return}S.user=u}
  clearTimeout(SG.rTimer);
  const busy=()=>$('#modal-root').firstChild||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&document.activeElement.closest('#app'));
  const tryR=()=>{if(busy()){SG.rTimer=setTimeout(tryR,1500);return}render()};
  tryR();
}
function syncSchedule(){if(!syncOn()||!SG.api)return;clearTimeout(SG.timer);SG.timer=setTimeout(syncPush,400)}
function syncPush(){
  if(!syncOn()||!SG.api)return;
  const m=syncRecs(db),ops=[];
  for(const [k,x] of m){const j=JSON.stringify(x),h=hashStr(j);if(SG.base[k]!==h){ops.push({k,j,prev:SG.base[k]});SG.base[k]=h}}
  for(const k of Object.keys(SG.base))if(!m.has(k)){ops.push({k,del:true,prev:SG.base[k]});delete SG.base[k]}
  if(!ops.length)return;
  syncBaseSave();
  SG.api.write(ops).then(()=>{SG.lastOk=Date.now();if(SG.state!=='error')syncState('live')}).catch(e=>{
    ops.forEach(o=>{if(o.prev===undefined)delete SG.base[o.k];else SG.base[o.k]=o.prev+'!'});syncBaseSave();
    const msg=syncErrMsg(e);syncState(/terjangkau|internet/i.test(msg)?'offline':'error',msg);
    clearTimeout(SG.retry);SG.retry=setTimeout(syncPush,10000);
  });
}
async function syncStart(){
  if(!syncOn()||SG.started)return;
  if(!(await localDetect())){SG.cfg.on=false;syncCfgSave();syncState('off','');if(S.user)render();return}
  SG.started=true;
  syncState('connecting');
  try{await syncMakeApi(SG.cfg.code);syncListen();syncPush()}
  catch(e){SG.started=false;const msg=syncErrMsg(e);syncState(/terjangkau|internet/i.test(msg)?'offline':'error',msg);clearTimeout(SG.retry);SG.retry=setTimeout(syncStart,10000)}
}
function syncStop(){if(SG.unsub){SG.unsub();SG.unsub=null}clearTimeout(SG.retry);SG.started=false;SG.api=null;syncState('off','')}
addEventListener('online',()=>{if(syncOn()){if(!SG.started)syncStart();else syncPush()}});

/* ---- tampilan di Pengaturan ---- */
function syncCardHTML(){
  const on=syncOn(),local=SG.mode==='local';
  if(!local&&!on)return '<div class="card"><div class="card-h"><h3>Sinkron antar perangkat</h3></div><div class="form"><p class="muted">Mati. Data hanya ada di perangkat ini.</p><p class="muted help">Untuk menyinkronkan tablet, laptop, dan HP, buka aplikasi dari <b>Server Lokal Soan Kofe</b> di komputer kedai (alamat seperti http://192.168.1.10:8080). Sinkron, berkas, dan laporan CSV tersedia di sana.</p></div></div>';
  return '<div class="card"><div class="card-h"><h3>Sinkron antar perangkat</h3>'+(on?'<span class="pill ok">Aktif</span>':'<span class="pill amber">Server lokal</span>')+'</div><div class="form">'
   +'<p class="muted" id="sync-status">'+syncStatusText()+'</p>'
   +(on?'<button class="btn ghost" data-act="sync-now">Sinkron sekarang</button><button class="btn danger" data-act="sync-off">Matikan sinkron di perangkat ini</button>'
       :'<p class="muted help">Aplikasi ini dibuka dari server lokal kedai. Aktifkan sinkron agar tablet, laptop, dan HP yang tersambung ke WiFi kedai memakai data yang sama secara real-time.</p><button class="btn primary" data-act="sync-on">Aktifkan sinkron</button>')
   +'</div></div>'+filesCardHTML();
}
ACT['sync-on']=()=>modal({title:'Aktifkan sinkron',body:'<p class="muted help">Buat kode toko rahasia (minimal 8 karakter: huruf kecil, angka, tanda -, tanpa spasi). Masukkan kode yang <b>sama persis</b> di setiap perangkat. Kode ini berfungsi seperti kata sandi data toko.</p><div class="fld"><label class="lbl" for="sync-code">Kode toko</label><input class="in" id="sync-code" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="contoh: soankofe-lebakbulus-27"></div><p class="muted help">Aktifkan lebih dulu di perangkat yang datanya paling lengkap (tablet kasir).</p>',foot:'<button class="btn ghost" data-act="close">Batal</button><button class="btn primary" data-act="sync-go">Lanjut</button>'});
ACT['sync-go']=async el=>{
  const code=($('#sync-code').value||'').trim().toLowerCase().replace(/\s+/g,'-');
  if(!/^[a-z0-9-]{8,40}$/.test(code)){toast('Kode minimal 8 karakter: huruf kecil, angka, atau tanda - (tanpa spasi)');return}
  el.disabled=true;el.textContent='Memeriksa…';
  SG.cfg={on:false,code,dev:(SG.cfg&&SG.cfg.dev)||'d-'+uid(),last:0};
  try{
    await syncMakeApi(code);SG.cfg.mode=SG.mode;
    if(await SG.api.isEmpty()){

  const sub2=pgs.map(pg=>pg==='menu'?'':pageSub(pg)).join('');
  const tam='<div class="fld"><label class="lbl" for="dv-aksen">Warna aksen</label><div style="display:flex;gap:8px;align-items:center"><input type="color" id="dv-aksen" data-dvc="aksen" value="'+(hexOk(d.tema.aksen)?d.tema.aksen:'#F2A31B')+'"><button class="btn sm ghost" data-dv="aksen-reset">Bawaan</button></div></div>'
    +'<div class="fld"><label class="lbl" for="dv-judul">Judul halaman login</label><input class="in" id="dv-judul" data-dvc="judul" value="'+esc(d.teks.judulLogin||'')+'" maxlength="40"></div><div class="fld"><label class="lbl" for="dv-tag">Hashtag login</label><input class="in" id="dv-tag" data-dvc="tag" value="'+esc(d.teks.hashtag||'')+'" maxlength="40"></div>'
    +'<div class="lbl">Kartu di halaman Laporan</div>'+d.laporan.map(x=>sw('lap',x.id,x.tampil!==false,RLBL[x.id]||x.id)).join('');
  el.innerHTML='<div class="dv-head"><div><b>Bilah Developer</b><span>'+(dirty?'Ada perubahan belum disimpan':'Tersimpan · berlaku di semua perangkat')+'</span></div><button class="icon-btn" data-dv="close" aria-label="Tutup bilah">✕</button></div>'
    +'<div class="dv-body">'+devSec('nav','Navigasi & sub menu',nav)+devSec('fit','Fitur',fit)+devSec('sub','Sub menu halaman',sub+'<p class="dv-help" style="margin-top:12px">Bagian setiap halaman yang aktif: urutkan dengan ↑ ↓, centang untuk menampilkan.</p>'+sub2)+devSec('kas','Halaman Kasir',kas)+devSec('tam','Tampilan & laporan',tam)
    +'<div class="dv-reset"><button class="btn sm ghost" data-dv="reset">Kembalikan ke pengaturan dasar</button></div></div>'
    +'<div class="dv-foot"><button class="btn ghost" data-dv="cancel"'+(dirty?'':' disabled')+'>Batalkan</button><button class="btn primary" data-dv="save"'+(dirty?'':' disabled')+'>Simpan & sebarkan</button></div>';
}
function devLive(){cfgApply();render();devRender()}
function devMove(id,op){
  const f=devFind(id);if(!f)return;const {arr,i,x,depth,parent}=f;
  if(op==='up'&&i>0){arr.splice(i,1);arr.splice(i-1,0,x)}
  else if(op==='down'&&i<arr.length-1){arr.splice(i,1);arr.splice(i+1,0,x)}
  else if(op==='in'){const g=arr[i-1];if(!devIsGroup(g))return;if(devIsGroup(x)&&depth>=2){toast('Grup hanya bisa sampai tingkat 2');return}if(depth>=3)return;arr.splice(i,1);(g.anak=g.anak||[]).push(x)}
  else if(op==='out'&&parent){const pf=devFind(parent.id);arr.splice(i,1);pf.arr.splice(pf.i+1,0,x)}
}
function devClick(el){
  const a=el.dataset.dv,id=el.dataset.id,d=S.dev.draft;
  if(a==='sec'){S.dev.open[id]=!S.dev.open[id];devRender();return}
  if(a==='close'){if(devDirty()){confirmBox('Tutup bilah','Perubahan yang belum disimpan akan dibatalkan.','Tutup tanpa simpan',()=>devStop())}else devStop();return}
  if(a==='cancel'){S.dev.draft=JSON.parse(S.dev.saved);devLive();toast('Perubahan dibatalkan');return}
  if(a==='save'){const empty=k=>!d.kasir[k].some(x=>x.tampil!==false);if(empty('tipePesanan')||empty('metodeBayar')){toast('Minimal satu tipe pesanan dan satu metode bayar harus tampil');return}
    db.settings.ui=Object.assign(dvClone(d),{ts:Date.now(),by:S.user?S.user.id:null});S.dev.saved=JSON.stringify(d);save();devLive();toast('Tersimpan. Perangkat lain ikut berubah lewat sinkron');return}
  if(a==='reset'){confirmBox('Kembalikan ke pengaturan dasar','Semua pengaturan dari Bilah Developer dihapus. Aplikasi kembali memakai pengaturan dasar dari Panel Developer (GitHub). Data toko tidak berubah.','Kembalikan',()=>{db.settings.ui=null;save();S.dev=null;devStart();toast('Kembali ke pengaturan dasar')},true);return}
  if(a==='add-grup'){const g={id:'g-'+uid().slice(0,8).replace(/[^\w]/g,''),jenis:'grup',label:'Grup baru',tampil:true,kasir:true,anak:[]};const si=d.menu.findIndex(x=>x.id==='settings');d.menu.splice(si>=0?si:d.menu.length,0,g);devLive();setTimeout(()=>{const i=$('#devbar [data-dvc="lbl"][data-id="'+g.id+'"]');if(i){i.focus();i.select()}},50);return}
  if(a==='add-link'){const l={id:'ln-'+uid().slice(0,8).replace(/[^\w]/g,''),jenis:'tautan',label:'Tautan baru',url:'https://',tampil:true,kasir:true};const si=d.menu.findIndex(x=>x.id==='settings');d.menu.splice(si>=0?si:d.menu.length,0,l);devRender();toast('Isi nama & alamat tautan');return}
  if(a==='cart'){d.kasir.keranjang=id;devLive();return}
  if(a==='card'){d.kasir.ukuranKartu=id;devLive();return}
  if(a==='aksen-reset'){delete d.tema.aksen;devLive();return}
  if(a==='mt-up'||a==='mt-down'){const L=d.menuBahan.tab,i=L.findIndex(x=>x.id===id),j=a==='mt-up'?i-1:i+1;if(i<0||j<0||j>=L.length)return;const [x]=L.splice(i,1);L.splice(j,0,x);devLive();return}
  if(a==='sf'){d.transaksi.filterAwal=id;devLive();return}
  if(a==='pt-up'||a==='pt-down'){const pg=el.dataset.pg,L=d.bagian[pg],ordIds=(PARTS[pg].o||[]).map(x=>x[0]),ord=L.filter(x=>ordIds.includes(x.id)),i=ord.findIndex(x=>x.id===id),j=a==='pt-up'?i-1:i+1;if(i<0||j<0||j>=ord.length)return;const t=ord[i];ord[i]=ord[j];ord[j]=t;d.bagian[pg]=ord.concat(L.filter(x=>!ordIds.includes(x.id)));devLive();return}
  if(a==='rr'){d.laporanRentang=id;devLive();return}
  const f=devFind(id);if(!f)return;
  if(['up','down','in','out'].includes(a)){devMove(id,a);devLive();return}
  if(a==='hide'){if(devLocked(id))return;f.x.tampil=f.x.tampil===false;devLive();return}
  if(a==='kasir'){if(devLocked(id))return;f.x.kasir=f.x.kasir===false;devLive();return}
  if(a==='del'){if(devIsGroup(f.x)&&f.x.anak&&f.x.anak.length)f.arr.splice(f.i,1,...f.x.anak);else f.arr.splice(f.i,1);devLive();return}
}
function devChange(el){
  const a=el.dataset.dvc,id=el.dataset.id,d=S.dev.draft;
  if(a==='lbl'){const f=devFind(id),v=el.value.trim();if(f){if(!v){el.value=f.x.label;return}f.x.label=v.slice(0,30);if(f.x.short)delete f.x.short}}
  else if(a==='url'){const f=devFind(id),v=el.value.trim();if(f){if(!urlOk(v)){toast('Alamat harus diawali https:// atau files/');return}f.x.url=v}}
  else if(a==='fitur')d.fitur[id]=el.checked;
  else if(a==='lap'){const x=d.laporan.find(y=>y.id===id);if(x)x.tampil=el.checked}
  else if(/^(tp|mb)-(on|lbl)$/.test(a)){const L=a.startsWith('tp')?d.kasir.tipePesanan:d.kasir.metodeBayar,x=L.find(y=>y.id===id);if(!x)return;if(a.endsWith('on')){if(!el.checked&&L.filter(y=>y.tampil!==false).length<2){el.checked=true;toast('Minimal satu harus tampil');return}x.tampil=el.checked}else x.label=el.value.trim()||x.label}
  else if(a==='pt-on'||a==='pt-lbl'){const pg=el.dataset.pg,L=d.bagian[pg],x=L.find(y=>y.id===id);if(!x)return;
    if(a==='pt-lbl'){const v=el.value.trim().slice(0,30);if(v)x.label=v;else delete x.label}
    else{if(pg==='inventory'&&(id==='cek'||id==='log')&&!el.checked&&!L.some(y=>y!==x&&(y.id==='cek'||y.id==='log')&&y.tampil!==false)){el.checked=true;toast('Minimal satu tab Inventory harus tampil');return}x.tampil=el.checked}}
  else if(a==='mt-on'){const L=d.menuBahan.tab,x=L.find(y=>y.id===id);if(!el.checked&&L.filter(y=>y.tampil!==false).length<2){el.checked=true;toast('Minimal satu tab harus tampil');return}x.tampil=el.checked}
  else if(a==='mt-lbl'){const x=d.menuBahan.tab.find(y=>y.id===id);x.label=el.value.trim().slice(0,24)}
  else if(a==='aksen')d.tema.aksen=el.value;
  else if(a==='judul')d.teks.judulLogin=el.value.trim();
  else if(a==='tag')d.teks.hashtag=el.value.trim();
  devLive();
}
document.addEventListener('click',e=>{const el=e.target.closest('#devbar [data-dv]');if(el&&!el.disabled&&S.dev)devClick(el)});
document.addEventListener('change',e=>{const el=e.target.closest('#devbar [data-dvc]');if(el&&S.dev)devChange(el)});
function devCardHTML(){
  const o=db.settings.ui,u=o&&userById(o.by);
  return '<div class="card"><div class="card-h"><h3>Mode Developer</h3><button class="btn sm primary" data-act="dev-open">Buka Bilah Developer</button></div><p class="muted help" style="margin:0">Atur navigasi, sub menu, fitur, halaman Kasir, dan tampilan langsung dari POS. Perubahan terlihat seketika dan ikut sinkron ke semua perangkat.</p>'
   +(o?'<p class="muted help" style="font-size:12px;margin:8px 0 0">Pengaturan aktif dari Bilah Developer'+(o.ts?' · diubah '+fmtDT(o.ts):'')+(u?' oleh '+esc(u.name):'')+'</p>':'<p class="muted help" style="font-size:12px;margin:8px 0 0">Sekarang memakai pengaturan dasar dari Panel Developer.</p>')+'</div>';
}
ACT['dev-open']=()=>{if(!isOwner()){toast('Bilah Developer khusus Owner');return}if(!S.dev)devStart()};

ACT['fin-more']=()=>{const it=(a,t)=>'<button class="list-row wa-opt" data-act="'+a+'"><div class="l"><b>'+t+'</b></div><span class="muted">›</span></button>';modal({title:'Kas lainnya',body:it('fin-in','Catat pemasukan')+it('fin-move','Pindah kas')+it('fin-adj','Penyesuaian saldo')+it('fin-limit','Batas Drawer')})};
/* ---- tampilan ringkas: per perangkat ---- */
const RINGKAS_KEY='soankofe.pos.ringkas';
function ringkasOn(){return lsGet(RINGKAS_KEY)!=='0'}
function ringkasApply(){document.body.classList.toggle('ringkas',ringkasOn())}
ACT['ringkas-tog']=()=>{lsSet(RINGKAS_KEY,ringkasOn()?'0':'1');ringkasApply();render();toast(ringkasOn()?'Tampilan ringkas aktif':'Teks bantuan ditampilkan')};

/* ========== boot ========== */
(function init(){
  const t=lsGet(THEME_KEY);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);
  probeStorage();
  ringkasApply();
  if(!PREVIEW)syncCfgLoad();
  load();
  loadConfig();
  const sid=lsGet(SESSION_KEY),u=sid?userById(sid):null;if(u)S.user=u;
  if(PREVIEW){S.user=db.users.find(x=>x.role==='owner')||db.users[0];render();try{parent.postMessage({type:'soan-preview-ready'},location.origin)}catch(e){}return}
  render();
  localDetect().then(l=>{if(l&&S.user&&S.view==='settings')render()});
  syncStart();
})();
})();
</script>
