<style>
/* Layout: sidebar hitam + konten krem; kasir = grid produk + panel pesanan; motif lingkaran konsentris dari brand */
:root{
  --bg:#F6EFE6; --surface:#FFFFFF; --surface-2:#FAF5EC; --ink:#151412; --muted:#6B645B; --line:#E6DDD0; --line-2:#CFC4B3;
  --amber:#F2A31B; --amber-soft:#FCEBC8; --on-amber:#151412;
  --ok:#2C7A4B; --ok-soft:#DCEFE2; --warn:#A85F08; --warn-soft:#FBE6CC; --bad:#B3361F; --bad-soft:#F8DCD5;
  --side:#151412; --side-fg:#F6EFE6; --side-muted:#9A9186; --side-line:#2A2724;
  --paper:#FFFDF8; --paper-ink:#151412;
  --font-display:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Montserrat','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --surface:#1C1A17; --surface-2:#242119; --ink:#F6EFE6; --muted:#A39A8E; --line:#33302A; --line-2:#4A453C;
  --amber:#F5AE2E; --amber-soft:#3B2D12; --ok:#6CCB92; --ok-soft:#1B3325; --warn:#F0A94E; --warn-soft:#3A2A12; --bad:#F08A76; --bad-soft:#3B1E18;
  --side:#0B0A09; --side-line:#24211E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121110; --surface:#1C1A17; --surface-2:#242119; --ink:#F6EFE6; --muted:#A39A8E; --line:#33302A; --line-2:#4A453C;
  --amber:#F5AE2E; --amber-soft:#3B2D12; --ok:#6CCB92; --ok-soft:#1B3325; --warn:#F0A94E; --warn-soft:#3A2A12; --bad:#F08A76; --bad-soft:#3B1E18;
  --side:#0B0A09; --side-line:#24211E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 13.5px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.lbl{font:600 10.5px/1.2 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ico{width:20px;height:20px;flex:none}
.mark{width:36px;height:36px;flex:none;color:var(--ink);--mark-gap:var(--surface)}
.mark-sm{width:30px;height:30px}.mark-lg{width:72px;height:72px}
.wm{display:inline-flex;flex-direction:column;line-height:1}
.wm b{font:800 26px/1 var(--font-display);letter-spacing:-.02em}
.wm i{font:500 9px/1 var(--font-display);letter-spacing:.7em;font-style:normal;margin-top:5px;padding-left:2px}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 13px var(--font-body);cursor:pointer;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line-2)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:0 14px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer}
.icon-btn.sm{width:30px;height:30px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* form */
.in,.sel,.ta{width:100%;min-height:42px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:500 13.5px var(--font-body)}
.ta{padding:10px 14px;min-height:80px;resize:vertical}
.in:focus,.sel:focus,.ta:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--amber-soft)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--amber)}
.st-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.st-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 11px;cursor:pointer;font:inherit}.st-opt b{font-size:14px}.st-opt span{font-size:11.5px;color:var(--muted)}.st-opt.on{border-color:var(--amber);background:var(--amber-soft,var(--surface-2));box-shadow:inset 0 0 0 1px var(--amber)}
.inv-foot{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px;box-shadow:0 -6px 18px rgba(0,0,0,.06)}.inv-foot .in{flex:1;min-width:160px}.inv-cnt{width:96px;text-align:right}@media (max-width:640px){.inv-tbl{min-width:0!important}.inv-tbl thead{display:none}.inv-tbl tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}.inv-tbl td{border:0!important;padding:0!important;text-align:left!important}.inv-tbl td:nth-child(1){grid-column:1/-1}.inv-tbl td:nth-child(2)::before{content:"Tercatat ";color:var(--muted);font-size:12px}.inv-tbl td:nth-child(3){display:none}.inv-tbl td:nth-child(4){justify-self:end}.inv-tbl td:nth-child(5){display:flex;align-items:center;gap:8px}.inv-tbl td:nth-child(5)::before{content:"Hitung fisik";color:var(--muted);font-size:12px;white-space:nowrap}.inv-tbl td:nth-child(6){justify-self:end}.inv-tbl td:nth-child(7){grid-column:1/-1}.inv-foot{position:static;box-shadow:none}.inv-foot #inv-note{order:5;flex-basis:100%}}.inv-d{font-weight:700;white-space:nowrap}.inv-d.up{color:var(--ok)}.inv-d.dn{color:var(--bad)}
.wa-prev{display:flex;justify-content:center;background:var(--surface-2);border-radius:14px;padding:12px}.wa-prev img{max-width:100%;width:340px;height:auto;box-shadow:0 6px 22px rgba(0,0,0,.18)}
.wa-txt{background:#e7ffdb;color:#111b21;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45;white-space:normal;margin-top:6px;max-height:320px;overflow:auto}
.wa-opt{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:inherit;font:inherit;padding:12px 2px}.wa-opt:disabled{opacity:.45;cursor:default}
#wa-ask{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(76px + env(safe-area-inset-top,0px));z-index:150;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-left:4px solid #25D366;border-radius:14px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.22)}#wa-ask p{margin:4px 0 10px;font-size:13px;color:var(--muted)}#wa-ask .row{display:flex;gap:8px}
@media (max-width:760px){#wa-ask{top:calc(64px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto}}
body.dev-on{padding-right:400px}body.dev-on .pos.pop .cart{right:416px}
#devbar{position:fixed;top:0;right:0;bottom:0;width:400px;z-index:95;background:var(--surface);color:var(--ink);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.dv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--side);color:var(--side-fg)}.dv-head b{display:block;font:700 16px var(--font-display)}.dv-head span{font-size:11.5px;opacity:.75}.dv-head .icon-btn{color:var(--side-fg);border-color:var(--side-line)}
.dv-body{flex:1;overflow-y:auto;padding:8px 12px 16px}
.dv-sec{border-bottom:1px solid var(--line)}.dv-sh{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:12px 4px;font:700 14px var(--font-body);color:var(--ink);cursor:pointer}.dv-sb{padding:0 2px 14px;display:flex;flex-direction:column;gap:8px}
.dv-help{font-size:11.5px;color:var(--muted);margin:0}
.dv-it{margin-left:calc(var(--d)*18px);border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface-2);margin-top:6px}.dv-it.hid{opacity:.55}.dv-it.hid .dv-lbl{text-decoration:line-through}
.dv-row{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.dv-k{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dv-lbl,.dv-url{min-height:34px;padding:6px 9px;font-size:13px}.dv-url{margin-top:4px}
.dv-acts{display:flex;gap:4px;flex-wrap:wrap}.dv-ib{min-width:30px;height:28px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer;font:700 13px var(--font-body)}.dv-ib:disabled{opacity:.3;cursor:default}
.dv-kids{}.dv-empty{font-size:11.5px;color:var(--muted);margin:6px 0 0 calc(var(--d)*18px)}
.dv-adds{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.dv-sw{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:4px 0}.dv-sw input{width:18px;height:18px;margin-top:2px;accent-color:var(--amber)}.dv-sw b{display:block;font-size:13px;font-weight:600}.dv-sw small{display:block;font-size:11.5px;color:var(--muted)}
.dv-li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}.dv-li input[type=checkbox]{width:18px;height:18px;accent-color:var(--amber)}.dv-li .in{min-height:34px;padding:6px 9px;font-size:13px}
body.no-hpp .hpp,body.no-hpp .rc-row .rc-c,body.no-hpp .fld:has(#rs-cost),body.no-hpp #rs-avg,body.no-hpp .fld:has(#if-cost),body.no-hpp .rc:has(#if-pp){display:none!important}
.thf{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:2px 4px;margin:-2px -4px;border-radius:6px;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;white-space:nowrap}.thf i{font-style:normal;opacity:.55;font-size:.9em}.thf:hover{background:var(--surface-2)}.thf.on{color:var(--ink);background:var(--amber-soft)}.thf.on i{opacity:1}
#thf-pop{position:fixed;z-index:160;min-width:180px;max-width:min(300px,calc(100vw - 16px));max-height:60vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:4px}
#thf-pop button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;padding:9px 10px;border-radius:8px;font:500 13.5px var(--font-body);color:inherit;cursor:pointer;text-align:left}#thf-pop button:hover,#thf-pop button:focus-visible{background:var(--surface-2);outline:none}#thf-pop span{flex:1}#thf-pop small{color:var(--muted);font-size:12px}#thf-pop b{width:14px;text-align:right}
.thf-m{display:none}.thf-m .thf{border:1px solid var(--line);border-radius:999px;padding:7px 12px;margin:0;font-size:13px;font-weight:600;background:var(--surface)}@media (max-width:640px){.thf-m{display:inline-flex}}
.thf-reset{text-align:center;padding:0 0 18px}
.saji-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}.saji-b{min-height:96px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface-2);font:700 22px var(--font-display);color:var(--ink);cursor:pointer}.saji-b.saji-ice{background:#e6f2fb;color:#0f4c75;border-color:#bcdcf2}.saji-b.saji-hot{background:#fbeee4;color:#8a3b12;border-color:#f0cfb6}
.saji-tg{border:0;border-radius:999px;padding:1px 8px;font:700 11px var(--font-body);cursor:pointer;vertical-align:middle;margin-left:4px;background:var(--surface-2);color:var(--ink)}.saji-tg.saji-ice{background:#e6f2fb;color:#0f4c75}.saji-tg.saji-hot{background:#fbeee4;color:#8a3b12}
.saji-opt{display:flex;gap:18px;flex-wrap:wrap}.sj-box{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.sj-h{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sj-lbl{width:110px;font-weight:700}.sj-seg{flex:1;min-width:240px}.sj-row{display:grid;grid-template-columns:minmax(0,1fr) 80px auto;gap:6px;align-items:center;margin-top:6px}
.u-row{display:flex;gap:6px;align-items:center}.u-row .in{flex:1;min-width:0}.u-sel{width:auto;flex:0 0 auto;padding-right:26px}.u-lbl{color:var(--muted);font-weight:600;font-size:13px}.inv-u{justify-content:flex-end}.inv-u .u-sel{min-height:36px;padding:4px 24px 4px 8px;font-size:13px}
.ch-seg{width:100%}.ch-seg button{min-height:46px;font-size:15px}.ch-ad .chip{min-height:40px}
.uk-h,.uk-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 70px minmax(0,1.4fr) auto;gap:6px;align-items:center}.uk-h{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.uk-row{margin-bottom:6px}
@media (max-width:560px){.uk-h{display:none}.uk-row{grid-template-columns:1fr 1fr 60px auto;border-bottom:1px dashed var(--line);padding-bottom:6px}.uk-row select{grid-column:1/4}}
.ad-box{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}.ad-h{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:6px}.ad-r{display:grid;grid-template-columns:100px minmax(0,1fr) 80px auto;gap:6px;align-items:center}
@media (max-width:560px){.ad-r{grid-template-columns:90px minmax(0,1fr) 64px auto}}
.tb-list{display:flex;flex-direction:column}.tb-r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tb-r b{display:block}.tb-r small{color:var(--muted);font-size:12px}.tb-q{display:flex;align-items:center;gap:12px}.tb-q b{min-width:22px;text-align:center;font-size:18px}.tb-q .qbtn{width:40px;height:40px;font-size:20px}
.ic-row{display:grid;grid-template-columns:minmax(0,1fr) 28px auto auto auto;gap:6px;align-items:center;margin-bottom:6px}.imp-k{width:auto;max-width:48%;min-height:36px;padding:4px 26px 4px 8px;font-size:13px}
.pr-r{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:6px;align-items:center}
.dv-seg{width:100%}.dr-bar{display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap;margin:-4px 0 12px}.dr{display:flex;gap:8px;flex-wrap:wrap}.dr-f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}.dr-f .in{min-height:40px;padding:6px 10px;width:auto}.sv-top{margin-bottom:8px}.sv-seg{width:auto;min-width:230px}.s-isi{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.imp-sum{font-size:13px;margin:4px 0 8px}.imp-g{margin-top:8px}.imp-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.imp-r.ada{opacity:.5}.imp-n{min-width:0}.imp-n b{display:block;font-size:13.5px}.imp-n small{color:var(--muted);font-size:11.5px}#imp-prev{max-height:46vh;overflow:auto}.dv-pg{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px dashed var(--line)}.dv-pn{font-size:13px;font-weight:600;min-width:0}.dv-pn small{color:var(--muted);font-weight:400}.dv-li3{grid-template-columns:auto minmax(0,1fr) auto}.dv-reset{padding:14px 2px 0}
.dv-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}.dv-foot .btn:disabled{opacity:.45}
@media (max-width:999px){body.dev-on{padding-right:0}#devbar{width:auto;left:0;top:auto;height:62dvh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2)}body.dev-on .content{padding-bottom:calc(62dvh + 16px)}}
.ak-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}.ak-grid .chk{font-weight:500}@media (max-width:420px){.ak-grid{grid-template-columns:1fr}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:600 11px/1.4 var(--font-body);background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
a.btn{text-decoration:none}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.amber{background:var(--amber-soft);color:var(--ink);border-color:transparent}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--amber);color:var(--on-amber);font:700 11px var(--font-body)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.card.flush{padding:0;overflow:hidden}
.card h3{font-size:17px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;align-self:start;background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:22px;padding:22px 14px;overflow-y:auto}
.side .mark{color:var(--side-fg);--mark-gap:var(--side)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-i{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--side-muted);font:600 13px var(--font-body);cursor:pointer;text-align:left}
.nav-i:hover{color:var(--side-fg)}
.nav-i.on{background:var(--amber);color:var(--on-amber)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.nav-l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
a.nav-i,a.tab{text-decoration:none}
.nav-gh.act{color:var(--side-fg)}
.nav-chev{margin-left:auto;width:16px;height:16px;transition:transform .15s;flex:none}.nav-chev.open{transform:rotate(90deg)}
.nav-sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px 20px;padding-left:10px;border-left:1px solid var(--side-line)}
.nav-sub .nav-i{min-height:38px;font-size:12.5px}
.sheet{display:flex;flex-direction:column}
.sheet-g{display:flex;align-items:center;gap:10px;padding:12px 0 6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.sheet-i{width:100%;border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;text-decoration:none}
.sheet-i.on b{color:var(--amber)}
.pg{display:flex;flex-direction:column;gap:12px;max-width:760px}
.pg-h{margin:0;font-size:22px}.pg-p{margin:0;line-height:1.6}.pg-img{max-width:100%;border-radius:14px;display:block}
.pg-btn{align-self:flex-start;text-decoration:none}.pg-hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.shift-card{border:1px solid var(--side-line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--side-muted)}
.shift-card b{color:var(--side-fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.dot.off{background:var(--muted)}
.user-chip{display:flex;align-items:center;gap:10px;padding:0 6px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--amber);color:var(--on-amber);display:grid;place-items:center;font:700 14px var(--font-display);flex:none}
.user-chip .who{min-width:0;flex:1;line-height:1.25}
.user-chip .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-chip .who span{font-size:11px;color:var(--side-muted)}
.user-chip .icon-btn{border-color:var(--side-line);color:var(--side-fg)}
.main-wrap{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:14px clamp(16px,3vw,28px);background:var(--bg);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:24px;line-height:1.1}
.top .sub{font-size:12px;color:var(--muted);margin-top:2px}
.top .only-m.mark{display:none}
.content{padding-inline:clamp(16px,3vw,28px);padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;gap:2px}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border:0;border-radius:14px;background:transparent;color:var(--side-muted);font:600 10px var(--font-body);cursor:pointer}
.tab.on{color:var(--on-amber);background:var(--amber)}
.only-m{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.toolbar-r{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar-r .search{width:240px;max-width:100%}
.toolbar-r .sel{width:auto;min-width:130px}
.chips{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;font:600 12.5px var(--font-body);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:flex;border:1.5px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.seg button{flex:1;min-height:34px;border:0;border-radius:999px;background:transparent;font:600 12px var(--font-body);cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}

/* kasir */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
.pos-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-min,158px),1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;min-height:128px;border:1.5px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer;transition:border-color .12s,transform .08s}
.tile:hover{border-color:var(--ink)}
.tile:active{transform:scale(.98)}
.tile .mark{width:30px;height:30px;color:var(--ink)}
.tile .tn{font:600 15px/1.2 var(--font-display);margin-top:4px;flex:1}
.tile .tp{font:700 13px var(--font-body);font-variant-numeric:tabular-nums}
.tile .ts{font-size:11px;color:var(--muted)}
.tile .ts.low{color:var(--warn);font-weight:700}
.tile.out{opacity:.45;cursor:not-allowed}
.tile-qty{position:absolute;top:12px;right:12px}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:84px;max-height:calc(100vh - 104px);max-height:calc(100dvh - 104px)}
.cart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cart-head h2{font-size:20px}
.cart-head-btns{display:flex;gap:8px;align-items:center}
.cust-btn{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 14px;border:1.5px dashed var(--line-2);border-radius:14px;background:transparent;cursor:pointer;font:600 12.5px var(--font-body);text-align:left}
.cart-items{flex:1;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ci{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ci-name{font:600 14px/1.25 var(--font-display)}
.ci-sub{font-size:11.5px;color:var(--muted)}
.ci-sub em{font-style:normal;color:var(--ink)}
.ci-tot{font:700 13px var(--font-body);text-align:right;font-variant-numeric:tabular-nums}
.ci-ctl{display:flex;align-items:center;gap:6px}
.qbtn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;font:700 16px/1 var(--font-body);display:grid;place-items:center}
.ci .q{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ci-act{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.cart-sum{display:flex;flex-direction:column;gap:6px;font-size:13px}
.sumr{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.sumr.tot{font:700 22px var(--font-display);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.link{border:0;background:none;padding:0;color:var(--ink);font:600 12.5px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.cart-foot{display:grid;grid-template-columns:auto 1fr;gap:10px}
.cart-fab{display:none}
.cart-bg{display:none}
.fab-go{margin-left:10px;font-weight:800}
@media (min-width:1000px){
  .pos.pop{display:block}
  .pos.pop .cart{position:fixed;top:16px;right:16px;bottom:16px;width:min(430px,calc(100vw - 32px));max-height:none;z-index:60;transform:translateX(calc(100% + 48px));visibility:hidden;transition:transform .25s,visibility 0s .25s;overflow:auto}
  .pos.pop .cart.open{transform:none;visibility:visible;box-shadow:-18px 0 50px rgba(0,0,0,.22);transition:transform .25s}
  .pos.pop .cart .only-m{display:inline-grid}
  .pos.pop~.cart-bg.on{display:block;position:fixed;inset:0;z-index:55;background:rgba(10,9,8,.35)}
  .cart-fab.pop{display:flex;position:fixed;right:24px;bottom:24px;z-index:35;align-items:center;justify-content:space-between;gap:14px;min-height:54px;min-width:340px;padding:0 22px;border-radius:999px;border:0;background:var(--amber);color:var(--on-amber);font:700 14px var(--font-body);cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.25)}
  .cart-fab.pop[hidden]{display:none}
}
@media (max-width:999px){.cart-bg{display:none!important}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px}
.empty .mark{width:54px;height:54px;opacity:.9}
.center-card{max-width:440px;margin:24px auto;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.center-card .btn{align-self:stretch}

/* tabel */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font:600 10.5px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface-2)}
.r{text-align:right;font-variant-numeric:tabular-nums}
td .sub{font-size:11.5px;color:var(--muted)}
td b{font-weight:600}
.sumbar{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.sumbar b{color:var(--ink)}

/* kpi + laporan */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font:700 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.hero .lbl{color:var(--line-2)}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:500 10px var(--font-body)}
.chart .bar{fill:var(--amber)}
.chart .bar.hl{fill:var(--ink)}
.hbars{display:flex;flex-direction:column;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px}
.hb-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-row .vl{font-variant-numeric:tabular-nums;font-weight:700}
.hb-track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.hb-fill{height:100%;background:var(--amber);border-radius:99px}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.stack span{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.c-cash{background:var(--amber)}.c-qris{background:var(--ink)}.c-debit{background:var(--muted)}.c-transfer{background:var(--line-2)}
.delta{font:700 11px var(--font-body)}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}

/* cetak */
#print-area{display:none}
.rk{font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;max-height:58vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.rk-b{font-weight:700}
.bf-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 70px 110px auto;gap:6px;margin-top:6px;align-items:center}
.bf-paste{border:1px dashed var(--line-2);border-radius:14px;padding:10px 12px;background:var(--surface-2)}
.bf-paste summary{cursor:pointer}.bf-paste textarea{margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (max-width:640px){.bf-row{grid-template-columns:1fr 70px auto}.bf-row select{grid-column:1/-1}.bf-row [data-bf=price]{grid-column:1/2}}.rk-e{height:10px}
code{font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);padding:1px 6px;border-radius:6px}
@media print{
  html,body{background:#fff!important;color:#000!important}
  #app,#modal-root,#toast{display:none!important}
  #print-area{display:block!important;font:9.4px/1.3 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:0;padding:0;color:#000}
}
@page{margin:0}

/* resep & bahan */
.rc{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px dashed var(--line-2);border-radius:18px;background:var(--surface-2)}
.rc-row{display:grid;grid-template-columns:minmax(0,1fr) 112px 34px;gap:8px;align-items:center}
.rc-row .rc-c{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.rc-q{position:relative}
.rc-q .in{padding-right:38px;text-align:right}
.rc-u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);pointer-events:none}
.rc-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.rc-sum div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-sum b{font:700 17px var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hint{font-size:11.5px;color:var(--muted)}
.cover{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* modal + toast */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(10,9,8,.58);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;border-radius:26px 26px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 12px}
.modal-h h3{font-size:20px}
.modal-b{padding:4px 20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font:600 13px var(--font-body);opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.big-total{font:700 38px/1 var(--font-display);font-variant-numeric:tabular-nums}
.pm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pm button{min-height:44px;border-radius:14px;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;font:600 12.5px var(--font-body)}
.pm button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.change-box{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.change-box b{font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.qr-note{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.receipt{background:var(--paper);color:var(--paper-ink);font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;padding:20px 18px;border-radius:14px;border:1px dashed var(--line-2)}
.receipt .c{text-align:center}
.receipt .store{font:800 22px var(--font-display);letter-spacing:-.01em}
.receipt hr{border:0;border-top:1px dashed #b9afa0;margin:10px 0}
.rl{display:flex;justify-content:space-between;gap:10px}
.rl span:first-child{min-width:0;overflow-wrap:anywhere}
.rl.b{font-weight:700;font-size:14px}
.void-stamp{border:2px solid var(--bad);color:var(--bad);display:inline-block;padding:2px 12px;border-radius:6px;font-weight:700;transform:rotate(-4deg);margin:6px 0}
textarea.code{font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;min-height:200px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .l{min-width:0}
.list-row .l b{display:block;font-weight:600}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;background:var(--ok)}
.pbar i.warn{background:var(--warn)}.pbar i.bad{background:var(--bad)}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;align-items:start}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;background:var(--amber-soft);font-size:12.5px;flex-wrap:wrap}
.banner b{font-weight:700}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.login-art{position:relative;overflow:hidden;background:var(--side);color:var(--side-fg);padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between;min-height:260px}
.login-art .wm b{font-size:44px}.login-art .wm i{font-size:13px}
.login-art h2{font-size:clamp(26px,3.4vw,40px);max-width:15ch;line-height:1.08;font-weight:600}
.big-ring{position:absolute;right:-18%;bottom:-26%;width:min(78%,520px);aspect-ratio:1;pointer-events:none}
.login-art .txt{position:relative;z-index:1;display:flex;flex-direction:column;gap:20px}
.login-form{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:clamp(24px,5vw,56px);max-width:520px;width:100%;margin:0 auto}
.u-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.u-tile{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:18px;background:var(--surface);cursor:pointer;text-align:left}
.u-tile.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--amber-soft)}
.u-tile b{display:block;font:600 14px var(--font-display)}
.u-tile span{font-size:11px;color:var(--muted)}
.pin-dots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.pin-dots i.f{background:var(--amber);border-color:var(--amber)}
.pin-dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.keypad button{height:56px;border-radius:50%;aspect-ratio:1;justify-self:center;width:64px;height:64px;border:1.5px solid var(--line-2);background:var(--surface);font:600 22px var(--font-display);cursor:pointer}
.keypad button:active{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.err-msg{color:var(--bad);font-weight:600;text-align:center;min-height:20px}

@media (max-width:999px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabbar{display:flex}
  .only-m{display:inline-grid}
  .top .only-m.mark{display:block}
  .content{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .pos{display:block}
  .cart{position:fixed;inset:0;z-index:60;max-height:none;border-radius:0;border:0;transform:translateY(100%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .cart.open{transform:none}
  .cart-fab{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--amber);color:var(--on-amber);font:700 14px var(--font-body);cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .login{grid-template-columns:minmax(0,1fr)}
  .login-art{min-height:200px}
}
@media (min-width:700px){
  .modal-bg{align-items:center;padding:24px}
  .modal{border-radius:26px}
}
@media (max-width:480px){
  .top .sub{display:none}
}
@media (max-width:420px){
  .top h1{font-size:20px}
  .kpi .v{font-size:22px}
  .toolbar-r .search{width:100%}
}
/* HP: muat pas di layar (bilah alamat browser, layar sempit, mode mendatar) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
@media (max-width:999px){
  .login-art{min-height:0;padding-bottom:28px}
  .big-ring{width:min(42vw,190px);right:-48px;top:-56px;bottom:auto}
  .login-art .txt{gap:14px}.login-art h2{max-width:none}
  .login-form{justify-content:flex-start;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
@media (max-height:520px) and (orientation:landscape){

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function computeTotals(items,disc,st){

  const discount=disc&&disc.type==='pct'?Math.round(subtotal*Math.min(100,dv)/100):Math.min(subtotal,dv);
  const base=subtotal-discount;
  const service=st.serviceEnabled?Math.round(base*st.serviceRate/100):0;
  const tax=st.taxEnabled?Math.round((base+service)*st.taxRate/100):0;
  return{subtotal,discount,service,tax,total:base+service+tax};
}

  const cart=S.pos.cart;if(!cart.length)return;
  const T=totals(),p=S.pay,st=db.settings;
  let paid=T.total,change=0;
  if(p.method==='cash'){paid=num(p.received);if(paid<T.total)return;change=paid-T.total}
  const ts=Date.now(),no=nextNo(ts);

const isoTs=v=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():null};
function rangeBounds(k,from,to){
  const t0=sod(Date.now());
  if(k==='custom'){let a=isoTs(from),b=isoTs(to);if(a==null&&b==null)return[t0,addDays(t0,1)];if(a==null)a=b;if(b==null)b=a;if(a>b){const x=a;a=b;b=x}return[a,addDays(b,1)]}
  switch(k){
    case 'today':return[t0,addDays(t0,1)];
    case 'yesterday':return[addDays(t0,-1),t0];
    case '7d':return[addDays(t0,-6),addDays(t0,1)];
    case '14d':return[addDays(t0,-13),addDays(t0,1)];
    case 'month':{const x=new Date(t0);x.setDate(1);return[x.getTime(),addDays(t0,1)]}
    default:return[0,addDays(t0,1)];
  }
}
function filteredSales(){
  const f=S.sf,[a,b]=rangeBounds(f.range,f.from,f.to),q=f.q.trim().toLowerCase();
  return db.sales.filter(s=>{
    if(s.ts<a||s.ts>=b)return false;
    if(f.status!=='all'&&s.status!==f.status)return false;
    if(f.method!=='all'&&s.method!==f.method)return false;
    if(q){const cu=s.customerId?custById(s.customerId):null;if(!(s.no.toLowerCase().includes(q)||(cu&&cu.name.toLowerCase().includes(q))||(s.items||[]).some(i=>String(i.name).toLowerCase().includes(q))))return false}
    return true;
  }).sort((x,y)=>y.ts-x.ts);
}

  o=o||{};const W=640,h=o.h||220,pl=46,pr=8,pt=10,pb=26,iw=W-pl-pr,ih=h-pt-pb;
  const max=niceMax(Math.max.apply(null,data.map(d=>d.v).concat([0]))),every=o.every||1;let g='';
  for(let i=0;i<=4;i++){const v=max/4*i,y=pt+ih-ih*(v/max);g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+shortRp(v)+'</text>'}
  const bw=iw/data.length,bar=Math.min(30,bw*.62);
  data.forEach((d,i)=>{
    const bh=ih*(d.v/max),x=pl+bw*i+(bw-bar)/2,y=pt+ih-bh;
    g+='<rect class="bar'+(o.hlLast&&i===data.length-1?' hl':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bar.toFixed(1)+'" height="'+(d.v>0?Math.max(bh,1.5):0).toFixed(1)+'" rx="'+Math.min(6,bar/2).toFixed(1)+'"><title>'+esc(d.label)+': '+rp(d.v)+'</title></rect>';
    if(i%every===0)g+='<text class="ax" x="'+(x+bar/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+esc(d.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="'+esc(o.label||'Grafik penjualan')+'">'+g+'</svg>';
}
function hbars(rows,fmt){

  return '<div class="hbars">'+rows.map(r=>'<div class="hb-row"><span class="nm">'+esc(r.name)+'</span><span class="vl">'+(fmt?fmt(r):rp(r.v))+'</span><div class="hb-track"><div class="hb-fill" style="width:'+Math.max(2,Math.round(r.v/max*100))+'%"></div></div></div>').join('')+'</div>';

function agg(list){

  return{rev,n:list.length,avg:list.length?rev/list.length:0,gp};
}

/* ========== shift ========== */
function shiftStats(sh){
  const ss=db.sales.filter(s=>s.shiftId===sh.id&&s.status==='paid');
  const cash=ss.filter(s=>s.method==='cash').reduce((a,s)=>a+s.total,0);
  const inn=sh.moves.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),out=sh.moves.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);
  return{ss,cash,total:ss.reduce((a,s)=>a+s.total,0),inn,out,expected:sh.openCash+cash+inn-out};
}
/* ========== kas tunai: Drawer (tunai masuk) & Dompet (tunai keluar) ==========
   Aturan: tunai masuk -> Drawer. Bila Drawer melebihi batas (bawaan Rp 200.000), kelebihannya
   otomatis dipindah ke Dompet. Tunai keluar diambil dari Dompet; bila Dompet habis, sisanya dari Drawer.
   Semua gerakan tercatat di db.cashLog seperti jurnal: {akun, jenis: debit (masuk) / kredit (keluar), jumlah, ket, foto}. */
const AKUN={drawer:'Drawer',dompet:'Dompet'};
const drawerLimit=()=>+db.settings.drawerLimit>0?+db.settings.drawerLimit:200000;
function cashBal(until){const b={drawer:0,dompet:0};(db.cashLog||[]).forEach(e=>{if(until!=null&&e.ts>until)return;if(b[e.akun]!==undefined)b[e.akun]+=(e.jenis==='debit'?1:-1)*(+e.jumlah||0)});return b}
function cashEntry(akun,jenis,jumlah,ket,o){
  jumlah=Math.round(+jumlah||0);if(jumlah<=0)return null;
  const e=Object.assign({id:uid(),ts:Date.now(),akun,jenis,jumlah,ket:ket||'',foto:'',userId:S.user?S.user.id:null},o||{});
  if(!Array.isArray(db.cashLog))db.cashLog=[];db.cashLog.push(e);return e;
}
function cashOverflow(){
  const lim=drawerLimit(),lebih=cashBal().drawer-lim;if(lebih<=0)return 0;const g=uid();
  cashEntry('drawer','kredit',lebih,'Pindah otomatis ke Dompet (Drawer lebih dari '+rp(lim)+')',{auto:1,grp:g});
  cashEntry('dompet','debit',lebih,'Pindahan otomatis dari Drawer',{auto:1,grp:g});
  return lebih;
}
function cashIn(jumlah,ket,o){cashEntry('drawer','debit',jumlah,ket,o);return cashOverflow()}
function cashOut(jumlah,ket,o){
  jumlah=Math.round(+jumlah||0);const b=cashBal(),dari=Math.min(Math.max(0,b.dompet),jumlah),sisa=jumlah-dari,g=uid();
  if(dari>0)cashEntry('dompet','kredit',dari,ket,Object.assign({grp:g},o||{}));
  if(sisa>0)cashEntry('drawer','kredit',sisa,ket+(dari>0?' (sisa dari Drawer)':''),Object.assign({grp:g},o||{}));
  return {dompet:dari,drawer:sisa};
}

const MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function rangeTxt(a,b){
  const x=new Date(a),y=new Date(b),d=t=>t.getDate(),m=t=>MON_EN[t.getMonth()],Y=t=>t.getFullYear();
  if(Y(x)!==Y(y))return d(x)+' '+m(x)+' '+Y(x)+' - '+d(y)+' '+m(y)+' '+Y(y);
  if(x.getMonth()!==y.getMonth())return d(x)+' '+m(x)+' - '+d(y)+' '+m(y)+' '+Y(y);
  if(d(x)!==d(y))return d(x)+'-'+d(y)+' '+m(x)+' '+Y(x);
  return d(x)+' '+m(x)+' '+Y(x);
}
const rpRekap=v=>'Rp. '+String(Math.round(v||0)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+',-';
function shiftRecap(sh){
  const x=shiftStats(sh),prod={},byM={};
  x.ss.forEach(s=>{byM[s.method]=(byM[s.method]||0)+s.total;s.items.forEach(i=>{prod[baseName(i)]=(prod[baseName(i)]||0)+i.qty})});
  const items=Object.entries(prod).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  const nonCash=Object.keys(byM).filter(k=>k!=='cash').reduce((a,k)=>a+byM[k],0);
  const kas=sh.openCash+x.inn-x.out,sysTotal=x.total+kas,closed=!!sh.closeTs;
  const actCash=closed?sh.closeCash+(sh.dompetOpen!=null&&sh.dompetClose!=null?sh.dompetClose-sh.dompetOpen:0):null,actTotal=closed?actCash+nonCash:null;
  return {sh,x,items,qty:items.reduce((a,i)=>a+i[1],0),byM,nonCash,kas,sysTotal,actCash,actTotal,diff:closed?actTotal-sysTotal:null,closed,start:sh.openTs,end:sh.closeTs||Date.now()};
}
/* baris rekap: {t, b} — b = tebal. Dipakai untuk teks WhatsApp, tampilan, dan cetak. */
function recapLines(r){
  const L=[],B=t=>L.push({t,b:1}),T=t=>L.push({t}),E=()=>L.push({t:''});
  B('Tanggal Penjualan : '+rangeTxt(r.start,r.end));
  if(!r.closed)T('(Shift masih berjalan - angka sementara)');
  E();B('Total Produk Terjual : '+r.qty+' Pcs');T('Produk Jumlah :');
  if(r.items.length)r.items.forEach(i=>T(i[1]+' '+i[0]));else T('-');
  E();B('DETAIL PENERIMAAN SISTEM :');
  const ms=UI.methods.concat(Object.keys(METHODS).filter(k=>!UI.methods.includes(k))).filter(k=>k==='cash'||r.byM[k]);
  ms.forEach(k=>T(METHODS[k]+' : '+rpRekap(r.byM[k])));
  T('Arus Kas : '+rpRekap(r.kas));B('Total : '+rpRekap(r.sysTotal));
  E();B('DETAIL PENERIMAAN AKTUAL :');
  if(r.closed){T(METHODS.cash+' : '+rpRekap(r.actCash));T('Non tunai & Web : '+rpRekap(r.nonCash));B('Total : '+rpRekap(r.actTotal));if(r.diff)B('Selisih : '+(r.diff>0?'+':'-')+rpRekap(Math.abs(r.diff)).replace('Rp. ','Rp. '));}
  else{T(METHODS.cash+' : (belum dihitung)');T('Non tunai & Web : '+rpRekap(r.nonCash));}
  E();B('DETAIL ARUS KAS :');
  T('Kas Awal : '+rpRekap(r.sh.openCash));if(r.x.inn)T('Kas Masuk : '+rpRekap(r.x.inn));T('Kas Keluar : '+rpRekap(r.x.out));B('Total : '+rpRekap(r.kas));
  return L;

function recapPrintLines(r,cols){

function waStockGroups(){

  db.ingredients.filter(x=>x.active!==false&&!x.belumCek).forEach(x=>{const st=ingState(x);g[st==='bad'?'Habis':st==='warn'?'Menipis':'Aman'].push({name:x.name,qty:Math.max(0,x.stock),unit:x.unit})});

function waCardLines(ev,sh){
  const W=32,SEP='-'.repeat(W),L=[],C=t=>L.push({t:asc(t),a:'c'}),T=(t,b)=>wrapTxt(asc(t),W).forEach(x=>L.push({t:x,b:b?1:0}));
  const LR=(a,v,b)=>{a=asc(a);v=asc(v);const g=W-a.length-v.length;L.push({t:g>=1?a+' '.repeat(g)+v:a+' '+v,b:b?1:0})};
  const nm=asc(db.settings.storeName||'Soan Kofe'),rpk=v=>'Rp '+Math.round(v||0).toLocaleString('id-ID');
  if(ev==='jalan'){const u=userById(sh.userId),P=waPayLines(sh),b=cashBal(),now=Date.now();
    L.push({t:nm,a:'c',big:1});C('TRANSAKSI BERJALAN');C(fmtDT(now));C('Shift: '+(u?u.name:'-')+' (sejak '+fmtTime(sh.openTs)+')');L.push({t:SEP});
    LR('Transaksi',String(P.x.ss.length));P.ms.forEach(k=>LR(METHODS[k],rpk(P.by[k])));L.push({t:SEP});LR('TOTAL',rpk(P.x.total),1);
    if(cashOn()){L.push({t:SEP});LR('Uang di Drawer',rpk(b.drawer));LR('Uang di Dompet',rpk(b.dompet))}
  }else{const r=shiftRecap(sh);recapPrintLines(r,W).forEach((l,i)=>{if(i===0)L.push({t:nm,a:'c',big:1});else if(/^Dicetak /.test(l.t))return;else L.push(l)});

  }

}
function waCard(lines){
  const sc=2,cw=10.2,lh=19,padX=16,padY=20,w=Math.round(32*cw+padX*2),h=padY*2+lines.reduce((a,l)=>a+(l.big?32:lh),0)+14;
  const cv=document.createElement('canvas');cv.width=w*sc;cv.height=h*sc;const g=cv.getContext('2d');g.scale(sc,sc);
  g.fillStyle='#FFFDF8';g.fillRect(0,0,w,h);g.fillStyle='#151412';
  for(let x=0;x<w;x+=10){g.beginPath();g.moveTo(x,h);g.lineTo(x+5,h-6);g.lineTo(x+10,h);g.fill()}
  let y=padY;const mono='ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
  lines.forEach(l=>{
    if(l.big){g.font='800 24px system-ui, -apple-system, "Segoe UI", sans-serif';g.textAlign='center';g.fillText(l.t,w/2,y+23);g.textAlign='left';y+=32;return}
    g.font=(l.b?'700 ':'400 ')+'16px '+mono;
    if(l.a==='c'){g.textAlign='center';g.fillText(l.t,w/2,y+15);g.textAlign='left'}else g.fillText(l.t,padX,y+15);y+=lh});
  return cv.toDataURL('image/png');
}
function dataBlob(u){const [h,b]=u.split(','),bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:h.slice(5).split(';')[0]})}

function waTick(){
  if(PREVIEW||!S.user)return;const c=waCfg();if(!c.on)return;const ask=$('#wa-ask');if(ask&&!ask.hidden)return;
  const sh=curShift(),st=waState(),now=new Date(),hm=p2(now.getHours())+':'+p2(now.getMinutes()),day=isoDate(now);

    if(st.shift!==sh.id){st.shift=sh.id;st.done=waJam().filter(t=>t<=fmtTime(sh.openTs));waStateSet(st)}
    const due=waJam().filter(t=>t<=hm&&!(st.done||[]).includes(t)).pop();
    if(due){st.done=(st.done||[]).concat(waJam().filter(t=>t<=hm));waStateSet(st);waAsk('Pukul '+due+' · waktunya lapor','Kirim kartu transaksi berjalan ('+shiftStats(sh).ss.length+' transaksi) ke grup '+c.grup+'?','jalan');return}
  }
  if(c.stok&&(canView('shift')||canView('inventory'))){
    const g=waStockGroups(),cur={};g.Habis.forEach(x=>cur[x.name]='Habis');g.Menipis.forEach(x=>cur[x.name]='Menipis');
    if(st.stokDay!==day){st.stokDay=day;st.stok={}}

  }

ACT['exp-save']=()=>{

  const foto=fotoVal();if(foto===false)return;
  let label,o={foto};
  if(S.expKind==='bahan'){
    const g=ingById(S.expIng),q=dec(($('#exp-qty')||{}).value)*kmF('exp-u',ingById(S.expIng));if(!g){toast('Pilih bahan');return}if(q<=0){toast('Isi jumlah bahan yang dibeli');return}
    const note=$('#exp-note').value.trim();
    if(S.expPay==='invoice'){
      const sup=($('#inv-sup').value||'').trim();if(!sup){toast('Isi nama pemasok / toko');$('#inv-sup').focus();return}
      const due=$('#inv-due').value||'',c=a/q;g.cost=newAvgCost(g,q,c);stkAdd(g,q);
      logIng(g.id,'restock',q,'Invoice belum dibayar: '+sup+(note?' · '+note:''),Math.round(c*100)/100);
      if(!Array.isArray(db.invoices))db.invoices=[];
      db.invoices.push({id:uid(),ts:Date.now(),supplier:sup,iid:g.id,name:g.name,qty:q,unit:g.unit,jumlah:Math.round(a),due,note,foto,status:'open',userId:S.user?S.user.id:null});
      save();closeModal();render();toast('Stok bertambah. Invoice '+rp(a)+' ke '+sup+' dicatat belum dibayar');return;

  }else{
    label=($('#fin-ket').value||'').trim();if(!label){toast('Isi keterangan, misalnya "Bayar parkir"');$('#fin-ket').focus();return}
    o.kat='lain';
  }

  const sh=curShift(),mv=sh?{id:uid(),ts:Date.now(),type:'out',amount:a,note:label}:null;if(mv){sh.moves.push(mv);o.ref=mv.id}

};

   +(paid.length?'<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Sudah lunas ('+paid.length+' terakhir)</summary>'+paid.map(row).join('')+'</details>':'')+'</div>';

  confirmBox('Bayar invoice',rp(v.jumlah)+' ke '+v.supplier+' untuk '+invLabel(v)+'. Diambil dari '+(dp&&dr?'Dompet '+rp(dp)+' + Drawer '+rp(dr):dp?'Dompet':'Drawer')+'. Stok tidak berubah lagi karena bahan sudah diterima.','Bayar',()=>{
    const label='Bayar invoice '+v.supplier+' · '+invLabel(v)+(v.note?' · '+v.note:'');

const MON_ALL={jan:0,feb:1,mar:2,apr:3,may:4,mei:4,jun:5,jul:6,aug:7,agu:7,agt:7,sep:8,oct:9,okt:9,nov:10,dec:11,des:11};
const moneyNum=t=>{const m=String(t||'').replace(/,-\s*$/,'').replace(/\.-\s*$/,'').replace(/[^\d]/g,'');return m?+m:0};
function parseRangeTxt(t){
  t=String(t||'').trim();const yNow=new Date().getFullYear();let m;
  const mon=x=>MON_ALL[String(x).slice(0,3).toLowerCase()];
  if((m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s*-\s*(\d{1,2})\/(\d{1,2})\/(\d{4}))?/)))return [new Date(+m[3],m[2]-1,+m[1]),m[4]?new Date(+m[6],m[5]-1,+m[4]):new Date(+m[3],m[2]-1,+m[1])];
  if((m=t.match(/^(\d{1,2})\s*([a-z]{3,})\s*(\d{4})?\s*-\s*(\d{1,2})\s*([a-z]{3,})\s*(\d{4})/i))&&mon(m[2])!=null&&mon(m[5])!=null)return [new Date(+(m[3]||m[6]),mon(m[2]),+m[1]),new Date(+m[6],mon(m[5]),+m[4])];
  if((m=t.match(/^(\d{1,2})\s*-\s*(\d{1,2})\s+([a-z]{3,})\s+(\d{4})/i))&&mon(m[3])!=null)return [new Date(+m[4],mon(m[3]),+m[1]),new Date(+m[4],mon(m[3]),+m[2])];
  if((m=t.match(/^(\d{1,2})\s+([a-z]{3,})\s+(\d{4})/i))&&mon(m[2])!=null){const d=new Date(+m[3],mon(m[2]),+m[1]);return [d,d]}
  return null;
}
const normName=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function matchProduct(name){const n=normName(name);if(!n)return null;return db.products.find(p=>normName(p.name)===n)||db.products.find(p=>normName(p.name).startsWith(n)||n.startsWith(normName(p.name)))||null}
function methodOf(label){const l=label.toLowerCase();if(/tunai|cash|kontan/.test(l))return 'cash';if(/qris|qr/.test(l))return 'qris';if(/debit|kartu|edc|kredit/.test(l))return 'debit';if(/transfer|tf|bank|non tunai|web|online|gofood|grab|shopee/.test(l))return 'transfer';return null}
function parseRecapText(txt){
  const r={range:null,items:[],pay:{},kasAwal:0,kasKeluar:0,kasMasuk:0,aktual:null,unknown:[]};let sec='';
  String(txt||'').split(/\r?\n/).map(l=>l.replace(/\*/g,'').trim()).forEach(l=>{
    if(!l)return;const low=l.toLowerCase();
    if(/^tanggal/.test(low)){r.range=parseRangeTxt(l.split(':').slice(1).join(':'));return}
    if(/^total produk/.test(low)){sec='';return}
    if(/^produk/.test(low)){sec='produk';return}
    if(/penerimaan sistem/.test(low)){sec='sistem';return}
    if(/penerimaan aktual/.test(low)){sec='aktual';return}
    if(/arus kas\s*:?\s*$/.test(low)&&/detail/.test(low)){sec='kas';return}
    if(/^total\b/.test(low))return;
    const kv=l.match(/^(.+?)\s*:\s*(.*)$/);
    if(sec==='produk'){const m=l.match(/^(\d+)\s*(?:x\s*)?(.+)$/i);if(m){r.items.push({qty:+m[1],name:m[2].trim()});return}}
    if(!kv)return;const key=kv[1].toLowerCase(),val=moneyNum(kv[2]);
    if(sec==='sistem'){if(/arus kas/.test(key))return;const me=methodOf(key);if(me)r.pay[me]=(r.pay[me]||0)+val;else if(val)r.unknown.push(kv[1])}
    else if(sec==='aktual'){if(methodOf(key)==='cash'&&!/non/.test(key))r.aktual=val}
    else if(sec==='kas'){if(/awal/.test(key))r.kasAwal=val;else if(/keluar/.test(key))r.kasKeluar=val;else if(/masuk/.test(key))r.kasMasuk=val}
  });
  return r;
}

/* status bahan berdasarkan sisa cup: stok ÷ takaran per cup (rata-rata penjualan 7 hari, cadangan: takaran terbesar di resep/pilihan) */
let CUPC=null;
function cupMap(){
  const key=db.sales.length+'|'+db.ingredients.length+'|'+db.products.length+'|'+JSON.stringify([db.settings.sajian,db.settings.addons,db.settings.sticker]).length;
  if(CUPC&&CUPC.key===key&&Date.now()-CUPC.t<60000)return CUPC.m;
  const mx={},sum={},por={},put=(o,id,v)=>{if(id&&v>0)o[id]=Math.max(o[id]||0,v)};
  db.products.forEach(p=>{if(modeOf(p)==='recipe')(p.recipe||[]).forEach(r=>put(mx,r.iid,+r.qty));(Array.isArray(p.ukuran)?p.ukuran:[]).forEach(u=>put(mx,u&&u.kemasan,+(u&&u.kq)||1))});
  Object.values((db.settings&&db.settings.sajian)||{}).forEach(c=>((c&&c.rec)||[]).forEach(r=>put(mx,r.iid,+r.qty)));
  (db.settings.addons||[]).forEach(a=>(a.rec||[]).forEach(r=>put(mx,r.iid,+r.qty)));if(db.settings.sticker)put(mx,db.settings.sticker,1);
  const a=Date.now()-7*86400e3;
  db.sales.forEach(s=>{if(s.status!=='paid'||s.ts<a)return;(s.items||[]).forEach(i=>(i.rec||[]).forEach(r=>{if(!(r.qty>0))return;sum[r.iid]=(sum[r.iid]||0)+r.qty*i.qty;por[r.iid]=(por[r.iid]||0)+i.qty}))});
  const m={};Object.keys(mx).concat(Object.keys(sum)).forEach(id=>{m[id]=sum[id]&&por[id]?sum[id]/por[id]:mx[id]});
  CUPC={key,t:Date.now(),m};return m;
}

/* ===== stok tahan-sinkron =====
   Stok bahan & produk = base (hasil hitung/opname terakhir) + perubahan sejak itu.
   Perubahan dicatat sebagai penghitung per perangkat (ctr[dev].p naik / .n turun) yang hanya
   bertambah, sehingga saat dua perangkat berjualan offline lalu bersinkron, potongan keduanya tetap terhitung.
   Field stock tetap ada (angka hasil hitung) agar perangkat versi lama tetap bisa membaca. */
const DEV_KEY='soankofe.pos.devid';
let DEV_ID=null;
const myDev=()=>{if(DEV_ID)return DEV_ID;let v=null;try{v=localStorage.getItem(DEV_KEY)}catch(e){}if(!v){v='d-'+uid();try{localStorage.setItem(DEV_KEY,v)}catch(e){}}return DEV_ID=v};
const r3=v=>Math.round((+v||0)*1000)/1000;
function stkInit(o){if(!o.ctr||typeof o.ctr!=='object'){o.ctr={};o.base=r3(o.stock);o.baseSum=0;o.baseTs=0}}
function stkSum(o){let t=0;for(const k in (o.ctr||{})){const c=o.ctr[k]||{};t+=(+c.p||0)-(+c.n||0)}return t}
function stkCalc(o){return r3((+o.base||0)+stkSum(o)-(+o.baseSum||0))}
function stkAdd(o,d){d=r3(d);if(!o||!d)return;stkInit(o);const k=myDev(),c=o.ctr[k]||(o.ctr[k]={p:0,n:0});if(d>0)c.p=r3(c.p+d);else c.n=r3(c.n-d);o.stock=stkCalc(o)}
function stkSet(o,v){if(!o)return;stkInit(o);o.base=r3(v);o.baseSum=r3(stkSum(o));o.baseTs=Date.now();o.stock=stkCalc(o)}
function stkMerge(loc,rem){
  if(!loc||!rem||typeof rem!=='object')return rem;
  const m=Object.assign({},rem),lc=loc.ctr||{},rc=rem.ctr||{},ctr={};
  new Set(Object.keys(lc).concat(Object.keys(rc))).forEach(k=>{const a=lc[k]||{},b=rc[k]||{};ctr[k]={p:Math.max(+a.p||0,+b.p||0),n:Math.max(+a.n||0,+b.n||0)}});
  /* perangkat versi lama mengubah angka stok langsung: anggap seperti hitung ulang di angka itu */
  const lama=!rem.ctr||Math.abs((+rem.stock||0)-stkCalc(rem))>0.0005;
  if(lama){m.base=r3(rem.stock);m.baseSum=r3(stkSum({ctr:rc}));m.baseTs=Date.now()}
  else if((+loc.baseTs||0)>(+rem.baseTs||0)){m.base=loc.base;m.baseSum=loc.baseSum;m.baseTs=loc.baseTs}
  m.ctr=ctr;m.stock=stkCalc(m);return m;
}

function lineRec(i,type){
  const p=prodById(i.pid),m={},add=(iid,q)=>{if(!iid||!q||!ingById(iid))return;m[iid]=r3((m[iid]||0)+q)};
  const uk=prodUk(p).find(u=>u.id===i.uk),k=uk&&+uk.kali>0?+uk.kali:1;

  if(i.saji)sajiRec(i.saji,type).forEach(r=>pack.push(r));
  pack.forEach(r=>add(r.iid,r.qty));

  return Object.keys(m).filter(iid=>m[iid]>0).map(iid=>({iid,qty:m[iid]}));

/* sisa porsi yang masih bisa dijual; n=null berarti tidak dibatasi */
function avail(p,used,inCart){
  const md=modeOf(p);
  if(md==='stock')return{n:p.stock-(inCart||0),lim:null};
  if(md==='recipe'){
    let n=Infinity,lim=null;
    p.recipe.forEach(r=>{const g=ingById(r.iid);if(!g||!(r.qty>0)||g.belumCek)return;const k=Math.floor((g.stock-(used[r.iid]||0))/r.qty+1e-9);if(k<n){n=k;lim=g}});
    return{n:n===Infinity?null:Math.max(0,n),lim};
  }
  return{n:null,lim:null};
}
function canAdd(p){
  if(!db.settings.blockOut)return null;
  const a=avail(p,cartUsage(S.pos.cart),cartQty(p.id));
  if(a.n===null||a.n>=1)return null;
  return a.lim?'Bahan '+a.lim.name+' tidak cukup':'Stok '+p.name+' tidak cukup';
}
function itemRec(i){
  if(i.rec)return i.rec;
  const p=prodById(i.pid);
  return p&&modeOf(p)==='recipe'?p.recipe:[];
}
function usageInRange(a,b){
  const m={};
  db.sales.forEach(s=>{if(s.status!=='paid'||s.ts<a||s.ts>=b)return;s.items.forEach(i=>itemRec(i).forEach(r=>{m[r.iid]=(m[r.iid]||0)+r.qty*i.qty}));(s.tambah||[]).concat(s.trx||[]).forEach(r=>{m[r.iid]=(m[r.iid]||0)+r.qty})});
  return m;
}
function dailyUse(){const t0=sod(Date.now()),u=usageInRange(addDays(t0,-7),t0);Object.keys(u).forEach(k=>{u[k]/=7});return u}
function usedInMap(){const m={};db.products.forEach(p=>{if(modeOf(p)==='recipe')p.recipe.forEach(r=>{(m[r.iid]||(m[r.iid]=[])).push(p.name)})});return m}
function coverTxt(g,rate){const r=rate[g.id]||0;if(g.stock<=0)return 'habis';if(!r)return '—';const d=g.stock/r;return d<1?'< 1 hari':d>=30?'30+ hari':Math.floor(d)+' hari'}
const newAvgCost=(g,q,c)=>g.stock>0&&q>0?Math.round((g.stock*g.cost+q*c)/(g.stock+q)*100)/100:c;

function productRows(){
  const q=S.pq.trim().toLowerCase();
  const st=S.pst||'all';
  return db.products.filter(p=>(S.pc==='all'||p.cat===S.pc)&&(st==='all'||(st==='on'&&p.active)||(st==='off'&&!p.active)||(st==='out'&&(()=>{const a=avail(p,{},0);return a.n!==null&&a.n<=0})()))&&(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)));
}

  const list=productRows();
  if(!list.length)return empty('Menu tidak ditemukan','Ubah kata kunci atau tambah menu baru.')+thfReset('pf-reset',S.pc!=='all'||(S.pst||'all')!=='all');
  const rows=list.map(p=>{
    const md=modeOf(p),a=avail(p,{},0),mg=menuMargin(p);
    const src=md==='recipe'?'<span class="pill amber">Resep · '+p.recipe.length+' bahan</span>':md==='stock'?'<span class="pill">Stok produk</span>':'<span class="pill">Manual</span>';
    const sub=a.lim?'<div class="sub">'+esc(a.lim.name)+'</div>':'';
    let av;
    if(a.n===null)av='<span class="muted">—</span>';
    else if(a.n<=0)av='<span class="pill bad">Habis</span>'+sub;
    else if(md==='stock'?a.n<=p.min:a.n<=5)av='<span class="pill warn">'+a.n+'</span>'+sub;
    else av='<span class="num">'+a.n+'</span>';
    return '<tr data-act="prod-edit" data-id="'+p.id+'"><td><b>'+esc(p.name)+'</b><div class="sub">'+esc(p.sku)+(prodUk(p).length?' · '+prodUk(p).map(u=>esc(u.label)).join(' / '):'')+(prodSaji(p).length?' · '+prodSaji(p).map(sajiLabel).map(esc).join(' / '):'')+'</div></td><td>'+esc(catName(p.cat))+'</td><td class="hpp">'+src+'</td><td class="r">'+rp(p.price)+'</td><td class="r hpp">'+rp(unitCost(p))+'</td><td class="r hpp"><span class="pill '+(mg<40?'warn':'ok')+'">'+mg+'%</span></td><td>'+av+'</td><td>'+(p.active?'<span class="pill ok">Aktif</span>':'<span class="pill">Nonaktif</span>')+'</td></tr>';

function rcLive(){
  const h=$('#rc-hpp');if(!h)return;
  let hpp=0,mk=Infinity;
  S.rd.rows.forEach(r=>{const g=ingById(r.iid),q=dec(r.qty);if(g&&q>0){hpp+=g.cost*q;mk=Math.min(mk,Math.floor(g.stock/q+1e-9))}});
  hpp=Math.round(hpp);
  const pe=$('#pf-price'),price=pe?dec(pe.value):0;
  h.textContent=rp(hpp);
  $('#rc-mg').textContent=price>0&&hpp>0?Math.round((price-hpp)/price*100)+'%':'—';
  $('#rc-mk').textContent=mk===Infinity?'—':Math.max(0,mk)+' porsi';
}

function prodSave(id){
  const name=$('#pf-name').value.trim(),price=num($('#pf-price').value),mode=S.pfMode;
  if(!name){toast('Nama menu wajib diisi');return}
  if(price<=0){toast('Harga jual harus lebih dari 0');return}
  let recipe=[];
  if(mode==='recipe'){
    const m={};
    S.rd.rows.forEach(r=>{const q=dec(r.qty);if(r.iid&&q>0&&ingById(r.iid))m[r.iid]=Math.round(((m[r.iid]||0)+q)*10000)/10000});
    recipe=Object.keys(m).map(k=>({iid:k,qty:m[k]}));
    if(!recipe.length){toast('Tambahkan minimal satu bahan beserta takarannya');return}
  }
  const ukuran=S.pfx.uk.map(u=>({id:u.id,label:String(u.label||'').trim().slice(0,20),price:num(u.price),kali:dec(u.kali)>0?dec(u.kali):1,kemasan:u.kemasan&&ingById(u.kemasan)?u.kemasan:'',kq:1})).filter(u=>u.label);
  if(ukuran.some(u=>!(u.price>0))){toast('Isi harga untuk setiap ukuran');return}
  const o={ukuran,addons:$$('[data-pfad]').filter(c=>c.checked).map(c=>c.dataset.pfad),sticker:!!($('#pf-stiker')||{}).checked,sajian:SAJI_KEYS.filter(k=>{const c=$('[data-pfsaji="'+k+'"]');return c&&c.checked}),name,cat:$('#pf-cat').value,price,min:Math.max(0,num($('#pf-min').value)),active:$('#pf-active').checked,mode,recipe,track:mode==='stock'};
  o.cost=mode==='recipe'?recipeCost(recipe,db.ingredients):Math.max(0,num($('#pf-cost').value));
  let sku=$('#pf-sku').value.trim();
  if(id){const p=prodById(id);if(!sku)sku=p.sku;Object.assign(p,o,{sku})}
  else{
    if(!sku)sku='SKU-'+String(db.products.length+1).padStart(3,'0');
    const stock=mode==='stock'?Math.max(0,num($('#pf-stock').value)):0;
    const p=Object.assign({id:'p-'+uid(),sku,stock},o);db.products.push(p);
    if(mode==='stock'&&stock)logStock(p.id,'restock',stock,'Stok awal');
  }
  save();closeModal();render();toast('Menu disimpan');
}

/* ubah satuan dasar: jumlah dikali f (mis. kotak → ml: f=946) di stok, resep, pilihan menu, invoice, dan riwayat */
function ingConvert(g,f){
  const id=g.id,mul=v=>r3((+v||0)*f);
  stkInit(g);g.base=mul(g.base);g.baseSum=mul(g.baseSum);Object.values(g.ctr).forEach(c=>{c.p=mul(c.p);c.n=mul(c.n)});g.stock=stkCalc(g);
  g.min=mul(g.min);g.cost=Math.round((+g.cost||0)/f*10000)/10000;
  const recs=a=>(a||[]).forEach(r=>{if(r&&r.iid===id)r.qty=mul(r.qty)});
  db.products.forEach(p=>{recs(p.recipe);(p.ukuran||[]).forEach(u=>recs(u.rec))});
  const sj=db.settings.sajian||{};Object.values(sj).forEach(c=>recs(c&&c.rec));
  (db.settings.addons||[]).forEach(a=>{recs(a.rec)});
  (db.invoices||[]).forEach(v=>{if(v.iid===id){v.qty=mul(v.qty)}});
  db.sales.forEach(s=>(s.items||[]).forEach(i=>recs(i.rec)));
  (db.sales||[]).forEach(s=>recs(s.tambah));
  db.ingLog.forEach(l=>{if(l.iid===id){l.qty=mul(l.qty);if(l.unitCost!=null)l.unitCost=Math.round(l.unitCost/f*10000)/10000}});
}

  if(cost<0||($('#if-cost').value.trim()!==''&&isNaN(cost))){toast('HPP per satuan tidak valid');return}
  const o={name,kat:($('#if-kat')||{}).value||'',unit:$('#if-unit').value,supplier:$('#if-sup').value.trim(),cost,min:Math.max(0,dec($('#if-min').value)),active:$('#if-active').checked};

  if(ku&&ku===o.unit){toast('Satuan kemasan harus berbeda dari satuan dasar');return}
  o.kemasan=ku?{unit:ku,isi:ki}:null;{const mc=num(($('#if-mc')||{}).value);o.minCup=mc>0?mc:0}o.tawar=!!($('#if-tawar')||{}).checked;o.stiker=!!($('#if-stiker')||{}).checked;

function ingAdjSave(id){
  const g=ingById(id),t=$('#ia-type').value,raw=$('#ia-qty').value;
  if(!g)return;
  if(raw.trim()===''||dec(raw)<0){toast('Isi jumlah dengan angka');return}
  const q=dec(raw)*kmF('ia-u',g);
  const d=t==='waste'?-Math.min(q,Math.max(0,g.stock)):q-g.stock;
  if(Math.abs(d)<1e-9){toast('Tidak ada perubahan stok');return}
  if(t==='opname')stkSet(g,q);else stkAdd(g,d);logIng(id,t,d,$('#ia-note').value.trim());
  save();closeModal();render();toast('Stok bahan diperbarui');
}

const UNIT_MAP={gr:'gr',g:'gr',gram:'gr',kg:'kg',ml:'ml',l:'L',liter:'L',ltr:'L',botol:'botol',btl:'botol',kotak:'kotak',klg:'kaleng',kaleng:'kaleng',box:'box',pack:'pack',pak:'pack',roll:'roll',lbr:'lembar',lembar:'lembar',cup:'cup',pcs:'pcs',bag:'bag',galon:'galon',buah:'pcs',bks:'pack'};

function parseBahan(t){
  const out=[];String(t||'').split(/\r?\n/).forEach(l=>{
    l=l.trim();if(!l)return;const m=l.match(/^(?:\d+\s*[.)\-]\s*)?(.+?)\s*[:=]\s*(.*)$/);if(!m)return;
    let name=m[1].replace(/\s+/g,' ').trim(),rest=m[2].replace(/\*[^*]*\*/g,' ').trim();if(!name)return;
    const q=rest.match(/^([\d.,]+)\s*\+?/);let qty=null;if(q){const raw=q[1];qty=/^\d{1,3}(\.\d{3})+$/.test(raw)?+raw.replace(/\./g,''):+raw.replace(/\./g,'').replace(',','.');rest=rest.slice(q[0].length).trim()}
    const u=(rest.split(/\s+/)[0]||'').toLowerCase().replace(/[^a-z]/g,''),unit=UNIT_MAP[u]||(u?u.slice(0,10):'pcs');
    out.push({name:name.slice(0,60),qty,unit,kat:guessCat(name,ingCats()),ada:db.ingredients.find(g=>g.name.toLowerCase()===name.toLowerCase())||null});
  });return out;
}

const UCONV={kg:['gr',1000],L:['ml',1000],g:['gr',1],gr:['gr',1]};
function opMatch(name){const n=normName(name),n2=normName(String(name).replace(/\(.*?\)/g,''));return db.ingredients.find(g=>normName(g.name)===n)||db.ingredients.find(g=>{const a=normName(String(g.name).replace(/\(.*?\)/g,''));return a&&(a===n2||a===n)})||db.ingredients.find(g=>{const a=normName(g.name);return a.length>=4&&n.length>=4&&(a.startsWith(n)||n.startsWith(a))})||null}
function opRows(t){return parseBahan(t).map(r=>{const g=opMatch(r.name);if(!g)return Object.assign(r,{g:null});const q=r.qty==null?0:r.qty;let base=q,info='',warn='';
  if(kmOk(g)&&r.unit===g.kemasan.unit){base=q*g.kemasan.isi;info=fq(q)+' '+g.kemasan.unit+' = '+fq(base)+' '+g.unit}
  else if(r.unit===g.unit||(UCONV[r.unit]&&UCONV[r.unit][0]===g.unit&&UCONV[r.unit][1]===1)){info=fq(q)+' '+g.unit}
  else if(UCONV[r.unit]&&UCONV[r.unit][0]===g.unit){base=q*UCONV[r.unit][1];info=fq(q)+' '+r.unit+' = '+fq(base)+' '+g.unit}
  else{info=fq(q)+' '+g.unit;warn='satuan daftar "'+r.unit+'" berbeda dengan '+g.unit+(kmOk(g)?' / '+g.kemasan.unit:'')}
  return Object.assign(r,{g,base:r3(base),info,warn,kosong:r.qty==null})})}

function opnameLines(){
  const L=[],now=Date.now();let n=0;
  L.push({t:'STOK OPNAME '+String(db.settings.storeName||'Soan Kofe').toUpperCase(),b:1});L.push({t:waTgl(now)+' · '+fmtTime(now)});
  const grp=ingCats().map(c=>[c.name,db.ingredients.filter(g=>g.active!==false&&ingCat(g)===c.id)]).concat([['Tanpa kategori',db.ingredients.filter(g=>g.active!==false&&!ingCat(g))]]);
  grp.forEach(([name,list])=>{if(!list.length)return;L.push({t:''});L.push({t:name,b:1});
    list.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(g=>{n++;const st=ingState(g),mk=g.belumCek?' (belum dicek)':st==='bad'?' *HABIS*':st==='warn'?' *HAMPIR HABIS*':'';L.push({t:n+'. '+g.name+' : '+opQty(g)+mk,mark:!!mk})})});
  const ps=db.products.filter(p=>p.active&&modeOf(p)==='stock');if(ps.length){L.push({t:''});L.push({t:'Produk jadi',b:1});ps.forEach(p=>{n++;L.push({t:n+'. '+p.name+' : '+Math.max(0,p.stock)+' pcs'+(p.stock<=0?' *HABIS*':p.stock<=(p.min||0)?' *HAMPIR HABIS*':'')})})}
  return L;
}

const PR_KEY='soankofe.pos.printer',PR_ID='soankofe.pos.printer.id';
const PR={dev:null,ch:null,name:'',chunk:100};
const BLE_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000fff0-0000-1000-8000-00805f9b34fb','0000af30-0000-1000-8000-00805f9b34fb'];
function printerCfg(){
  let c={};try{c=JSON.parse(lsGet(PR_KEY)||'{}')}catch(e){}
  return Object.assign({mode:'off',paper:58,auto:true,copies:1,cut:false,feed:4},c);
}
function setPrinterCfg(p){lsSet(PR_KEY,JSON.stringify(Object.assign(printerCfg(),p)))}
const hasBT=()=>typeof navigator!=='undefined'&&!!navigator.bluetooth;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const asc=t=>String(t==null?'':t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[   ]/g,' ').replace(/[·•]/g,'-').replace(/[−–—]/g,'-').replace(/×/g,'x').replace(/…/g,'...').replace(/[^\x20-\x7e]/g,'?');
function wrapTxt(t,w){
  const out=[];let cur='';
  asc(t).split(' ').forEach(word=>{
    while(word.length>w){if(cur){out.push(cur);cur=''}out.push(word.slice(0,w));word=word.slice(w)}
    if(!cur)cur=word;else if((cur+' '+word).length<=w)cur+=' '+word;else{out.push(cur);cur=word}
  });
  if(cur||!out.length)out.push(cur);
  return out;
}
/* susunan struk: daftar baris {t,a:'l'|'c',b:tebal,sz:2=ganda} */
function receiptLayout(s,cols){
  const st=db.settings,u=userById(s.userId),cu=s.customerId?custById(s.customerId):null,out=[],SEP='-'.repeat(cols);
  const C=(t,o)=>out.push(Object.assign({t:asc(t),a:'c'},o||{}));
  const W=(t,o,ind)=>wrapTxt(t,cols-(ind||0)).forEach(x=>out.push(Object.assign({t:' '.repeat(ind||0)+x,a:'l'},o||{})));
  const LR=(a,b,o)=>{a=asc(a);b=asc(b);let t;const gap=cols-a.length-b.length;t=gap>=1?a+' '.repeat(gap)+b:a.slice(0,Math.max(0,cols-b.length-1))+' '+b;out.push(Object.assign({t:t,a:'l'},o||{}))};
  const n=v=>Math.round(v).toLocaleString('id-ID');
  const name=asc(st.storeName);
  if(name.length<=Math.floor(cols/2))C(name,{b:1,sz:2});else C(name,{b:1});
  if(st.tagline)C(st.tagline);
  wrapTxt(st.address,cols).forEach(x=>C(x));
  C('Telp '+st.phone);
  out.push({t:SEP,a:'l'});
  LR('No',s.no);LR('Tanggal',fmtDT(s.ts));LR('Kasir',u?u.name:'-');
  LR('Jenis',TYPES[s.type]+(s.table?' / Meja '+s.table:''));
  if(cu)LR('Pelanggan',cu.name);
  out.push({t:SEP,a:'l'});
  s.items.forEach(i=>{W(i.name);LR('  '+i.qty+' x '+n(i.price),n(i.price*i.qty));if(i.note)W('* '+i.note,null,2)});
  out.push({t:SEP,a:'l'});
  LR('Subtotal',n(s.subtotal));
  if(s.discount)LR('Diskon','-'+n(s.discount));
  if(s.service)LR('Layanan '+s.serviceRate+'%',n(s.service));
  if(s.tax)LR('PPN '+s.taxRate+'%',n(s.tax));
  LR('TOTAL','Rp '+n(s.total),{b:1});
  out.push({t:SEP,a:'l'});
  LR('Bayar ('+METHODS[s.method]+')','Rp '+n(s.paid));
  if(s.method==='cash')LR('Kembali','Rp '+n(s.change));
  if(s.points)LR('Poin didapat','+'+s.points);
  if(s.status==='void')C('*** DIBATALKAN ***',{b:1});
  out.push({t:SEP,a:'l'});
  wrapTxt(st.footer,cols).forEach(x=>C(x));
  return out;
}
const plainText=(lines,cols)=>lines.map(l=>{
  if(l.sz===2)return ' '.repeat(Math.max(0,Math.floor((cols-l.t.length*2)/2)))+l.t+' (besar)';
  return l.a==='c'?' '.repeat(Math.max(0,Math.floor((cols-l.t.length)/2)))+l.t:l.t;
}).join('\n');
function encodeEscpos(lines,cfg){
  const b=[0x1b,0x40];
  lines.forEach(l=>{
    b.push(0x1b,0x61,l.a==='c'?1:0,0x1b,0x45,l.b?1:0,0x1d,0x21,l.sz===2?0x11:0);
    for(let i=0;i<l.t.length;i++)b.push(l.t.charCodeAt(i));
    b.push(0x0a);
  });
  b.push(0x1b,0x61,0,0x1b,0x45,0,0x1d,0x21,0,0x1b,0x64,Math.max(0,Math.min(9,cfg.feed||0)));
  if(cfg.cut)b.push(0x1d,0x56,0x42,0x00);
  return Uint8Array.from(b);
}

/* ---- pengiriman ---- */
function toB64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
function rawbtSend(bytes){
  const a=document.createElement('a');
  a.href='rawbt:base64,'+toB64(bytes);
  document.body.appendChild(a);a.click();a.remove();
}
function sysPrint(lines,cfg){
  const cols=cfg.paper===80?48:32,el=$('#print-area');
  el.textContent=plainText(lines,cols).replace(/ \(besar\)/g,'');
  el.style.width=(cfg.paper===80?'72mm':'48mm');
  window.print();
}
async function bleConnect(pick){
  if(!hasBT())throw Object.assign(new Error('Halaman ini tidak mendukung Web Bluetooth. Buka versi mandiri di Chrome Android atau pakai mode RawBT.'),{name:'NoBT'});
  let dev=PR.dev;
  if(!dev&&!pick&&navigator.bluetooth.getDevices){
    try{const ds=await navigator.bluetooth.getDevices(),id=lsGet(PR_ID);dev=ds.find(d=>d.id===id)||null}catch(e){dev=null}
  }
  if(!dev){
    if(!pick)throw Object.assign(new Error('Printer belum terhubung. Ketuk ikon printer di bagian atas untuk memilih printer.'),{name:'NoDevice'});
    dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SERVICES});
  }
  if(PR.dev!==dev){PR.dev=dev;lsSet(PR_ID,dev.id||'');dev.addEventListener('gattserverdisconnected',()=>{PR.ch=null;if(S.view==='settings')render()})}
  const srv=dev.gatt.connected?dev.gatt:await dev.gatt.connect();
  const services=await srv.getPrimaryServices();
  for(const s of services){
    const cs=await s.getCharacteristics();
    for(const c of cs){if(c.properties.writeWithoutResponse||c.properties.write){PR.ch=c;PR.name=dev.name||'Printer';return}}
  }
  throw Object.assign(new Error('Printer tidak punya jalur tulis BLE. Printer ini kemungkinan Bluetooth klasik, pakai mode RawBT.'),{name:'NoChar'});
}
async function bleWrite(bytes){
  const ch=PR.ch;if(!ch)throw Object.assign(new Error('Printer belum terhubung.'),{name:'NoDevice'});
  const noResp=!!ch.properties.writeWithoutResponse;
  const send=p=>noResp?ch.writeValueWithoutResponse(p):ch.writeValue(p);
  let i=0,retried=false;
  while(i<bytes.length){
    const part=bytes.slice(i,i+PR.chunk);
    try{await send(part);i+=part.length;await sleep(20)}
    catch(e){if(!retried&&PR.chunk>20){retried=true;PR.chunk=20;await sleep(100)}else throw e}
  }
}
function printErr(e){
  const n=e&&e.name;
  if(n==='NotFoundError')return 'Pemilihan printer dibatalkan';
  if(n==='SecurityError'||n==='NotAllowedError')return 'Bluetooth diblokir di halaman ini. Buka versi mandiri lewat Chrome.';
  if(n==='NetworkError')return 'Koneksi ke printer terputus. Nyalakan printer lalu coba lagi.';
  return (e&&e.message)||'Gagal mencetak';
}
async function doPrint(s,manual){
  const cfg=printerCfg();
  if(cfg.mode==='off'){if(manual)toast('Aktifkan printer di Pengaturan');return false}
  const lines=receiptLayout(s,cfg.paper===80?48:32);
  try{
    if(cfg.mode==='system'){sysPrint(lines,cfg);return true}
    const one=encodeEscpos(lines,cfg);let bytes=one;
    if(cfg.copies>1){bytes=new Uint8Array(one.length*cfg.copies);for(let k=0;k<cfg.copies;k++)bytes.set(one,k*one.length)}
    if(cfg.mode==='rawbt'){rawbtSend(bytes);return true}
    if(!PR.ch)await bleConnect(false);
    await bleWrite(bytes);toast('Struk dicetak');return true;
  }catch(e){toast(printErr(e));return false}
}
function autoPrint(s){const c=printerCfg();if(c.mode!=='off'&&c.auto)doPrint(s,false)}
function printerBtn(){
  const c=printerCfg();if(c.mode==='off'||c.mode==='system')return '';
  const on=c.mode==='rawbt'||!!PR.ch;
  return '<button class="icon-btn" data-act="pr-top" aria-label="Printer struk" title="'+(c.mode==='ble'?(PR.ch?'Terhubung: '+esc(PR.name):'Hubungkan printer'):'Printer RawBT')+'" style="'+(on?'border-color:var(--ok);color:var(--ok)':'border-color:var(--amber)')+'">'+ico('receipt')+'</button>';
}

function addLine(p,saji,ukId,ad){
  ad=adSort(ad);const key=JSON.stringify([ukId||null,saji||null,ad]);
  const line=S.pos.cart.find(i=>i.pid===p.id&&!i.note&&JSON.stringify([i.uk||null,i.saji||null,adSort(i.ad)])===key);
  if(line)line.qty++;else{const l={pid:p.id,name:lineName(p,ukId,saji,ad),price:linePrice(p,ukId,ad),cost:unitCost(p),qty:1,note:''};if(saji)l.saji=saji;if(ukId){l.uk=ukId;l.ukl=(prodUk(p).find(u=>u.id===ukId)||{}).label}if(ad.length)l.ad=ad;if(saji||ukId||ad.length)l.base=p.name;S.pos.cart.push(l)}
  updatePOS();
}
