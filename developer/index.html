<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151412">
<title>Soan Panel Developer</title>
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<style>
:root{
  --bg:#F3EEE6;--surface:#fff;--surface-2:#FAF6EF;--ink:#151412;--muted:#6B645B;--line:#E4DACB;--line-2:#CFC4B3;
  --amber:#F2A31B;--amber-soft:#FCEBC8;--ok:#2C7A4B;--ok-soft:#DCEFE2;--bad:#B3361F;--bad-soft:#F8DCD5;--warn:#A85F08;--warn-soft:#FBE6CC;
  --side:#151412;--side-fg:#F6EFE6;--side-muted:#9A9186;--side-line:#2A2724;--r:14px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);
}
@media (prefers-color-scheme:dark){:root{--bg:#121110;--surface:#1C1A17;--surface-2:#242119;--ink:#F6EFE6;--muted:#A39A8E;--line:#33302A;--line-2:#4A453C;--amber-soft:#3B2D12;--ok:#6CCB92;--ok-soft:#1B3325;--bad:#F08A76;--bad-soft:#3B1E18;--warn:#F0A94E;--warn-soft:#3A2A12;--side:#0B0A09;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(0,1.05fr);height:100vh;height:100dvh}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}.brand b{font-size:17px;letter-spacing:-.01em}.brand span{display:block;font-size:11px;color:var(--side-muted);letter-spacing:.14em;text-transform:uppercase}
.ring{width:30px;height:30px;flex:none}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-muted);padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left}
.nav-i:hover{color:var(--side-fg);background:var(--side-line)}.nav-i.on{background:var(--amber);color:#151412;font-weight:600}
.nav-i .n{margin-left:auto;font-size:11px;background:var(--side-line);color:var(--side-fg);border-radius:20px;padding:1px 7px}.nav-i.on .n{background:#15141222;color:#151412}
.nav-grp{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.nav-gt{display:flex;align-items:center;justify-content:space-between;border:0;background:none;color:var(--side-muted);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px 4px;cursor:pointer;text-align:left}
.nav-gt:hover{color:var(--side-fg)}.nav-gt .car{font-size:10px}
.nav-items{display:flex;flex-direction:column;gap:2px}
.nav-i.dim .t{opacity:.55;text-decoration:line-through}
.nav-i .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--side-line);font-size:12px;color:var(--side-muted)}
.side-foot b{color:var(--side-fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--side-muted);margin-right:6px}.dot.ok{background:#6CCB92}.dot.bad{background:#F08A76}
.main{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:18px;margin:0;letter-spacing:-.01em}.top .sub{font-size:12px;color:var(--muted)}
.top .sp{flex:1}
.ed{flex:1;overflow:auto;padding:20px 20px 120px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:15px}.card>p.muted{margin:0 0 12px}
.muted{color:var(--muted)}.sm{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#151412}.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:5px 11px;font-size:12px}.btn.icon{width:32px;height:32px;padding:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--line)}
.badge.amber{background:var(--amber-soft);border-color:transparent}.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%;min-width:0}.in:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
/* drag & drop */
.zones{display:grid;grid-template-columns:1fr;gap:12px}
.zone{border:1.5px dashed var(--line-2);border-radius:12px;padding:8px;min-height:58px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.zone.on{border-color:var(--ok)}.zone.off{opacity:.92}
.zone-h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 4px}
.zone-h .cnt{margin-left:auto}
.zone .empty{font-size:12px;color:var(--muted);text-align:center;padding:10px}
.zone.drop{border-color:var(--amber);background:var(--amber-soft)}
.it{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;touch-action:auto}
.it.ph{opacity:.35;border-style:dashed}
.handle{width:30px;height:34px;flex:none;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:grab;border-radius:8px;touch-action:none;font-size:18px;line-height:1}
.handle:hover{background:var(--surface-2);color:var(--ink)}
.it .name{flex:1;min-width:0}.it .name small{display:block;font-size:11px;color:var(--muted)}
.it .in{padding:6px 9px;border-radius:8px}
.it .acts{display:flex;gap:4px;flex:none}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.tg input{appearance:none;width:32px;height:19px;border-radius:20px;background:var(--line-2);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.tg input::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s}
.tg input:checked{background:var(--ok)}.tg input:checked::after{transform:translateX(13px)}.tg input:disabled{opacity:.5;cursor:not-allowed}
.lock{font-size:11px;color:var(--muted);white-space:nowrap}
.it.tn{display:block;padding:6px 8px}
.it-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px}
.it-row .name{flex:1 1 170px}
.it-row .acts{margin-left:auto}
.it-sub{margin:6px 0 2px 30px}
.it-sub>.zone{min-height:46px;background:var(--surface)}
.kind{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 6px;white-space:nowrap}
.kind.grup{background:#E3ECF9;color:#2557A7}.kind.halaman{background:var(--ok-soft);color:var(--ok)}.kind.tautan{background:var(--amber-soft);color:var(--warn)}
.tn-ico{width:20px;text-align:center;color:var(--muted);flex:none}
.adds{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pg-ed{margin:8px 0 2px 30px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.pg-ed .zone{background:var(--surface)}
.blk{display:grid;grid-template-columns:auto 130px minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}
.blk textarea{resize:vertical;min-height:38px}
.blk .urlin{grid-column:3/4}
.warn-t{font-size:12px;color:var(--bad);margin-top:4px}
.zoom{display:flex;align-items:center;gap:6px}
.zoom input[type=range]{width:110px;accent-color:var(--amber)}
.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 14px 30px #0003;transform:rotate(-1deg);opacity:.96}
/* warna */
.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.color{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.color input[type=color]{width:42px;height:42px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.color .in{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.presets{display:flex;gap:8px;flex-wrap:wrap}.preset{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:5px 12px 5px 6px;background:var(--surface);cursor:pointer;font-size:13px}
.preset i{width:22px;height:22px;border-radius:50%;display:block;border:3px solid}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}.seg button.on{background:var(--ink);color:var(--surface)}
/* berkas */
.drop-files{border:1.5px dashed var(--line-2);border-radius:12px;padding:22px;text-align:center;background:var(--surface-2);cursor:pointer}
.drop-files.drop{border-color:var(--amber);background:var(--amber-soft)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
/* pratinjau */
.pv{display:flex;flex-direction:column;min-width:0;background:var(--surface-2)}
.pv-top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.pv-stage{flex:1;overflow:auto;display:flex;align-items:flex-start;padding:16px}
.pv-stage .frame-wrap{margin:0 auto}
.frame-wrap{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--line-2),0 18px 40px #0002;background:#fff;flex:none}
.frame-wrap iframe{border:0;position:absolute;top:0;left:0;transform-origin:0 0;background:#fff}
.pv-note{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 12px}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--surface);border-radius:18px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 60px #0005}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-h h3{margin:0;font-size:17px;flex:1}
.modal-b{padding:16px 18px;overflow:auto}.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.chg{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.chg li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13px}
.chg li b{white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:13px}.steps div::before{content:"○ ";color:var(--muted)}.steps .done::before{content:"✓ ";color:var(--ok)}.steps .run::before{content:"◌ ";color:var(--amber)}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;z-index:70;max-width:92vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.hist{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.hist:last-child{border-bottom:0}.hist .name{flex:1;min-width:0}
.hist .name b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol.steps-help{margin:6px 0 0;padding-left:18px;font-size:13px}ol.steps-help li{margin:3px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.mtabs{display:none}
/* tablet & HP */
@media (max-width:1180px){.app{grid-template-columns:76px minmax(0,1fr) minmax(0,1fr)}.brand div,.nav-i .t,.side-foot,.nav-gt span:first-child{display:none}.nav-gt{justify-content:center;padding:6px 0;border-top:1px solid var(--side-line)}.nav-grp:first-of-type .nav-gt{border-top:0}.nav-i{justify-content:center;padding:12px}.nav-i .n{position:absolute;margin:0 0 22px 26px}.nav-i{position:relative}.brand{justify-content:center;padding:0 0 12px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;height:100dvh}
  .side{flex-direction:row;padding:8px;gap:4px;overflow-x:auto;grid-row:1}
  .brand{display:none}.nav-grp,.nav-items{flex-direction:row;margin:0;gap:4px}.nav-gt{display:none}.nav-i{flex:none;width:auto;padding:9px 12px}.nav-i .t{display:inline;font-size:13px}.nav-i .n{position:static;margin-left:4px}
  .main,.pv{grid-row:2;border:0;min-height:0}
  .app[data-m="ed"] .pv{display:none}.app[data-m="pv"] .main{display:none}
  .mtabs{display:flex;grid-row:3;border-top:1px solid var(--line);background:var(--surface)}
  .mtabs button{flex:1;border:0;background:none;padding:12px;font-weight:600;color:var(--muted)}.mtabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--amber)}
  .top{padding:12px 14px}.ed{padding:14px 14px 100px}
  .frow{grid-template-columns:1fr}
}
@media (max-width:560px){
  .it-row{flex-wrap:wrap;row-gap:6px}.it-row .name{flex:1 1 calc(100% - 64px)}.it-row .tg{margin-left:38px}.it-row .acts{margin-left:auto}
  .it-sub,.pg-ed{margin-left:12px}
  .blk{grid-template-columns:auto minmax(0,1fr) auto}.blk select{grid-column:2/3}.blk textarea,.blk .urlin{grid-column:1/-1}
  .zoom input[type=range]{width:70px}
  .it{flex-wrap:wrap;row-gap:6px}.it .name{flex:1 1 calc(100% - 40px)}
  .it .tg{margin-left:38px}.it .acts{margin-left:auto}.it .tg+.acts{margin-left:auto}
  .it:not(:has(.tg)) .acts{margin-left:38px}
  .pv-top .seg button{padding:6px 10px}
}
</style>
</head>
<body>
<div class="app" id="app" data-m="ed"></div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
/* ================= Soan Panel Developer =================
   Aplikasi terpisah untuk mengatur tampilan Soan Kofe POS tanpa menulis kode:
   susun komponen dengan drag & drop, lihat pratinjau, lalu Push ke GitHub.
   Perubahan tersimpan di soan-config.json (dibaca POS saat dibuka). File kode dari Claude
   juga bisa diunggah dan di-push dalam satu commit. Token GitHub hanya disimpan di perangkat ini. */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const CFG_PATH='soan-config.json';
const K_CONN='soandev.github',K_DRAFT='soandev.draft',K_UI='soandev.ui';
const ls={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

const MENU={pos:'Kasir',sales:'Transaksi',menu:'Menu & Bahan',reports:'Laporan',customers:'Pelanggan',shift:'Shift',finance:'Keuangan',inventory:'Inventory',settings:'Pengaturan'};
const TYPES={dine:'Dine in',take:'Take away',delivery:'Delivery'};
const METHODS={cash:'Tunai',qris:'QRIS',debit:'Debit',transfer:'Transfer'};
const MTABS={sum:'Ringkasan',menu:'Menu',ing:'Bahan baku',log:'Mutasi stok'};
const RANGES_S=[['today','Hari ini'],['yesterday','Kemarin'],['7d','7 hari'],['all','Semua']],RANGES_R=[['today','Hari ini'],['7d','7 hari'],['14d','14 hari'],['month','Bulan ini']];
const REPORTS={trend:'Grafik penjualan (per jam / per hari)',top:'Produk terlaris',cats:'Penjualan per kategori',gp:'Laba kotor per menu',use:'Pemakaian bahan baku',hours:'Jam ramai',pay:'Metode pembayaran'};
const DEFAULT={versi:1,catatan:'Diatur dari Panel Developer (developer/). Boleh diedit manual; nilai yang tidak valid diabaikan.',
  tema:{aksen:'#F2A31B',aksenGelap:'#F5AE2E',sidebar:'#151412',latar:'#F6EFE6'},
  menu:[{id:'pos',label:'Kasir',tampil:true,kasir:true},{id:'sales',label:'Transaksi',tampil:true,kasir:true},{id:'menu',label:'Menu & Bahan',short:'Menu',tampil:true,kasir:false},{id:'reports',label:'Laporan',tampil:true,kasir:false},{id:'customers',label:'Pelanggan',tampil:true,kasir:true},{id:'shift',label:'Shift',tampil:true,kasir:true},{id:'finance',label:'Keuangan',tampil:true,kasir:false},{id:'inventory',label:'Inventory',tampil:true,kasir:false},{id:'settings',label:'Pengaturan',tampil:true,kasir:false}],
  kasir:{keranjang:'samping',ukuranKartu:'normal',tipePesanan:Object.keys(TYPES).map(id=>({id,label:TYPES[id],tampil:true})),metodeBayar:Object.keys(METHODS).map(id=>({id,label:METHODS[id],tampil:true}))},
  laporan:Object.keys(REPORTS).map(id=>({id,tampil:true})),laporanRentang:'7d',
  transaksi:{filterAwal:'today'},menuBahan:{tab:Object.keys(MTABS).map(id=>({id,tampil:true}))},
  teks:{hashtag:'#monggosoan.',judulLogin:'Login to Access'}};
const PRESETS=[['Soan (asli)','#F2A31B','#F5AE2E','#151412','#F6EFE6'],['Daun','#2F8F5B','#5CC48A','#12261B','#EEF4EE'],['Laut','#2563C9','#6EA2F5','#0F1B2E','#EEF2F8'],['Bata','#C2522D','#F08A66','#24140F','#F7EFE9'],['Anggur','#8B3A8F','#D07FD4','#1E1220','#F5EEF5']];
const SECS=[['koneksi','Koneksi GitHub','⌁'],['menu','Menu navigasi','☰'],['tampilan','Warna & ukuran','◐'],['teks','Teks login','T'],['berkas','Unggah file kode','⇪'],['riwayat','Riwayat versi','↺']];
const PNAV=[['Proyek',['koneksi']],['Tampilan umum',['menu','tampilan','teks']],['Halaman POS',null],['Alat',['berkas','riwayat']]];
const PAGE_ICO={pos:'▦',sales:'▤',menu:'☕',reports:'▥',customers:'☺',shift:'◷',finance:'¤',inventory:'▣',settings:'⚙'};
const SOON={customers:['Kolom yang tampil (telepon, poin, catatan)','Fitur poin aktif/nonaktif'],shift:['Nominal cepat kas awal','Catatan wajib saat tutup shift','Batas selisih kas yang diberi peringatan'],settings:['Kartu yang tampil (Printer, Data, Sinkron)','Urutan kartu'],finance:['Batas uang di Drawer','Kolom jurnal kas yang tampil','Format rekap kas'],sales:['Kolom yang tampil','Izin kasir membatalkan transaksi'],menu:['Informasi di kartu menu (HPP, margin, stok)','Urutan kategori'],pos:[],reports:[],inventory:['Kolom tabel cek stok','Filter bawaan (Semua / Habis / Menipis)']};
const SEC_ALIAS={kasir:'p:pos',laporan:'p:reports'};
function posPages(){const l=[];walkMenu(S.cfg.menu,x=>{if(MENU[x.id]||x.jenis==='halaman')l.push(x)});return l}
function hiddenOf(id){let h=null;const w=(arr,anc)=>arr.forEach(x=>{const hid=anc||x.tampil===false;if(x.id===id)h=hid;if(x.anak)w(x.anak,hid)});w(S.cfg.menu,false);return !!h}
function secInfo(sec){
  if(sec.startsWith('p:')){const r=findNode(sec.slice(2));return r?['Halaman: '+r.x.label,MENU[r.x.id]?PAGE_ICO[r.x.id]:'▧']:['Halaman','▧']}
  const x=SECS.find(z=>z[0]===sec);return x?[x[1],x[2]]:['Panel','•'];
}
const secView=sec=>sec.startsWith('p:')?sec.slice(2):SEC_VIEW[sec];

/* ---------- normalisasi: pastikan semua komponen ada & valid ---------- */
const hexOk=v=>typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v);
function normList(list,ids,mk){
  const out=[],seen=new Set();
  (Array.isArray(list)?list:[]).forEach(x=>{if(x&&ids.includes(x.id)&&!seen.has(x.id)){seen.add(x.id);out.push(mk(x))}});
  ids.forEach(id=>{if(!seen.has(id))out.push(mk({id}))});
  return out;
}
function normalize(c){
  c=c&&typeof c==='object'?c:{};const d=DEFAULT,o=clone(d);
  Object.keys(c).forEach(k=>{if(!(k in o))o[k]=c[k]});
  const tm=c.tema||{};['aksen','aksenGelap','sidebar','latar'].forEach(k=>{if(hexOk(tm[k]))o.tema[k]=tm[k].toUpperCase()});
  o.menu=normMenu(c.menu);
  const k=c.kasir||{};
  o.kasir.ukuranKartu=['kecil','normal','besar'].includes(k.ukuranKartu)?k.ukuranKartu:'normal';
  o.kasir.keranjang=k.keranjang==='samping'?'samping':'popup';
  o.kasir.tipePesanan=normList(k.tipePesanan,Object.keys(TYPES),x=>({id:x.id,label:typeof x.label==='string'&&x.label.trim()?x.label:TYPES[x.id],tampil:x.tampil!==false}));
  o.kasir.metodeBayar=normList(k.metodeBayar,Object.keys(METHODS),x=>({id:x.id,label:typeof x.label==='string'&&x.label.trim()?x.label:METHODS[x.id],tampil:x.tampil!==false}));
  o.laporan=normList(c.laporan,Object.keys(REPORTS),x=>({id:x.id,tampil:x.tampil!==false}));
  o.laporanRentang=RANGES_R.some(r=>r[0]===c.laporanRentang)?c.laporanRentang:'7d';
  o.transaksi={filterAwal:c.transaksi&&RANGES_S.some(r=>r[0]===c.transaksi.filterAwal)?c.transaksi.filterAwal:'today'};
  o.menuBahan={tab:normList(c.menuBahan&&c.menuBahan.tab,Object.keys(MTABS),x=>({id:x.id,tampil:x.tampil!==false}))};
  const t=c.teks||{};o.teks.hashtag=typeof t.hashtag==='string'?t.hashtag:d.teks.hashtag;o.teks.judulLogin=typeof t.judulLogin==='string'?t.judulLogin:d.teks.judulLogin;
  if(typeof c.catatan==='string')o.catatan=c.catatan;
  return o;
}
const cfgText=c=>JSON.stringify(c,null,2)+'\n';

/* ---------- pohon menu (menu → sub menu → sub-sub menu) ---------- */
const BLOK={judul:'Judul',teks:'Paragraf',info:'Kotak info',gambar:'Gambar',tombol:'Tombol tautan',pembatas:'Garis pembatas'};
const KIND={grup:'Grup',halaman:'Halaman',tautan:'Tautan'};
const DM=Object.fromEntries(DEFAULT.menu.map(m=>[m.id,m]));
const urlOk=u=>typeof u==='string'&&/^(https?:\/\/[^\s"'<>]+\.[^\s"'<>]+|files\/[^\s"'<>]+|\.?\/[^\s"'<>]*)$/i.test(u.trim());
function walkMenu(list,fn,parent=null,depth=1){(list||[]).forEach((x,i)=>{fn(x,parent,depth,i,list);if(x.anak)walkMenu(x.anak,fn,x,depth+1)})}
function normMenu(list){
  const seen=new Set(),lbl=(x,d)=>typeof x.label==='string'&&x.label.trim()?x.label:d;
  const walk=(arr,depth)=>{const out=[];(Array.isArray(arr)?arr:[]).forEach(x=>{
    if(!x||typeof x!=='object'||typeof x.id!=='string'||seen.has(x.id))return;
    const tp=depth>1?true:x.tampil!==false;
    if(MENU[x.id]){seen.add(x.id);const b=DM[x.id];const r={id:x.id,label:lbl(x,b.label),tampil:x.id==='pos'||x.id==='settings'?true:tp,kasir:x.id==='pos'?true:x.id==='settings'?false:(x.kasir===undefined?b.kasir:x.kasir!==false)};if(x.short||b.short)r.short=x.short||b.short;out.push(r);return}
    if(x.jenis==='grup'&&/^g-[\w-]{1,40}$/.test(x.id)){seen.add(x.id);const kids=walk(x.anak,depth+1);if(depth>2){out.push(...kids);return}out.push({id:x.id,jenis:'grup',label:lbl(x,'Grup'),tampil:tp,kasir:x.kasir!==false,anak:kids});return}
    if(x.jenis==='halaman'&&/^pg-[\w-]{1,40}$/.test(x.id)){seen.add(x.id);out.push({id:x.id,jenis:'halaman',label:lbl(x,'Halaman'),tampil:tp,kasir:x.kasir!==false,blok:(Array.isArray(x.blok)?x.blok:[]).filter(b=>b&&BLOK[b.t]).map(b=>({t:b.t,isi:String(b.isi||''),url:String(b.url||'')}))});return}
    if(x.jenis==='tautan'&&/^ln-[\w-]{1,40}$/.test(x.id)){seen.add(x.id);out.push({id:x.id,jenis:'tautan',label:lbl(x,'Tautan'),url:typeof x.url==='string'?x.url:'',tampil:tp,kasir:x.kasir!==false})}
  });return out};
  let top=walk(list,1);
  Object.keys(MENU).forEach(id=>{if(seen.has(id))return;const si=top.findIndex(x=>x.id==='settings');if(si>=0)top.splice(si,0,clone(DM[id]));else top.push(clone(DM[id]))});
  const pull=[];
  const ext=arr=>arr.filter(y=>{if(y.id==='pos'||y.id==='settings'){pull.push(Object.assign({},y,{tampil:true}));return false}if(y.anak)y.anak=ext(y.anak);return true});
  top.forEach(x=>{if(x.tampil===false&&x.anak)x.anak=ext(x.anak)});
  top=[...top.filter(x=>x.tampil!==false),...pull,...top.filter(x=>x.tampil===false)];
  return top;
}
const isLockedId=id=>id==='pos'||id==='settings';
const hasLocked=x=>isLockedId(x.id)||(x.anak||[]).some(hasLocked);
const grpH=x=>x.jenis==='grup'?1+Math.max(0,...(x.anak||[]).map(grpH)):0;
const fitsAt=(x,depth)=>{const h=grpH(x);return h===0?depth<=3:depth+h-1<=2};
const newId=p=>p+'-'+Math.random().toString(36).slice(2,8);

function menuChanges(a,b,out){
  const flat=l=>{const m=new Map();walkMenu(l,(x,p)=>{const pm=p?m.get(p.id):null;m.set(x.id,{x,parent:p?p.id:'',hid:!!(pm&&pm.hid)||x.tampil===false})});return m};
  const A=flat(a),B=flat(b),nm=(M,id)=>{const e=M.get(id);return e?'"'+e.x.label+'"':id};
  const kn=x=>MENU[x.id]?'menu':KIND[x.jenis].toLowerCase();
  B.forEach((e,id)=>{const o=A.get(id);
    if(!o){out.push(['Menu','Ditambahkan '+kn(e.x)+' '+nm(B,id)+(e.parent?' di dalam '+nm(B,e.parent):'')+(e.hid?' (disembunyikan)':'')]);return}
    if(o.hid!==e.hid)out.push(['Menu',(e.hid?'Disembunyikan: ':'Ditampilkan: ')+nm(B,id)]);
    else if(!e.hid&&o.parent!==e.parent)out.push(['Menu','Dipindah: '+nm(B,id)+' → '+(e.parent?'ke dalam '+nm(B,e.parent):'menu utama')]);
    if(o.x.label!==e.x.label)out.push(['Menu','Nama "'+o.x.label+'" → "'+e.x.label+'"']);
    if(o.x.kasir!==e.x.kasir&&!e.hid)out.push(['Menu',nm(B,id)+' '+(e.x.kasir?'sekarang terlihat oleh kasir':'hanya untuk pemilik')]);
    if((o.x.url||'')!==(e.x.url||''))out.push(['Menu','Alamat tautan '+nm(B,id)+': '+e.x.url]);
    if(JSON.stringify(o.x.blok||[])!==JSON.stringify(e.x.blok||[]))out.push(['Menu','Isi halaman '+nm(B,id)+' diubah']);
  });
  A.forEach((e,id)=>{if(!B.has(id))out.push(['Menu','Dihapus: '+nm(A,id)])});
  const parents=[''];B.forEach(e=>{if(e.x.jenis==='grup')parents.push(e.x.id)});
  const seq=(M,pid)=>[...M].filter(([,e])=>e.parent===pid&&!e.hid).map(([id])=>id);
  parents.forEach(pid=>{const sbAll=seq(B,pid),sa=seq(A,pid).filter(id=>sbAll.includes(id)),sb=sbAll.filter(id=>sa.includes(id));if(sa.join()!==sb.join())out.push(['Menu','Urutan '+(pid?'di dalam '+nm(B,pid):'menu utama')+': '+sbAll.map(id=>B.get(id).x.label).join(' → ')])});
}
function changes(){
  const a=S.base,b=S.cfg,out=[];
  const lst=(name,la,lb,names,extra)=>{
    const ord=l=>l.filter(x=>x.tampil!==false).map(x=>x.id).join(',');
    if(ord(la)!==ord(lb)){
      const oa=la.filter(x=>x.tampil!==false).map(x=>x.id),ob=lb.filter(x=>x.tampil!==false).map(x=>x.id);
      ob.filter(id=>!oa.includes(id)).forEach(id=>out.push([name,'Ditambahkan: '+names(lb,id)]));
      oa.filter(id=>!ob.includes(id)).forEach(id=>out.push([name,'Disembunyikan: '+names(la,id)]));
      const ca=oa.filter(id=>ob.includes(id)),cb=ob.filter(id=>oa.includes(id));
      if(ca.join()!==cb.join())out.push([name,'Urutan baru: '+cb.map(id=>names(lb,id)).join(' → ')]);
    }
    lb.forEach(x=>{const y=la.find(z=>z.id===x.id);if(!y)return;
      if(x.label!==undefined&&x.label!==y.label)out.push([name,'Nama "'+y.label+'" → "'+x.label+'"']);
      if(extra)extra(x,y);
    });
  };
  const nm=(l,id)=>{const x=l.find(z=>z.id===id);return x&&x.label?x.label:(REPORTS[id]||id)};
  menuChanges(a.menu,b.menu,out);
  lst('Tipe pesanan',a.kasir.tipePesanan,b.kasir.tipePesanan,nm);
  lst('Metode bayar',a.kasir.metodeBayar,b.kasir.metodeBayar,nm);
  lst('Laporan',a.laporan,b.laporan,nm);
  lst('Menu & Bahan',a.menuBahan.tab,b.menuBahan.tab,(l,id)=>MTABS[id]);
  const rn=(L,v)=>(L.find(r=>r[0]===v)||[,v])[1];
  if(a.transaksi.filterAwal!==b.transaksi.filterAwal)out.push(['Transaksi','Filter awal: '+rn(RANGES_S,a.transaksi.filterAwal)+' → '+rn(RANGES_S,b.transaksi.filterAwal)]);
  if(a.laporanRentang!==b.laporanRentang)out.push(['Laporan','Rentang awal: '+rn(RANGES_R,a.laporanRentang)+' → '+rn(RANGES_R,b.laporanRentang)]);
  if(a.kasir.keranjang!==b.kasir.keranjang)out.push(['Kasir','Panel pesanan: '+(b.kasir.keranjang==='popup'?'popup (muncul saat lanjut transaksi)':'selalu tampil di samping')]);
  if(a.kasir.ukuranKartu!==b.kasir.ukuranKartu)out.push(['Kasir','Ukuran kartu produk: '+a.kasir.ukuranKartu+' → '+b.kasir.ukuranKartu]);
  const TN={aksen:'Warna aksen (terang)',aksenGelap:'Warna aksen (gelap)',sidebar:'Warna menu samping',latar:'Warna latar'};
  Object.keys(TN).forEach(k=>{if(a.tema[k]!==b.tema[k])out.push(['Warna',TN[k]+': '+a.tema[k]+' → '+b.tema[k]])});
  if(a.teks.hashtag!==b.teks.hashtag)out.push(['Teks','Tagar login: "'+a.teks.hashtag+'" → "'+b.teks.hashtag+'"']);
  if(a.teks.judulLogin!==b.teks.judulLogin)out.push(['Teks','Judul login: "'+a.teks.judulLogin+'" → "'+b.teks.judulLogin+'"']);
  return out;
}

/* ---------- GitHub API ---------- */
const GH='https://api.github.com';
async function gh(path,opt={}){
  const r=await fetch(GH+path,Object.assign({},opt,{headers:Object.assign({'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Authorization':'Bearer '+S.conn.token},opt.body?{'Content-Type':'application/json'}:{},opt.headers||{})}));
  if(r.status===204)return null;
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&j.message)||('HTTP '+r.status));e.status=r.status;throw e}
  return j;
}
const repoPath=()=>'/repos/'+encodeURIComponent(S.conn.owner)+'/'+encodeURIComponent(S.conn.repo);
function ghErr(e){
  if(e.status===401)return 'Token tidak valid atau kedaluwarsa. Buat token baru.';
  if(e.status===403)return 'Token tidak punya izin. Pastikan izin "Contents: Read and write" untuk repo ini.';
  if(e.status===404)return 'Repo atau branch tidak ditemukan, atau token tidak punya akses ke repo ini.';
  if(e.status===409||e.status===422)return 'Ada perubahan baru di GitHub. Coba Push lagi.';
  if(/fetch|network/i.test(e.message))return 'Tidak bisa terhubung ke GitHub. Periksa internet.';
  return e.message;
}
const b64FromBytes=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const b64FromText=t=>b64FromBytes(new TextEncoder().encode(t));
const textFromB64=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function connect(silent){
  if(!S.conn.token){S.ok=false;if(!silent)toast('Isi token GitHub dulu');render();return}
  S.busy=true;render();
  try{
    const repo=await gh(repoPath());
    S.canPush=!!(repo.permissions&&(repo.permissions.push||repo.permissions.admin));
    try{S.user=(await gh('/user')).login}catch(e){S.user=null}
    const ref=await gh(repoPath()+'/git/ref/heads/'+encodeURIComponent(S.conn.branch));S.headSha=ref.object.sha;
    try{const tr=await gh(repoPath()+'/git/trees/'+S.headSha+'?recursive=1');S.paths=new Set(tr.tree.filter(t=>t.type==='blob').map(t=>t.path))}catch(e){S.paths=new Set()}
    let remote=null;S.remoteSha=null;
    try{const f=await gh(repoPath()+'/contents/'+CFG_PATH+'?ref='+encodeURIComponent(S.conn.branch));S.remoteSha=f.sha;remote=JSON.parse(textFromB64(f.content))}catch(e){if(e.status!==404)throw e}
    const nb=normalize(remote);
    const hadDraft=cfgChanged();
    if(!hadDraft)S.cfg=clone(nb);
    else if(cfgText(nb)!==cfgText(S.base))toast('Konfigurasi di GitHub berubah. Draf Anda dipertahankan; periksa di Review.');
    S.base=nb;S.ok=true;S.history=null;
    if(S.conn.remember)ls.set(K_CONN,S.conn);else ls.set(K_CONN,Object.assign({},S.conn,{token:''}));
    saveDraft();
    if(!silent)toast(S.canPush?'Tersambung ke '+S.conn.owner+'/'+S.conn.repo:'Tersambung, tetapi token tidak punya izin menulis');
  }catch(e){S.ok=false;toast(ghErr(e))}
  S.busy=false;render();sendPreview();
}

/* Satu commit berisi soan-config.json (bila berubah) + semua file yang diunggah. */
async function pushAll(message,onStep){
  const items=[];
  if(cfgChanged())items.push({path:CFG_PATH,b64:b64FromText(cfgText(S.cfg))});
  S.files.forEach(f=>items.push({path:f.path.replace(/^\/+/,''),b64:f.b64}));
  if(!items.length)throw new Error('Tidak ada perubahan');
  onStep(0);
  const blobs=[];
  for(const it of items){const b=await gh(repoPath()+'/git/blobs',{method:'POST',body:JSON.stringify({content:it.b64,encoding:'base64'})});blobs.push({path:it.path,mode:'100644',type:'blob',sha:b.sha})}
  onStep(1);
  for(let attempt=0;attempt<2;attempt++){
    const ref=await gh(repoPath()+'/git/ref/heads/'+encodeURIComponent(S.conn.branch));
    const head=ref.object.sha,hc=await gh(repoPath()+'/git/commits/'+head);
    const tree=await gh(repoPath()+'/git/trees',{method:'POST',body:JSON.stringify({base_tree:hc.tree.sha,tree:blobs})});
    const cm=await gh(repoPath()+'/git/commits',{method:'POST',body:JSON.stringify({message,tree:tree.sha,parents:[head]})});
    onStep(2);
    try{await gh(repoPath()+'/git/refs/heads/'+encodeURIComponent(S.conn.branch),{method:'PATCH',body:JSON.stringify({sha:cm.sha,force:false})});return cm}
    catch(e){if((e.status===422||e.status===409)&&attempt===0)continue;throw e}
  }
}

const listOf=g=>g==='menu'?S.cfg.menu:g==='tipe'?S.cfg.kasir.tipePesanan:g==='bayar'?S.cfg.kasir.metodeBayar:g==='mtab'?S.cfg.menuBahan.tab:S.cfg.laporan;
function setList(g,l){if(g==='mtab')S.cfg.menuBahan.tab=l;else if(g==='menu')S.cfg.menu=l;else if(g==='tipe')S.cfg.kasir.tipePesanan=l;else if(g==='bayar')S.cfg.kasir.metodeBayar=l;else S.cfg.laporan=l}
function minOneOn(g,l){if(g==='menu')return true;if(!l.some(x=>x.tampil!==false)){toast('Minimal satu komponen harus tampil');return false}return true}
/* Seret dengan pointer (mouse, sentuh, pena) — bekerja juga di tablet & HP */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.handle');if(!h||e.button>0)return;
  const it=h.closest('.it');if(!it)return;e.preventDefault();
  const r=it.getBoundingClientRect(),gh2=it.cloneNode(true);
  gh2.classList.add('ghost');gh2.style.width=r.width+'px';gh2.style.left=r.left+'px';gh2.style.top=r.top+'px';document.body.appendChild(gh2);
  it.classList.add('ph');
  drag={it,ghost:gh2,g:it.dataset.g,dx:e.clientX-r.left,dy:e.clientY-r.top,locked:it.dataset.locked==='1',id:e.pointerId,x:e.clientX,y:e.clientY};
  autoScroll();
  try{h.setPointerCapture(e.pointerId)}catch(x){}
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;e.preventDefault();
  drag.x=e.clientX;drag.y=e.clientY;dragAt();
},{passive:false});
/* gulir otomatis selama jari/kursor ditahan di tepi atas/bawah editor */
function autoScroll(){
  if(!drag)return;
  const ed=$('.ed');
  if(ed){const r=ed.getBoundingClientRect(),edge=70;let v=0;
    if(drag.y<r.top+edge)v=-Math.ceil((r.top+edge-drag.y)/5);else if(drag.y>r.bottom-edge)v=Math.ceil((drag.y-(r.bottom-edge))/5);
    if(v){const before=ed.scrollTop;ed.scrollTop+=v;if(ed.scrollTop!==before)dragAt()}}
  requestAnimationFrame(autoScroll);
}
function dragAt(){
  if(!drag)return;const e={clientX:drag.x,clientY:drag.y};
  drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';
  const el=document.elementFromPoint(e.clientX,e.clientY),zone=el&&el.closest('.zone[data-g="'+drag.g+'"]');
  $$('.zone.drop').forEach(z=>z.classList.remove('drop'));
  if(!zone||drag.it.contains(zone))return;
  if(zone.dataset.zone==='off'&&drag.locked)return;
  if(drag.g==='menu'&&zone.dataset.zone==='on'){const r=findNode(drag.it.dataset.id);if(r&&!fitsAt(r.x,+zone.dataset.depth||1))return}
  zone.classList.add('drop');
  const sib=[...zone.children].filter(x=>x.classList.contains('it')&&x!==drag.it);
  const before=sib.find(x=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  if(before)zone.insertBefore(drag.it,before);else{const emp=[...zone.children].find(c=>c.classList.contains('empty'));zone.insertBefore(drag.it,emp||null);if(emp)emp.remove()}
}
function rebuildMenu(){
  const all=new Map();walkMenu(S.cfg.menu,x=>all.set(x.id,x));
  const parse=(z,tp)=>[...z.children].filter(c=>c.classList.contains('it')).map(el=>{const o=all.get(el.dataset.id),x=Object.assign({},o);x.tampil=tp;
    if(x.jenis==='grup'){const sub=el.querySelector(':scope > .it-sub > .zone');x.anak=sub?parse(sub,true):(o.anak||[])}return x});
  const zOn=$('.zone[data-g="menu"][data-zone="on"][data-depth="1"]'),zOff=$('.zone[data-g="menu"][data-zone="off"]');if(!zOn||!zOff)return;
  const nl=[...parse(zOn,true),...parse(zOff,false)];
  let n=0;walkMenu(nl,()=>n++);if(n===all.size)S.cfg.menu=nl;
}
function endDrag(e){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  const {it,ghost,g}=drag;ghost.remove();it.classList.remove('ph');$$('.zone.drop').forEach(z=>z.classList.remove('drop'));drag=null;
  if(g==='menu'){rebuildMenu();changed();return}
  if(g.startsWith('blk:')){const r=findNode(g.slice(4));const z=$('.zone[data-g="'+g+'"]');if(r&&z){const order=[...z.children].filter(c=>c.classList.contains('it')).map(c=>r.x.blok[+c.dataset.id]);if(order.length===r.x.blok.length)r.x.blok=order}changed();return}
  const cur=listOf(g),byId=Object.fromEntries(cur.map(x=>[x.id,x])),nl=[];
  ['on','off'].forEach(zn=>{const z=$('.zone[data-g="'+g+'"][data-zone="'+zn+'"]');if(!z)return;z.querySelectorAll('.it').forEach(el=>{const x=Object.assign({},byId[el.dataset.id]);x.tampil=zn==='on';nl.push(x)})});
  if(nl.length===cur.length&&minOneOn(g,nl))setList(g,nl);
  changed();
}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
/* keyboard: fokus pegangan ⠿ lalu tekan ↑ / ↓ */
document.addEventListener('keydown',e=>{
  const h=e.target.closest&&e.target.closest('.handle');if(!h||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  const it=h.closest('.it');if(!it)return;e.preventDefault();const g=it.dataset.g,id=it.dataset.id,up=e.key==='ArrowUp';
  if(g==='menu')(up?ACT.mup:ACT.mdown)({dataset:{id}});else if(ACT.up&&!g.startsWith('blk:'))(up?ACT.up:ACT.down)({dataset:{g,id}});else return;
  setTimeout(()=>{const n=document.querySelector('.it[data-g="'+g+'"][data-id="'+id+'"] .handle');if(n)n.focus()},40);
});

function nodeHTML(x,depth,on,prev){
  const kind=MENU[x.id]?'view':x.jenis,locked=isLockedId(x.id),lockSub=hasLocked(x);
  const ico={view:'▣',grup:'▤',halaman:'▧',tautan:'↗'}[kind];
  const orig=MENU[x.id];
  const canIn=on&&prev&&prev.jenis==='grup'&&fitsAt(x,depth+1);
  const acts=on?''
      +(depth>1?'<button class="btn icon sm" data-act="mout" data-id="'+x.id+'" title="Keluarkan dari grup" aria-label="Keluarkan dari grup">⇤</button>':'')
      +(canIn?'<button class="btn icon sm" data-act="min" data-id="'+x.id+'" title="Masukkan ke grup di atasnya" aria-label="Masukkan ke grup di atasnya">⇥</button>':'')
      +(kind==='halaman'?'<button class="btn sm'+(S.editPage===x.id?' dark':'')+'" data-act="pg-edit" data-id="'+x.id+'">Isi</button>':'')
      +(lockSub?'':'<button class="btn icon sm" data-act="mhide" data-id="'+x.id+'" title="Sembunyikan" aria-label="Sembunyikan">−</button>')
    :'<button class="btn icon sm" data-act="mshow" data-id="'+x.id+'" title="Tampilkan" aria-label="Tampilkan">+</button>';
  const del=kind!=='view'?'<button class="btn icon sm danger" data-act="mdel" data-id="'+x.id+'" title="Hapus" aria-label="Hapus">✕</button>':'';
  let html='<div class="it tn'+(kind==='grup'?' grp':'')+'" data-g="menu" data-id="'+x.id+'" data-locked="'+(lockSub?1:0)+'"><div class="it-row"><button class="handle" aria-label="Seret untuk memindah" title="Seret">⠿</button><span class="tn-ico" aria-hidden="true">'+ico+'</span>'
    +'<div class="name"><input class="in" value="'+esc(x.label)+'" data-mlbl="'+x.id+'" maxlength="30" aria-label="Nama menu">'+(orig&&x.label!==orig?'<small>Asli: '+esc(orig)+'</small>':'')+(kind==='grup'&&!on?'<small>'+((x.anak||[]).length)+' isi</small>':'')+'</div>'
    +(kind!=='view'?'<span class="kind '+kind+'">'+KIND[kind]+'</span>':'')
    +(on?'<label class="tg" title="Terlihat oleh kasir"><input type="checkbox" data-mkasir="'+x.id+'"'+(x.kasir?' checked':'')+(locked?' disabled':'')+'>Kasir</label>':'')
    +'<div class="acts">'+acts+(locked?'<span class="lock">🔒</span>':'')+del+'</div></div>';
  if(kind==='tautan')html+='<div class="it-sub" style="margin-top:6px"><input class="in" value="'+esc(x.url)+'" data-murl="'+x.id+'" placeholder="https://…" aria-label="Alamat tautan">'+(urlOk(x.url)?'':'<div class="warn-t">Isi alamat lengkap, mis. https://instagram.com/soankofe</div>')+'</div>';
  if(kind==='halaman'&&S.editPage===x.id)html+=pageEdHTML(x);
  if(kind==='grup'&&on){const kids=x.anak||[];html+='<div class="it-sub"><div class="zone sub" data-g="menu" data-zone="on" data-parent="'+x.id+'" data-depth="'+(depth+1)+'">'+kids.map((k,i)=>nodeHTML(k,depth+1,true,kids[i-1])).join('')+(kids.length?'':'<div class="empty">Seret menu ke sini untuk jadi sub menu</div>')+'</div></div>'}
  return html+'</div>';
}

/* tebak lokasi file di repo */
function guessPath(name){
  const n=name.toLowerCase();
  if(['server.js','panduan.txt','jalankan-server-mac.command','jalankan-server-windows.bat'].includes(n))return 'server/'+name;
  if(/^(icon-|apple-touch-icon).*\.png$/.test(n))return 'icons/'+name;
  if(n==='panel-index.html')return 'developer/index.html';
  if(n==='claude.yml')return '.github/workflows/'+name;
  return name;
}
async function addFiles(list){
  for(const f of list){
    if(f.size>25*1048576){toast(f.name+' terlalu besar (maks 25 MB)');continue}
    const u8=new Uint8Array(await f.arrayBuffer());let warn='';
    if(/^index\.html$/i.test(f.name)){const t=new TextDecoder().decode(u8);if(!/Soan Kofe POS/.test(t))warn='Peringatan: isi tidak terlihat seperti aplikasi Soan Kofe POS. Periksa lokasinya.'}
    if(/\.json$/i.test(f.name)){try{JSON.parse(new TextDecoder().decode(u8))}catch(e){warn='Peringatan: JSON tidak valid.'}}
    if(/^soan-config\.json$/i.test(f.name)){try{S.cfg=normalize(JSON.parse(new TextDecoder().decode(u8)));changed();toast('soan-config.json dimuat ke editor');continue}catch(e){}}
    const path=guessPath(f.name),ex=S.files.findIndex(x=>x.path===path);
    const item={name:f.name,size:f.size,path,b64:b64FromBytes(u8),warn};
    if(ex>=0)S.files[ex]=item;else S.files.push(item);
  }
  render();
}

async function openReview(){
  const ch=changes(),files=S.files;
  let warnRemote='';
  if(S.ok){try{const f=await gh(repoPath()+'/contents/'+CFG_PATH+'?ref='+encodeURIComponent(S.conn.branch));if(f.sha!==S.remoteSha&&cfgChanged())warnRemote='Konfigurasi di GitHub sudah diubah orang lain sejak dimuat. Push akan menimpanya dengan versi di editor ini.'}catch(e){if(e.status!==404&&e.status)warnRemote=''}}
  const empties=files.filter(f=>!f.path);
  const badLinks=[];walkMenu(S.cfg.menu,x=>{if(x.jenis==='tautan'&&!urlOk(x.url))badLinks.push(x.label);if(x.jenis==='halaman')x.blok.forEach(b=>{if((b.t==='gambar'||b.t==='tombol')&&b.url&&!urlOk(b.url))badLinks.push(x.label+' (blok '+BLOK[b.t].toLowerCase()+')')})});
  const listHTML=(ch.length?'<ul class="chg">'+ch.map(c=>'<li><b>'+esc(c[0])+'</b><span>'+esc(c[1])+'</span></li>').join('')+'</ul>':cfgChanged()?'<ul class="chg"><li><b>Konfigurasi</b><span>Penyesuaian format soan-config.json</span></li></ul>':'')
   +(files.length?'<div class="lbl" style="margin:8px 0 6px">File kode ('+files.length+')</div><ul class="chg">'+files.map(f=>'<li><b>'+(S.paths.has(f.path)?'Ganti':'Baru')+'</b><span><code>'+esc(f.path||'(lokasi kosong)')+'</code> · '+fmtSize(f.size)+'</span></li>').join('')+'</ul>':'');
  const summary=ch.length?ch.slice(0,3).map(c=>c[0].toLowerCase()+': '+c[1]).join('; ')+(ch.length>3?' (+'+(ch.length-3)+' lagi)':''):files.length?'perbarui '+files.map(f=>f.path).join(', '):'penyesuaian konfigurasi';
  const msg=('Panel Developer: '+summary).slice(0,200);
  const can=S.ok&&S.canPush&&!empties.length;
  modal('Review perubahan',
    (warnRemote?'<div class="warn-box">'+esc(warnRemote)+'</div>':'')
    +'<p class="muted" style="margin-top:0">Periksa daftar di bawah dan pratinjau di samping. Setelah di-Push, situs GitHub Pages diperbarui dalam 1–3 menit dan semua perangkat ikut ter-update.</p>'+listHTML
    +'<div class="fld" style="margin-top:12px"><label class="lbl" for="cm">Catatan perubahan (pesan commit)</label><input class="in" id="cm" value="'+esc(msg)+'" maxlength="200"></div>'
    +(S.ok?(S.canPush?'':'<div class="warn-box">Token tidak punya izin menulis. Perbarui token di Koneksi GitHub.</div>'):'<div class="warn-box">Belum tersambung ke GitHub. Sambungkan di menu Koneksi GitHub, atau unduh soan-config.json lalu unggah manual ke repo.</div>')
    +(empties.length?'<div class="warn-box">Ada file tanpa lokasi. Isi lokasinya di menu Unggah file kode.</div>':'')
    +(badLinks.length?'<div class="warn-box">Alamat belum benar, akan diabaikan aplikasi: '+esc(badLinks.join(', '))+'</div>':'')
    +'<div class="steps" id="steps" hidden><div>Mengunggah isi file</div><div>Menyusun commit</div><div>Memperbarui branch '+esc(S.conn.branch)+'</div></div>',
    (cfgChanged()?'<button class="btn" data-act="download">Unduh soan-config.json</button>':'')+'<button class="btn" data-act="close">Kembali</button><button class="btn primary" data-act="push"'+(can?'':' disabled')+'>Push ke GitHub</button>');
}
async function doPush(){
  const msg=($('#cm').value||'').trim()||'Panel Developer: perbarui tampilan';
  const btn=$('[data-act="push"]'),st=$('#steps');btn.disabled=true;btn.textContent='Mem-push…';$$('.modal-f .btn').forEach(b=>b.disabled=true);st.hidden=false;
  const steps=[...st.children];const mark=i=>steps.forEach((s,j)=>{s.className=j<i?'done':j===i?'run':''});
  try{
    const cm=await pushAll(msg+'\n\nDibuat dengan Soan Panel Developer',mark);
    steps.forEach(s=>s.className='done');
    const pushed=S.files.map(f=>f.path),hadCfg=cfgChanged();
    S.base=clone(S.cfg);S.files=[];S.history=null;S.headSha=cm.sha;pushed.forEach(p=>S.paths.add(p));if(hadCfg)S.paths.add(CFG_PATH);
    try{const f=await gh(repoPath()+'/contents/'+CFG_PATH+'?ref='+encodeURIComponent(S.conn.branch));S.remoteSha=f.sha}catch(e){}
    saveDraft();render();
    const site='https://'+S.conn.owner.toLowerCase()+'.github.io/'+S.conn.repo+'/';
    modal('Berhasil di-push ✓','<p>Perubahan sudah masuk ke GitHub sebagai commit <a href="'+esc(cm.html_url||('https://github.com/'+S.conn.owner+'/'+S.conn.repo+'/commit/'+cm.sha))+'" target="_blank" rel="noopener"><code>'+esc(cm.sha.slice(0,7))+'</code></a>.</p><ul class="chg"><li><b>1–3 menit</b><span>GitHub Pages memperbarui <a href="'+esc(site)+'" target="_blank" rel="noopener">'+esc(site.replace('https://',''))+'</a></span></li><li><b>Perangkat</b><span>Tablet, HP, dan laptop memakai tampilan baru saat aplikasi dibuka ulang.</span></li><li><b>Server lokal</b><span>Mengambil pembaruan dari GitHub otomatis (maks. 10 menit) bila tersambung internet.</span></li></ul>','<a class="btn" href="https://github.com/'+esc(S.conn.owner)+'/'+esc(S.conn.repo)+'/actions" target="_blank" rel="noopener">Lihat proses di GitHub</a><button class="btn primary" data-act="close">Selesai</button>');
  }catch(e){
    toast(ghErr(e));btn.textContent='Coba lagi';$$('.modal-f .btn').forEach(b=>b.disabled=false);
    const r=steps.find(s=>s.className==='run');if(r)r.style.color='var(--bad)';
  }
}

/* ---------- modal & toast ---------- */
function modal(title,body,foot){$('#modal-root').innerHTML='<div class="modal-bg" data-act="bg"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="modal-h"><h3>'+esc(title)+'</h3><button class="btn icon sm" data-act="close" aria-label="Tutup">✕</button></div><div class="modal-b">'+body+'</div>'+(foot?'<div class="modal-f">'+foot+'</div>':'')+'</div></div>'}
function closeModal(){$('#modal-root').innerHTML=''}
function confirmBox(t,m,yes,cb){S.confirmCb=cb;modal(t,'<p>'+esc(m)+'</p>','<button class="btn" data-act="close">Kembali</button><button class="btn danger" data-act="confirm-yes">'+esc(yes)+'</button>')}
let tt=null;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-root').firstChild)closeModal()});
addEventListener('beforeunload',e=>{if(S.files.length){e.preventDefault();e.returnValue=''}});

/* ---------- mulai ---------- */
if(innerWidth<=860&&!S.conn.token)S.sec=S.sec||'menu';
render();
if(S.conn.token)connect(true);
})();
</script>
